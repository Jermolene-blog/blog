<style>
/* Layout: the 3D meadow fills the screen. Home = a row of picture tiles over the grazing herd; in a game only a home button, a star tally and a speech bubble float on top. Single daylight look. */
:root{
  --sky:#bfe3f2; --ink:#22311f; --soft:#4d5e48; --card:rgba(255,255,255,.9); --line:rgba(34,49,31,.12);
  --accent:#e0702c; --accent-ink:#fff; --gold:#f4b73c;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{position:relative;height:100%;width:100%;touch-action:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* home */
.home{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;overflow-y:auto}
.home>*{pointer-events:auto}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px}
.title{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 16px;max-width:46ch;backdrop-filter:blur(6px)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);line-height:1.05;margin:0}
.title p{margin:4px 0 0;font-size:14px;color:var(--soft);line-height:1.4}
.pill{font-family:var(--display);font-weight:500;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:42px;backdrop-filter:blur(6px)}
.pill[aria-pressed="false"]{color:var(--soft)}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;max-width:100%}
.voicebox{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px;backdrop-filter:blur(6px);min-width:0;max-width:100%}
.voicebox label{font-family:var(--display);font-weight:500;font-size:15px}
.voicebox select{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;min-width:0;max-width:min(260px,52vw);padding:6px 2px;text-overflow:ellipsis}
.voicebox select:focus-visible{outline:3px solid var(--accent);border-radius:8px}
.pill.small{min-height:36px;padding:6px 14px;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:1100px;width:100%;margin:0 auto}
.tile{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0 0 12px;overflow:hidden;backdrop-filter:blur(6px);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:scale(.97)}
.tile .pic{aspect-ratio:4/3;max-width:100%;display:block;background:linear-gradient(#cfe9f5,#e5f2da)}
.tile .pic img{width:100%;height:100%;object-fit:contain;display:block}
.tile b{font-family:var(--display);font-weight:600;font-size:20px;padding:8px 12px 0;line-height:1.15}
.tile span{font-size:13px;color:var(--soft);padding:3px 12px 0;line-height:1.35}
.order{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:0 auto -6px;max-width:1100px;width:100%;padding-left:4px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.controls{justify-content:flex-start}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile b{font-size:17px}.tile span{display:none}.home{justify-content:flex-start}.tiles{margin-top:auto}}

/* in-game */
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
#back{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;backdrop-filter:blur(6px)}

#stars svg{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
#action{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));font-family:var(--display);font-weight:600;font-size:24px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 30px;box-shadow:0 6px 0 #a94d17,0 10px 20px rgba(0,0,0,.18)}
#action:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #a94d17}
#say{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--display);font-weight:600;font-size:clamp(26px,5vw,40px);background:#fff;color:var(--ink);padding:6px 24px 8px;border-radius:24px;box-shadow:0 6px 18px rgba(0,0,0,.15);white-space:nowrap;max-width:calc(100% - 180px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#say.show{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@media (max-width:560px){#say{top:84px;max-width:calc(100% - 32px)}}
@keyframes pop{from{transform:translateX(var(--tx,0)) scale(.5);opacity:0}to{transform:translateX(var(--tx,0)) scale(1);opacity:1}}
#say{--tx:-50%}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--soft);background:var(--sky)}
@media (prefers-reduced-motion:reduce){.tile,#say.show,#stars svg{animation:none;transition:none}}

const canvas=document.getElementById('world');

const scene=new THREE.Scene();

// ---------------- tasks: tweens and timers ----------------

// ---------------- sky presets ----------------
const starsGeo=new THREE.BufferGeometry();{const p=[];for(let i=0;i<500;i++){const a=Math.random()*6.28,e=rr(0.12,1.4),r=150;p.push(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r,Math.sin(a)*Math.cos(e)*r)}starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(p,3))}

const moonMat=new THREE.MeshBasicMaterial({color:0xfff4d2,transparent:true,opacity:0,fog:false});
const moon=new THREE.Mesh(new THREE.SphereGeometry(5,24,16),moonMat);moon.position.set(-45,40,-110);scene.add(moon);
const SKIES={
  day:{sky:0xbfe3f2,hemi:0xdff1ff,ground:0x5e8a45,hi:1.7,sun:0xfff1dc,si:2.6,pos:[9,16,7],night:0},
  dusk:{sky:0xf1b48f,hemi:0xffd7c2,ground:0x6b7a3e,hi:1.25,sun:0xffa26a,si:2.2,pos:[15,7,5],night:0},
  night:{sky:0x1b2547,hemi:0x7486c8,ground:0x1c2a22,hi:0.6,sun:0xa9bbff,si:0.55,pos:[-8,15,6],night:1},
};
const skyState={sky:new THREE.Color(),hemi:new THREE.Color(),ground:new THREE.Color(),hi:1.7,sun:new THREE.Color(),si:2.6,pos:new THREE.Vector3(),night:0};
const nightHooks=[];
function applySky(){
  scene.background.copy(skyState.sky);scene.fog.color.copy(skyState.sky);
  hemi.color.copy(skyState.hemi);hemi.groundColor.copy(skyState.ground);hemi.intensity=skyState.hi;

function setSky(name,dur=0){

  const tc=k=>{const c=new THREE.Color();return x=>c.copy(from[x]).lerp(new THREE.Color(to[x]),k)};
  const step=k=>{const L=tc(k);skyState.sky.copy(L('sky'));skyState.hemi.copy(L('hemi'));skyState.ground.copy(L('ground'));skyState.sun.copy(L('sun'));

  if(dur<=0){step(1);return}
  tween(dur,step);
}
skyState.sky.set(SKIES.day.sky);skyState.hemi.set(SKIES.day.hemi);skyState.ground.set(SKIES.day.ground);skyState.sun.set(SKIES.day.sun);skyState.pos.set(...SKIES.day.pos);applySky();

// ---------------- scenery helpers ----------------
const mats={};
const mat=(hex,o)=>{const k=hex+(o?JSON.stringify(o):'');return mats[k]||(mats[k]=new THREE.MeshLambertMaterial({color:hex,flatShading:true,...(o||{})}))};
function jitter(geo,amt){const p=geo.attributes.position,m=new Map();
  for(let i=0;i<p.count;i++){const k=`${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;

function tree(kind){

    [0x2f6b3e,0x3a7d47,0x47904f].forEach((c,i)=>add(jitter(new THREE.ConeGeometry((1.05-i*0.27)*2.1,h*0.42,7),0.1),c,h*(0.38+i*0.2)));

    add(new THREE.CylinderGeometry(0.13,0.18,h*0.6,6),0xeeeae0,h*0.3);

  const S=180,seg=150,g=new THREE.PlaneGeometry(S,S,seg,seg);g.rotateX(-Math.PI/2);
  const p=g.attributes.position,col=[],c=new THREE.Color();
  const A=new THREE.Color(0x7cb350),B=new THREE.Color(0x5f9a3e),C=new THREE.Color(0x9cc45a);

  for(let i=0;i<tuft.count;i++){const a=Math.random()*6.28,d=Math.sqrt(Math.random())*34,x=Math.cos(a)*d,z=Math.sin(a)*d;
    dummy.position.set(x,groundY(x,z)+0.15,z);dummy.rotation.set(rr(-.25,.25),Math.random()*6,rr(-.25,.25));dummy.scale.setScalar(rr(0.6,1.4));dummy.updateMatrix();
    tuft.setMatrixAt(i,dummy.matrix);tuft.setColorAt(i,cl.setHSL(rr(0.24,0.3),rr(0.45,0.6),rr(0.3,0.42)))}

    dummy.position.set(x,groundY(x,z)+0.25,z);dummy.rotation.set(0,0,0);dummy.scale.setScalar(rr(0.8,1.3));dummy.updateMatrix();fl.setMatrixAt(i,dummy.matrix);fl.setColorAt(i,cl.setHex(fc[Math.floor(i/30)%4]))}

}

// a round leafy bush big enough to hide an animal of size ~1.9
function makeBush(){
  const g=new THREE.Group(),greens=[0x4f9a44,0x5aa84a,0x3f8a3c,0x67b452];

    }
    view.target.set(0,0.9,0);view.el=rows>1?0.88:0.36;view.hw=cols*sp/2+0.2;view.hh=rows>1?6.6:2.9;
    S.rustle=2.5;
    after(0.9,()=>say("Peekaboo! Who's hiding?","Who's hiding?"));
  },
  hide(s,id){
    if(s.a)removeAnimal(s.a);
    const a=makeAnimal(id,1.9);a.holder.position.copy(s.pos);face(a,(s.pos.x<=0?1:-1)*rr(0.4,0.9));group.add(a.holder);s.a=a;
  },
  tap(t){
    const s=t&&t.slot;if(!s||s.busy)return;
    if(s.open){hop(s.a);say(NAME[s.a.id],cap(NAME[s.a.id])+'!');if(s.closeTask)s.closeTask.dead=true;s.closeTask=after(3,()=>this.close(s));return}
    s.open=s.busy=true;sfx.pop();sfx.rustle();
    burst(new THREE.Vector3(s.pos.x,1.6,s.pos.z),26,LEAVES,{speed:5,up:5,size:1.4});
    const b=s.bush;tween(0.32,k=>{b.scale.set(1+k*0.15,Math.max(1-k,0.02),1+k*0.15)},{e:ease.in,done:()=>{b.visible=false}});
    after(0.18,()=>{hop(s.a);say(`Peekaboo! ${cap(NAME[s.a.id])}!`,cap(NAME[s.a.id])+'!')});
    after(0.6,()=>s.busy=false);
    s.closeTask=after(3.4,()=>this.close(s));
  },
  close(s){
    s.busy=true;const b=s.bush;b.visible=true;sfx.rustle();
    tween(0.55,k=>b.scale.setScalar(Math.max(k,0.02)),{e:ease.back,done:()=>{
      const others=S.slots.filter(o=>o!==s).map(o=>o.a.id);
      const choices=Object.keys(templates).filter(id=>id!==s.a.id&&!others.some(o=>sameGroup(o,id)));
      this.hide(s,pick(choices));s.open=false;s.busy=false}});
  },
  tick(dt){
    S.rustle-=dt;
    if(S.rustle<=0){S.rustle=rr(2.5,4.5);const closed=S.slots.filter(s=>!s.open&&!s.busy);if(closed.length){const s=pick(closed),b=s.bush;
      tween(0.8,k=>{b.rotation.z=Math.sin(k*Math.PI*6)*0.06*(1-k);b.rotation.x=Math.cos(k*Math.PI*5)*0.04*(1-k)});sfx.rustle()}}
  }
};

// ---- 2. All fall down ----
GAMES.fall={
  title:'All fall down',blurb:'The animals walk round in a ring. Any tap and they all tumble over, then get back up.',thumb:['Alpaca','Death',0.22],
  action:'All fall down!',
  start(){
    const n=aspect()>0.9?6:5,R=4.6;
    const t=tree('round');t.scale.setScalar(0.8);group.add(t);
    const ring=new THREE.Mesh(new THREE.RingGeometry(R-0.9,R+0.9,64),new THREE.MeshLambertMaterial({color:0x8fbf5a,transparent:true,opacity:0.55}));ring.rotation.x=-Math.PI/2;ring.position.y=0.02;ring.receiveShadow=true;group.add(ring);
    S.R=R;S.w=0.95/R;S.down=false;S.list=distinct(n).map((id,i)=>{const a=makeAnimal(id,2.0);a.rest='walk';a.ang=i/n*Math.PI*2;
      group.add(a.holder);play(a,'walk',{ts:THREE.MathUtils.clamp(0.95/(a.h*0.8),0.6,1.5)});addTarget(a.hit,{a});popIn(a,0.1+i*0.08);return a});
    view.target.set(0,0.6,0);view.el=0.6;view.hw=R+1.6;view.hh=R*0.75+1.8;
    after(0.8,()=>say('Round and round they go. Tap to make them fall down!','Tap to fall down!',3));
  },
  tap(){
    if(S.down)return;S.down=true;sfx.tumble();
    say('A-tishoo! A-tishoo! We all fall down!','We all fall down!',2.8);
    let longest=0;
    S.list.forEach((a,i)=>{const delay=0.25+i*0.13;
      after(delay,()=>{a.down=true;if(a.shotTask)a.shotTask.dead=true;a.lock=true;const d=play(a,'death',{once:true,fade:0.12});
        after(d+1.6,()=>{const act=a.cur;act.paused=false;act.enabled=true;act.timeScale=-rr(0.9,1.15);
          after(d/Math.abs(act.timeScale),()=>{a.down=false;a.lock=false;play(a,'walk',{ts:THREE.MathUtils.clamp(0.95/(a.h*0.8),0.6,1.5),fade:0.35})})})});
      longest=Math.max(longest,delay)});
    const dmax=Math.max(...S.list.map(a=>a.act.Death?a.act.Death.getClip().duration:1.5));
    after(longest+dmax*2+2,()=>{S.down=false});
  },
  tick(dt){
    for(const a of S.list){if(a.down)continue;a.ang+=S.w*dt;
      a.holder.position.set(Math.cos(a.ang)*S.R,0,Math.sin(a.ang)*S.R);face(a,Math.atan2(-Math.sin(a.ang),Math.cos(a.ang)))}
  }
};

// ---- 3. Bedtime: send everyone into the barn ----
GAMES.bed={
  title:'Bedtime',blurb:'Tap each animal and it runs into the barn. When everyone is in, night falls. Tap again for morning.',thumb:['Horse','Gallop',0.3],
  sky:'dusk',
  start(){
    const wide=aspect()>1.1;
    S.barn=makeBarn();S.barn.g.position.set(0,0,-6);group.add(S.barn.g);
    nightHooks.push(v=>S.barn.winMat.emissiveIntensity=v*1.6);
    S.door=new THREE.Vector3(0,0,-6+S.barn.front);
    S.n=wide?6:5;S.wide=wide;S.phase='day';
    this.spawnAll(false);
    view.target.set(0,0.9,-1.6);view.el=0.5;view.hw=wide?8.4:5.2;view.hh=wide?5:6.6;
    after(0.9,()=>say('Time for bed! Tap the animals.','Time for bed!',3));
  },
  spots(n){
    const pts=[];let tries=0;
    while(pts.length<n&&tries++<500){const p=new THREE.Vector3(S.wide?rr(-7,7):rr(-4.2,4.2),0,S.wide?rr(-1.2,4):rr(-1,5.5));
      if(Math.abs(p.x)<1.6&&p.z<0.2)continue;if(pts.every(q=>q.distanceTo(p)>2.9))pts.push(p)}
    return pts;
  },
  spawnAll(fromBarn){
    const ids=distinct(S.n),pts=this.spots(S.n);S.list=[];S.inside=0;
    ids.forEach((id,i)=>{const a=makeAnimal(id,2.0);group.add(a.holder);
      const t=addTarget(a.hit,{a});a.t=t;S.list.push(a);
      if(fromBarn){a.holder.position.set(S.door.x,0,S.door.z-0.6);face(a,0);a.holder.scale.setScalar(1e-4);t.enabled=false;
        after(0.3+i*0.45,()=>{tween(0.3,k=>a.holder.scale.setScalar(Math.max(k,1e-4)));
          goTo(a,[new THREE.Vector3(S.door.x,0,S.door.z+1.4),pts[i]],{gait:'gallop',onArrive:()=>{play(a,'idle');t.enabled=true}})})}
      else{a.holder.position.copy(pts[i]);face(a,rr(0.5,1.9)*(Math.random()<0.5?-1:1));play(a,'idle');popIn(a,0.15+i*0.1)}});
  },
  tap(t){
    if(S.phase==='night'){if(S.canWake)this.wake();return}
    if(S.phase!=='day')return;
    const a=t&&t.a;if(!a||a.going)return;
    a.going=true;t.enabled=false;sfx.pop();
    say(`Night night, ${NAME[a.id]}!`,`Night night, ${NAME[a.id]}`,2.2);
    if(!S.doorOpen){S.doorOpen=true;S.barn.open()}
    const p=a.holder.position,front=new THREE.Vector3(S.door.x+THREE.MathUtils.clamp(p.x*0.15,-0.6,0.6),0,S.door.z+1.6);
    goTo(a,[front,new THREE.Vector3(S.door.x,0,S.door.z-0.4)],{gait:'gallop',onArrive:()=>{
      tween(0.25,k=>a.holder.scale.setScalar(Math.max(1-k,1e-4)),{done:()=>{removeAnimal(a);dropTarget(t);S.inside++;
        if(S.inside===S.list.length)this.night()}})}});
  },
  night(){
    S.phase='dusk';S.doorOpen=false;S.barn.close();
    after(0.6,()=>{setSky('night',2.6);sfx.lullaby();say('Night night, everyone. Sleep tight!','Sleep tight!',3.5)});
    after(3.4,()=>{S.phase='night';S.canWake=false;after(1.5,()=>{S.canWake=true;actionEl.textContent='Good morning!';actionEl.hidden=false})});
  },
  wake(){
    S.phase='morning';actionEl.hidden=true;setSky('day',2);sfx.morning();say('Good morning!','Good morning!');
    after(1.2,()=>{S.barn.open();S.doorOpen=true;this.spawnAll(true)});
    after(1.2+S.n*0.45+3,()=>{S.barn.close();S.doorOpen=false});
    after(1.2+S.n*0.45+9,()=>{setSky('dusk',3);after(2.6,()=>{S.phase='day';say('Time for bed again!','Time for bed!')})});
  },
};

// ---- 4. Find the same ----
GAMES.same={
  title:'Find the same',blurb:'Tap the animal that matches the one on the stand. Starts with 2 to choose from and grows to 4.',thumb:['Cow','Idle_2',0.4],
  start(){
    S.round=0;S.score=0;stars(0);
    const pod=new THREE.Group();
    const base=new THREE.Mesh(new THREE.CylinderGeometry(1.9,2.05,0.45,10),mat(0xb07a45));base.position.y=0.22;pod.add(base);
    const top=new THREE.Mesh(new THREE.CylinderGeometry(1.75,1.75,0.06,10),mat(0xe0a35c));top.position.y=0.47;pod.add(top);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.95,0.09,5,30),mat(0xf2c14e));ring.rotation.x=Math.PI/2;ring.position.y=0.45;pod.add(ring);
    shadows(pod);pod.position.set(0,0,-2.8);group.add(pod);S.pod=pod;
    this.round();
  },
  round(){
    const wide=aspect()>1.15;
    const n=S.round<3?2:S.round<7?3:(wide?4:3);
    const id=pick(Object.keys(templates));S.id=id;
    const ids=shuffle([id,...distinct(n-1,[id])]);
    const sp=wide?3.4:3.0;
    S.target=makeAnimal(id,2.3);S.target.holder.position.set(0,0.5,-2.8);face(S.target,0.55);group.add(S.target.holder);popIn(S.target,0);
    S.pt=addTarget(S.target.hit,{a:S.target,stand:true});
    S.choices=ids.map((cid,i)=>{const a=makeAnimal(cid,2.3);const x=(i-(n-1)/2)*sp;a.holder.position.set(x,0,1.8);face(a,x<-0.1?0.75:x>0.1?-0.75:0.4);
      group.add(a.holder);popIn(a,0.35+i*0.15);a.t=addTarget(a.hit,{a,choice:cid});return a});
    view.target.set(0,1.0,-0.5);view.el=0.4;view.hw=Math.max(n*sp/2+0.3,3.9);view.hh=3.1;fit();
    S.busy=false;S.idle=0;
    after(0.9,()=>this.prompt());
  },
  prompt(){say(`Find the ${NAME[S.id]}!`,`Find the ${NAME[S.id]}`,3);hop(S.target)},
  tap(t){
    if(!t||S.busy)return;S.idle=0;
    if(t.stand){this.prompt();return}
    if(t.choice===S.id){
      S.busy=true;sfx.yay();hop(t.a);after(0.25,()=>hop(S.target));
      const p=t.a.holder.position;burst(new THREE.Vector3(p.x,t.a.h+0.4,p.z),46);
      say(`Yes! ${cap(NAME[S.id])}!`,`${cap(NAME[S.id])}!`);
      S.score++;S.round++;stars(S.score%10||10);
      if(S.score%10===0)after(0.6,()=>{sfx.fanfare();burst(new THREE.Vector3(0,3,0),120,CONFETTI,{speed:8,up:9})});
      after(2.6,()=>{[S.target,...S.choices].forEach((a,i)=>after(i*0.07,()=>popOut(a)));targets=[];
        after(0.75,()=>{if(S.score%10===0)stars(0);this.round()})});
    }else{sfx.boop();flinch(t.a);say(`That's the ${NAME[t.choice]}.`,cap(NAME[t.choice]),1.8)}
  },
  tick(dt){
    if(S.busy)return;S.idle+=dt;
    if(S.idle>8){S.idle=0;this.prompt();const right=S.choices.find(a=>a.id===S.id);right&&after(0.8,()=>!right.lock&&hop(right))}
  }
};

// ---- 5. Pairs (memory) ----
GAMES.pairs={
  title:'Pairs',blurb:'Lift the haystacks two at a time to find matching animals. Starts with 2 pairs, then 3, then 4.',thumb:['ShibaInu','Idle_2',0.2],
  start(){S.level=0;S.score=0;stars(0);this.deal()},
  deal(){
    const pairs=[2,3,4][Math.min(S.level,2)],n=pairs*2,a=aspect();
    const cols=a>1.2?(n===6?3:4):(a>0.8?(n===4?2:n===6?3:4):2),rows=n/cols,sp=3.5;
    const ids=distinct(pairs),deck=shuffle([...ids,...ids]);
    S.cards=deck.map((id,i)=>{
      const c=i%cols,r=Math.floor(i/cols),pos=new THREE.Vector3((c-(cols-1)/2)*sp,0,(r-(rows-1)/2)*sp);
      const an=makeAnimal(id,1.85);an.holder.position.copy(pos);face(an,rr(-0.9,0.9));group.add(an.holder);
      const hay=makeHay();hay.position.copy(pos);hay.rotation.y=Math.random()*6;group.add(hay);
      hay.scale.setScalar(1e-4);after(0.1+i*0.08,()=>{sfx.pop(0.5);tween(0.45,k=>hay.scale.setScalar(Math.max(k,1e-4)),{e:ease.back})});
      const hit=new THREE.Mesh(HITGEO,HITMAT);hit.visible=false;hit.scale.set(1.75,1.7,1.75);hit.position.set(pos.x,1.2,pos.z);group.add(hit);
      const card={id,a:an,hay,pos,open:false,matched:false};card.t=addTarget(hit,{card});return card});
    S.first=null;S.lock=false;S.found=0;S.pairs=pairs;
    view.target.set(0,0.6,0.2);view.el=rows>1?0.95:0.55;view.hw=cols*sp/2+0.2;view.hh=rows*sp/2*Math.sin(view.el)+2.3;fit();
    after(0.9,()=>say('Find two the same!','Find two the same',2.6));
  },
  open(c){
    c.open=true;sfx.pop();const h=c.hay;burst(new THREE.Vector3(c.pos.x,2,c.pos.z),14,HAY,{speed:3,up:4,size:1.2});
    tween(0.45,k=>{h.position.y=k*3.1;h.scale.setScalar(1-k*0.7);h.rotation.y+=0.08},{e:ease.out});
    after(0.2,()=>hop(c.a));
  },
  close(c){
    c.open=false;const h=c.hay;sfx.whoosh();
    tween(0.5,k=>{h.position.y=3.1*(1-k);h.scale.setScalar(0.3+0.7*k)},{e:ease.bounce});
  },
  tap(t){
    const c=t&&t.card;if(!c)return;
    if(c.matched){if(!c.a.lock){hop(c.a);say(NAME[c.id],cap(NAME[c.id]),1.5)}return}
    if(S.lock||c.open)return;
    this.open(c);say(NAME[c.id],cap(NAME[c.id]),1.6);
    if(!S.first){S.first=c;return}
    const f=S.first;S.first=null;S.lock=true;
    if(f.id===c.id){
      after(0.7,()=>{sfx.yay();hop(f.a);hop(c.a);
        for(const k of [f,c]){burst(new THREE.Vector3(k.pos.x,2.2,k.pos.z),36);const h=k.hay;tween(0.35,q=>h.scale.setScalar(Math.max(0.3*(1-q),1e-4)),{e:ease.inBack,done:()=>h.visible=false})}
        say(`Two ${PLURAL[c.id]}!`,`Two ${PLURAL[c.id]}!`);
        f.matched=c.matched=true;S.found++;S.score++;stars(S.score%10||10);S.lock=false;
        if(S.found===S.pairs)this.win()});
    }else{
      after(1.7,()=>{this.close(f);this.close(c);after(0.5,()=>S.lock=false)});
    }
  },
  win(){
    S.lock=true;S.level++;
    after(1.2,()=>{sfx.fanfare();say('You found them all!','You found them all!',3);
      S.cards.forEach((c,i)=>after(i*0.12,()=>hop(c.a)));burst(new THREE.Vector3(0,3,0),110,CONFETTI,{speed:8,up:9})});
    after(4.4,()=>{S.cards.forEach((c,i)=>after(i*0.05,()=>popOut(c.a)));
      after(0.7,()=>{for(const c of S.cards)group.remove(c.hay);targets=[];if(S.score%10===0)stars(0);this.deal()})});
  }
};

const ORDER=['peek','fall','bed','same','pairs'];

// ---------------- load models, thumbnails, go ----------------
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const parse=id=>new Promise((res,rej)=>{const bin=Uint8Array.from(atob(MODELS[id]),c=>c.charCodeAt(0));loader.parse(bin.buffer,'',g=>res([id,g]),rej)});
Promise.all(Object.keys(MODELS).map(parse)).then(list=>{
  for(const [id,g] of list){
    const root=g.scene;root.updateMatrixWorld(true);
    const head=root.getObjectByName('Head'),body=root.getObjectByName('Body')||root.getObjectByName('Torso');
    let yaw=0;if(head&&body){const a=head.getWorldPosition(new THREE.Vector3()),b=body.getWorldPosition(new THREE.Vector3());yaw=Math.atan2(a.x-b.x,a.z-b.z)}
    const wrap=new THREE.Group();wrap.add(root);root.rotation.y=-yaw;wrap.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(wrap),c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());
    root.position.set(-c.x,-box.min.y,-c.z);
    templates[id]={scene:wrap,clips:g.animations,len:s.z,wid:s.x,height:s.y};
  }
  makeTiles();buildEnvironment();
  document.getElementById('loading').remove();
  resize();start('home');
  renderer.setAnimationLoop(loop);
}).catch(e=>{document.getElementById('loading').textContent='The animals could not load. Reload the page to try again.';console.error(e)});

function makeTiles(){
  const tr=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});tr.setSize(320,240,false);tr.outputColorSpace=THREE.SRGBColorSpace;
  const ts=new THREE.Scene();ts.add(new THREE.HemisphereLight(0xffffff,0x88a070,2.2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,5,4);ts.add(dl);
  const cam=new THREE.PerspectiveCamera(30,4/3,0.01,100);
  const box=document.getElementById('tiles');
  for(const key of ORDER){
    const G=GAMES[key],[id,clip,frac]=G.thumb,T=templates[id];
    const m=SkeletonUtils.clone(T.scene);const k=2/Math.max(T.len,T.height);m.scale.setScalar(k);m.rotation.y=0.8;ts.add(m);
    const mx=new THREE.AnimationMixer(m);const cl=T.clips.find(c=>c.name===clip)||T.clips[0];const ac_=mx.clipAction(cl);ac_.play();mx.update(cl.duration*frac);
    const h=T.height*k,ly=h*0.45;cam.position.set(0,ly+0.9,3.6);cam.lookAt(0,ly,0);
    tr.render(ts,cam);const url=tr.domElement.toDataURL('image/png');ts.remove(m);mx.stopAllAction();
    const b=document.createElement('button');b.className='tile';b.id='tile-'+key;
    b.innerHTML=`<div class="pic"><img alt="" src="${url}"></div><b>${G.title}</b><span>${G.blurb}</span>`;
    b.onclick=()=>{audio();start(key)};box.appendChild(b);
  }
  tr.dispose();tr.forceContextLoss();
}

const clock=new THREE.Clock();let dtCap=0.05;
function loop(){
  const dt=Math.min(clock.getDelta(),dtCap);
  runTasks(dt);
  game&&game.tick&&game.tick(dt);
  moveAnimals(dt);updateAnimals(dt);updateParticles(dt);
  renderer.render(scene,camera);
}
window.__meadow={set dtCap(v){dtCap=v},start,GAMES,get S(){return S},get targets(){return targets},camera};

</script>
