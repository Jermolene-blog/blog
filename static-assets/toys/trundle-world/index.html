<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7cc8ff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="../pwa.js" defer></script>
<title>Trundle World</title>
<meta name="description" content="A little 3D island for small children to poke at: cars and a steam train trundle round, a volcano erupts, dinosaurs graze, parachutists drop from aeroplanes, and everything reacts when tapped, by day or night, in four sizes of town">
<meta name="toy-category" content="games">
<style>
/* Layout: full-bleed 3D diorama, a name pill top-left, a row of big round toy buttons along the bottom. Single deliberate sky look (day/night handled in-scene). */
:root{
  --sky-top:#7cc8ff; --sky-bot:#d9f1ff;
  --night-top:#0d1640; --night-bot:#2b3d7a;
  --ink:#24305e; --pill:#ffffff; --btn:#ffd23f; --btn-edge:#e0a400; --btn-alt:#ff7a59; --btn-alt-edge:#d94f2f;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;background:var(--sky-top);color:var(--ink);font-family:var(--display)}
#sky,#night{position:fixed;inset:0;z-index:0}
#sky{background:linear-gradient(var(--sky-top),var(--sky-bot))}
#night{background:linear-gradient(var(--night-top),var(--night-bot));opacity:0;transition:opacity 1.2s ease}
#stars{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%}
canvas#c{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;outline:none}
.name{position:fixed;z-index:2;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));
  background:var(--pill);padding:6px 16px 7px;border-radius:999px;font-weight:600;font-size:22px;letter-spacing:.01em;
  box-shadow:0 4px 0 rgba(36,48,94,.18);user-select:none;pointer-events:none}
.hint{position:fixed;z-index:2;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));
  background:rgba(255,255,255,.92);padding:8px 16px;border-radius:999px;font-size:16px;font-weight:500;white-space:nowrap;
  transition:opacity .8s ease;pointer-events:none;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.bar{position:fixed;z-index:2;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.bar button{pointer-events:auto;width:66px;height:66px;border-radius:50%;border:0;background:var(--btn);color:var(--ink);
  box-shadow:0 6px 0 var(--btn-edge),0 10px 16px rgba(20,30,70,.25);display:grid;place-items:center;cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease;-webkit-tap-highlight-color:transparent}
.bar button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--btn-edge),0 3px 6px rgba(20,30,70,.25)}
.bar button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.bar button.on{background:var(--btn-alt);box-shadow:0 6px 0 var(--btn-alt-edge),0 10px 16px rgba(20,30,70,.25);color:#fff}
.bar svg{width:36px;height:36px}
@media (max-width:640px){.bar{gap:8px}.bar button{width:54px;height:54px}.bar svg{width:30px;height:30px}}
@media (max-width:440px){.bar{gap:6px;padding-left:8px;padding-right:8px}.bar button{width:46px;height:46px;box-shadow:0 4px 0 var(--btn-edge),0 6px 10px rgba(20,30,70,.25)}.bar button.on{box-shadow:0 4px 0 var(--btn-alt-edge),0 6px 10px rgba(20,30,70,.25)}.bar svg{width:26px;height:26px}.name{font-size:19px}.hint{font-size:14px}}
.sizes{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:4px;background:var(--pill);padding:5px;border-radius:999px;box-shadow:0 4px 0 rgba(36,48,94,.18)}
.sizes button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s ease}
.sizes button.on{background:var(--btn);box-shadow:inset 0 -3px 0 var(--btn-edge)}
.sizes button:focus-visible{outline:3px solid var(--btn-alt);outline-offset:2px}
.sizes svg{width:30px;height:30px}
@media (max-width:640px){#sizeXL{display:none}}
@media (max-width:440px){.sizes button{width:36px;height:36px}.sizes svg{width:26px;height:26px}}
.bar button.wide-only{display:none}
.pop{position:fixed;z-index:4;display:none;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--pill);padding:12px;border-radius:26px;box-shadow:0 10px 28px rgba(20,30,70,.28);gap:10px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
.pop.open{display:flex}
.pop button{width:58px;height:58px;border-radius:50%;border:0;background:var(--btn);color:var(--ink);box-shadow:0 5px 0 var(--btn-edge);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.pop button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
.pop button:focus-visible,.chip:focus-visible{outline:3px solid var(--btn-alt);outline-offset:2px}
.pop svg{width:34px;height:34px}
.follow{position:fixed;z-index:4;display:none;flex-direction:column;align-items:center;gap:8px}
.fhead{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--ink)}
.fhead svg{width:22px;height:22px}
.flist{display:flex;gap:8px}
.chip{width:46px;height:46px;border-radius:50%;border:4px solid var(--ring,#cfd6e6);background:#fff;color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 3px 0 rgba(36,48,94,.18);-webkit-tap-highlight-color:transparent;flex:none}
.chip.on{background:var(--btn)}
.chip svg{width:26px;height:26px}
.follow.open{display:flex;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--pill);padding:10px 12px 14px;border-radius:26px;box-shadow:0 10px 28px rgba(20,30,70,.28);width:max-content;max-width:calc(100vw - 32px)}
.follow.open .flist{flex-wrap:wrap;justify-content:center;max-height:45vh;overflow-y:auto;padding:2px}
@media (min-width:900px) and (min-height:560px){
  .bar button.wide-only{display:grid}
  .bar button.narrow-only{display:none}
  .pop,.pop.open{display:none}
  .follow,.follow.open{display:flex;left:auto;transform:none;bottom:auto;background:none;box-shadow:none;padding:0;width:auto;align-items:flex-end;right:calc(14px + env(safe-area-inset-right,0px));top:calc(82px + env(safe-area-inset-top,0px))}
  .fhead{background:var(--pill);border-radius:999px;padding:5px 12px;box-shadow:0 4px 0 rgba(36,48,94,.18)}
  .follow .flist,.follow.open .flist{flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start;max-height:calc(100vh - 250px);overflow:visible;padding:0}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#night{transition:none}.hint{transition:none}}
/* Keep iOS from selecting the page on taps and long presses */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
</style>

  </button>
  <button id="bSound" aria-label="Sound on or off" title="Sound on or off">

    <svg id="iMute" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M6 15h6l8-7v24l-8-7H6z" fill="currentColor"/><path d="M26 15l10 10M36 15L26 25"/></svg>
  </button>
  <button id="bHome" aria-label="Show the whole town" title="Show the whole town">
    <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L20 6l15 13"/><path d="M10 16v17h20V16"/><path d="M17 33v-9h6v9" fill="currentColor"/></svg>
  </button>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

/* ---------- town sizes: L is the original layout; M and S have simpler roads and chunkier things ---------- */
const SIZES={
  L:{R:23,rail:20,K:1,road:'knot',river:true,pond:3.1,trees:70,houses:8,cars:6,maxCars:12,coaches:3,maxCoaches:40,maxPlanes:4,maxBalloons:5,maxDinos:4,sheep:5,ducks:3,clouds:5,flowers:260,rocks:12,mush:10,meadows:14,
     volcano:true,dino:0.8,cliffH:1,cloudY:[15,18],plane:[14.5,10.5],balloon:[9,13,12.5],flock:[10.5,7],trainSpeed:3.2},
  XL:{R:32,rail:28.6,K:1,road:'torus5',river:true,pond:3.6,trees:150,houses:14,cars:10,maxCars:20,coaches:5,maxCoaches:60,maxPlanes:6,maxBalloons:6,maxDinos:6,sheep:7,ducks:4,clouds:8,flowers:520,rocks:20,mush:16,meadows:24,
     volcano:true,dino:0.8,cliffH:1,cloudY:[17,21],plane:[20,13],balloon:[12,17,15],flock:[14,8.5],trainSpeed:3.6},
  M:{R:17,rail:14.6,K:1.15,road:'eight',river:false,pond:2.3,trees:28,houses:4,cars:4,maxCars:8,coaches:3,maxCoaches:28,maxPlanes:3,maxBalloons:4,maxDinos:3,sheep:3,ducks:2,clouds:4,flowers:120,rocks:5,mush:5,meadows:8,
     volcano:true,dino:0.9,cliffH:0.78,cam:1.07,dinoHome:[0,7.6,3.2],cloudY:[11.5,13.5],plane:[11,8.6],balloon:[6.5,6.5,10.2],flock:[8,5.8],trainSpeed:3.0},
  S:{R:12.5,rail:10.4,K:1.3,road:'oval',river:false,pond:2.0,trees:10,houses:2,cars:3,maxCars:5,coaches:2,maxCoaches:18,maxPlanes:2,maxBalloons:3,maxDinos:2,sheep:2,ducks:2,clouds:3,flowers:50,rocks:2,mush:3,meadows:4,
     volcano:false,dino:0.62,cliffH:0.62,cam:1.12,houseK:1.12,houseGap:0.7,dinoHome:[0,2.7,2.4],cloudY:[9.2,10.6],plane:[8.4,6.0],balloon:[4.5,4.5,10.2],flock:[5.6,5],trainSpeed:2.8},
};

/* ---------- shared: renderer, sound, day/night ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,0);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

let ac=null,muted=false,night=false,lastLand=0;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(ac.state==='suspended')ac.resume();return ac;}
function tone(freqs,dur,type,vol,slide,delay){const a=audio();if(!a||muted)return;const t=a.currentTime+(delay||0);const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(a.destination);
  freqs.forEach(f=>{const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);o.connect(g);o.start(t);o.stop(t+dur+0.05);});}
function noise(dur,vol,freq,delay){const a=audio();if(!a||muted)return;const t=a.currentTime+(delay||0);const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=0.8;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);}
const sfx={
  beep:(p=1)=>{tone([392*p,494*p],0.16,'square',0.05,0,0);tone([392*p,494*p],0.2,'square',0.05,0,0.2);},
  boing:()=>tone([260],0.4,'sine',0.18,2.6),
  baa:()=>{tone([420],0.55,'sawtooth',0.04,0.8);tone([428],0.55,'triangle',0.06,0.78);},
  quack:()=>{tone([620],0.13,'sawtooth',0.05,0.55);tone([600],0.15,'sawtooth',0.05,0.5,0.18);},
  rustle:()=>noise(0.4,0.35,2500),
  ding:()=>{tone([660],0.6,'sine',0.13);tone([523],0.8,'sine',0.13,0,0.35);},
  splash:()=>noise(0.7,0.5,900),
  whoosh:()=>noise(0.6,0.4,500),
  pop:()=>tone([500],0.15,'sine',0.15,1.8),
  chime:(n)=>tone([[523,659,784][n%3]],0.4,'triangle',0.1),
  whistle:()=>{tone([587,740],0.28,'sine',0.07,1.02);tone([587,740],0.55,'sine',0.07,1.02,0.36);noise(0.8,0.12,3000);},
  hoot:()=>{tone([150],0.9,'triangle',0.22,1.9);tone([75],0.9,'sine',0.25,1.6);tone([300],0.5,'sine',0.06,1.4,0.5);},
  stomp:()=>tone([70],0.2,'sine',0.14,0.6),

/* ================================================================
   build one town at a given size; returns {world, frame, dispose}
   ================================================================ */
function buildTown(SIZE){
const CFG=SIZES[SIZE],K=CFG.K,FW=(CFG.R+2)/25,CAM=FW*(CFG.cam||1),HK=Math.min(K,CFG.houseK||K);
const life=new AbortController(),sig={signal:life.signal};

/* seeded random so each size of town is the same every visit */
let seed=20261017;
const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const rr=(a,b)=>a+(b-a)*rnd();
const pick=a=>a[Math.floor(rnd()*a.length)];

const stage=new THREE.Scene();
const scene=new THREE.Group();stage.add(scene);   // everything in the town lives in this group so it can grow and shrink

const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,400);
const HOME_DIR=new THREE.Vector3(1,0.92,1).normalize();
const HOME_TARGET=new THREE.Vector3(0,1,0);

camera.zoom=1;
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.copy(HOME_TARGET);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minZoom=0.7; controls.maxZoom=5;
controls.minPolarAngle=0.2; controls.maxPolarAngle=1.32;
controls.screenSpacePanning=true;
controls.rotateSpeed=0.8;
controls.update();
function resize(){
  const w=window.innerWidth,h=window.innerHeight,asp=w/h;
  const halfH=Math.max(17,25/asp)*CAM, halfW=halfH*asp;
  camera.left=-halfW;camera.right=halfW;camera.top=halfH;camera.bottom=-halfH;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}
window.addEventListener('resize',resize,sig); resize();

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xdff2ff,0x6fae4a,0.95); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,1.0);
sun.position.set(18,32,12); sun.castShadow=true;
sun.shadow.mapSize.set(FW>1.2?4096:2048,FW>1.2?4096:2048);
Object.assign(sun.shadow.camera,{left:-30*FW,right:30*FW,top:30*FW,bottom:-30*FW,near:1,far:90});
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03;
scene.add(sun);

/* ---------- materials ---------- */
const matCache={};
function mat(c,o){const k=c+'|'+JSON.stringify(o||{});if(!matCache[k])matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0,flatShading:true},o||{}));return matCache[k];}
const glowWin=new THREE.MeshStandardMaterial({color:0xbfe6ff,emissive:0xffc84a,emissiveIntensity:0,roughness:0.4,flatShading:true});
const headMat=new THREE.MeshStandardMaterial({color:0xfff7c2,emissive:0xfff0a0,emissiveIntensity:0.15,flatShading:true});
const tailMat=new THREE.MeshStandardMaterial({color:0xff4040,emissive:0xff2020,emissiveIntensity:0.1,flatShading:true});
const lampMat=new THREE.MeshStandardMaterial({color:0xfff2b0,emissive:0xffd25a,emissiveIntensity:0,flatShading:true});
function box(w,h,d,c,x=0,y=0,z=0,m){const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||mat(c));me.position.set(x,y,z);me.castShadow=true;me.receiveShadow=true;return me;}
function cyl(rt,rb,h,c,seg=12,m){const me=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m||mat(c));me.castShadow=true;me.receiveShadow=true;return me;}

/* layout frame for M and S: u runs side to side, w runs from the back (waterfall) to the front (camera) */
const SQ=Math.SQRT1_2;
const FR=(u,y,w)=>new THREE.Vector3(SQ*(u+w),y,SQ*(w-u));

/* ---------- the road ---------- */
const M=1600, ROAD_W=0.9*K, KERB=0.18*K, DECK=0.35*K, RX=(0.9+0.18)*(K-1);
const S=5.2;
const ROADS={
  knot:t=>new THREE.Vector3(S*(Math.sin(t)+2*Math.sin(2*t)),0.18+1.7*(1-Math.sin(3*t)),S*(Math.cos(t)-2*Math.cos(2*t))),
  eight:t=>FR(9.5*Math.sin(t),0.18+2.3*(1+Math.cos(t))/2,0.5+4.2*Math.sin(2*t)),
  torus5:t=>{const r=17.5+5.5*Math.cos(5*t),ph=2*t;return new THREE.Vector3(r*Math.cos(ph),0.18+1.5*(1-Math.sin(5*t)),r*Math.sin(ph));},
  oval:t=>FR(6.4*Math.cos(t),0.18,2.7+4.3*Math.sin(t)),
};
const roadFn=ROADS[CFG.road];
const NR=4000, rawP=[], cum=[0];
for(let i=0;i<=NR;i++)rawP.push(roadFn(i/NR*Math.PI*2));
for(let i=1;i<=NR;i++)cum.push(cum[i-1]+rawP[i].distanceTo(rawP[i-1]));
const L=cum[NR];
const P=[],T=[],LF=[];
{let j=0;for(let i=0;i<M;i++){const s=i/M*L;while(cum[j+1]<s)j++;const f=(s-cum[j])/(cum[j+1]-cum[j]);P.push(rawP[j].clone().lerp(rawP[j+1],f));}}
for(let i=0;i<M;i++){const t=P[(i+1)%M].clone().sub(P[(i-1+M)%M]).normalize();T.push(t);LF.push(new THREE.Vector3(t.z,0,-t.x).normalize());}
const DS=L/M;

function strip(a,b,top,bot,colorFn){
  const pos=[],col=[];const c=new THREE.Color();
  const pt=(k,off,dy)=>{const p=P[k];const l=LF[k];return [p.x+l.x*off,p.y+dy,p.z+l.z*off];};
  for(let i=0;i<M;i++){
    const cc=colorFn(i);if(cc===null)continue;c.set(cc);const j=(i+1)%M;
    const Ait=pt(i,a,top),Bit=pt(i,b,top),Ajt=pt(j,a,top),Bjt=pt(j,b,top);
    const Aib=pt(i,a,bot),Bib=pt(i,b,bot),Ajb=pt(j,a,bot),Bjb=pt(j,b,bot);
    const quad=(p0,p1,p2,p3,shade)=>{[p0,p1,p2,p0,p2,p3].forEach(p=>{pos.push(...p);col.push(c.r*shade,c.g*shade,c.b*shade);});};
    quad(Ait,Bit,Bjt,Ajt,1);quad(Aib,Ait,Ajt,Ajb,0.82);quad(Bit,Bib,Bjb,Bjt,0.82);quad(Aib,Ajb,Bjb,Bib,0.6);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,flatShading:true,side:THREE.DoubleSide}));
  m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
const kerbN=Math.max(4,Math.round(7*K));
strip(-ROAD_W,ROAD_W,0,-DECK,()=>0x4f5670);
strip(ROAD_W,ROAD_W+KERB,0.09*K,-DECK,i=>(Math.floor(i/kerbN)%2)?0xff5a4e:0xffffff);
strip(-ROAD_W-KERB,-ROAD_W,0.09*K,-DECK,i=>(Math.floor(i/kerbN)%2)?0xff5a4e:0xffffff);
strip(-0.06*K,0.06*K,0.012,0.0,i=>(Math.floor(i/Math.round(8*K))%2)?null:0xfff3c4);

function trackDist(x,z){let m=1e9;for(let i=0;i<M;i+=4){const dx=P[i].x-x,dz=P[i].z-z,d=dx*dx+dz*dz;if(d<m)m=d;}return Math.sqrt(m);}
function trackDistLow(x,z,maxY){let m=1e9;for(let i=0;i<M;i+=4){if(P[i].y>maxY)continue;const dx=P[i].x-x,dz=P[i].z-z,d=dx*dx+dz*dz;if(d<m)m=d;}return Math.sqrt(m);}

/* pillars under raised road */
{
  const step=Math.round(2.6/DS);
  const pilMat=mat(0xf4e6c8), capMat=mat(0xffa94d);
  for(let i=0;i<M;i+=step){
    const p=P[i],h=p.y-DECK;if(h<0.25)continue;
    let blocked=false;
    for(let j=0;j<M;j+=2){const di=Math.min(Math.abs(i-j),M-Math.abs(i-j));if(di<60)continue;
      if(P[j].y<p.y-0.8&&Math.hypot(P[j].x-p.x,P[j].z-p.z)<1.5*K){blocked=true;break;}}
    if(blocked)continue;
    const c=cyl(0.24*K,0.3*K,h,0,10,pilMat);c.position.set(p.x,h/2,p.z);scene.add(c);
    const cap=box(0.95*K,0.16,0.7*K,0,p.x,h-0.08,p.z,capMat);cap.rotation.y=Math.atan2(T[i].x,T[i].z);scene.add(cap);
  }
}

/* ---------- island ---------- */
const R_ISLAND=CFG.R, RAIL_R=CFG.rail, RAIL_Y=0.12, RAIL_L=2*Math.PI*RAIL_R;
const railGap=(x,z)=>Math.abs(Math.hypot(x,z)-RAIL_R);
{
  const grass=cyl(R_ISLAND,R_ISLAND,0.6,0x7ccf5a,72);grass.position.y=-0.3;grass.castShadow=false;scene.add(grass);
  const soil=cyl(R_ISLAND-0.05,R_ISLAND-1.6*FW,2.6*FW,0xb07a4a,72);soil.position.y=-0.6-1.3*FW;soil.castShadow=false;scene.add(soil);
  const band=cyl(R_ISLAND-0.02,R_ISLAND-0.3,0.35,0x8f5c35,72);band.position.y=-0.75;band.castShadow=false;scene.add(band);
  for(let k=0;k<CFG.meadows;k++){const r=rr(3,19)*FW,a=rr(0,7);const d=cyl(rr(1.5,3.2)*FW,rr(1.5,3.2)*FW,0.02,pick([0x8edb68,0x6fc24e,0x97e070]),9);d.position.set(Math.cos(a)*r,0.012,Math.sin(a)*r);d.castShadow=false;scene.add(d);}
}

/* ---------- placement registry ---------- */
const placed=[],reserved=[];
const riverPts=[];
function riverDist(x,z){let m=1e9;for(let i=0;i<riverPts.length;i+=2){const p=riverPts[i];const d=Math.hypot(p.x-x,p.z-z);if(d<m)m=d;}return m;}
function free(x,z,r,trackGap=1.4){
  if(Math.hypot(x,z)>R_ISLAND-r-0.6)return false;
  for(const o of placed)if(Math.hypot(o.x-x,o.z-z)<o.r+r)return false;
  for(const o of reserved)if(Math.hypot(o.x-x,o.z-z)<o.r+r)return false;
  if(trackDist(x,z)<r+trackGap+RX)return false;
  if(riverDist(x,z)<r+1.2)return false;
  if(railGap(x,z)<r+0.95*K)return false;
  return true;
}
function findSpot(r,tries=400,minR=0,maxR=R_ISLAND,gap){for(let k=0;k<tries;k++){const a=rr(0,Math.PI*2),d=Math.sqrt(rr(minR*minR,maxR*maxR));const x=Math.cos(a)*d,z=Math.sin(a)*d;if(free(x,z,r,gap)){placed.push({x,z,r});return {x,z};}}return null;}
if(CFG.dinoHome){const h=FR(CFG.dinoHome[0],0,CFG.dinoHome[1]);reserved.push({x:h.x,z:h.z,r:CFG.dinoHome[2]});}

/* ---------- water ---------- */
function waterTex(streaks){
  const cv=document.createElement('canvas');cv.width=64;cv.height=256;const g=cv.getContext('2d');
  g.fillStyle='#3db4ff';g.fillRect(0,0,64,256);
  for(let i=0;i<streaks;i++){g.fillStyle=rnd()<0.5?'rgba(255,255,255,0.55)':'rgba(170,230,255,0.7)';const x=rr(0,60),y=rr(0,256);g.fillRect(x,y,rr(2,6),rr(10,40));}
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const riverTex=waterTex(40), fallTex=waterTex(90);
const POND_R=CFG.pond, PC=new THREE.Vector2(0,0);

/* ---------- waterfall cliff, with the railway running through a tunnel behind the falls ---------- */
let cliff;
{
  let best=null;
  if(CFG.river){
    for(let a=0;a<Math.PI*2;a+=Math.PI/72){
      const r=RAIL_R, cx=Math.sin(a)*r, cz=Math.cos(a)*r, ry=Math.atan2(-cx,-cz);
      const pts=[[-3.2,-2.2],[3.2,-2.2],[-3.2,2.2],[3.2,2.2],[0,0],[0,4],[-1.8,4],[1.8,4]];
      let md=1e9;for(const[lx,lz]of pts){const x=cx+lx*Math.cos(ry)+lz*Math.sin(ry),z=cz-lx*Math.sin(ry)+lz*Math.cos(ry);md=Math.min(md,trackDist(x,z));}
      const score=Math.min(md,5.5)+0.8*(-(cx+cz)/(r*1.414));if(!best||score>best.score)best={md,score,cx,cz,ry};
    }
  }else{const c=FR(0,0,-RAIL_R);best={cx:c.x,cz:c.z,ry:Math.atan2(-c.x,-c.z)};}
  const g=new THREE.Group();g.position.set(best.cx,0,best.cz);g.rotation.y=best.ry;g.scale.setScalar(K);scene.add(g);
  const HF=CFG.cliffH, H=5*HF;
  const rocks=[0xa39e93,0x8f8a80,0xb5a48a,0x9b927f];
  const Z0=-0.85,Z1=1.15,ZB=-2.05,ZF=2.05,TH=2.1;
  const cols=[[-2.25,4.1*HF],[-0.75,H],[0.75,H],[2.25,4.5*HF]];
  const dark=0x4a4038;
  cols.forEach(([x,h],ci)=>{
    const w=1.5+rr(0,0.1), hb=h+0.4*HF+rr(-0.1,0.1), outer=Math.abs(x)>1.5;
    g.add(box(w,hb,Z0-ZB,rocks[ci%4],x,hb/2,(ZB+Z0)/2));
    g.add(box(1.62,0.26,Z0-ZB+0.1,0x6cc24a,x,hb+0.12,(ZB+Z0)/2));
    if(outer)g.add(box(w,h,ZF-Z1,rocks[(ci+1)%4],x,h/2,(Z1+ZF)/2));
    g.add(box(w,h-TH,ZF-Z0,rocks[(ci+1)%4],x,(h+TH)/2,(Z0+ZF)/2));
    g.add(box(1.62,0.26,ZF-Z0+0.1,0x6cc24a,x,h+0.12,(Z0+ZF)/2));
    if(rnd()<0.6&&outer){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(rr(0.35,0.55),0),mat(0x4fa83a));b.position.set(x+rr(-0.3,0.3),h+0.5,rr(-0.4,0.8));b.castShadow=true;g.add(b);}
  });
  g.add(box(6,0.04,Z1-Z0,dark,0,TH-0.03,(Z0+Z1)/2));
  g.add(box(6,TH,0.04,dark,0,TH/2,Z0+0.03));

  const chan=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.06,4.1),new THREE.MeshStandardMaterial({map:riverTex.clone(),roughness:0.3}));

{

let time=0,nightT=night?1:0;

const wheelR=0.18*K,trainWheelR=0.22*K;
function frame(dt){
  time+=dt;

  const order=cars.slice().sort((a,b)=>a.s-b.s);

    const c=order[i],n=order[(i+1)%order.length];
    let want=c.base*(1-0.9*Math.max(-0.35,Math.min(0.35,c.slope||0)))*(1+c.boost*0.7);
    if(n!==c){let gap=n.s-c.s;if(gap<=0)gap+=L;gap-=(n.len+c.len)/2;if(gap<2.2*K)want=Math.min(want,Math.max(0,(gap-0.5*K)/(1.7*K))*Math.max(n.v,1.2));}

    for(const w of c.wheels)w.rotation.x+=c.v*dt/wheelR;
    let y=Math.abs(Math.sin(time*11+c.ph))*0.025*Math.min(1,c.v/2);
    if(c.hop>0){c.hop=Math.max(0,c.hop-dt*1.8);const h=1-c.hop;y+=Math.sin(h*Math.PI)*0.9;c.body.rotation.y=h*Math.PI*2*(c.hop>0?1:0);}else c.body.rotation.y=0;
    c.body.position.y=y;

    for(const w of u.wheels)w.rotation.x+=tsp*dt/trainWheelR;

let current='S';
try{const s=localStorage.getItem(SIZE_KEY);if(s&&SIZES[s])current=s;}catch(e){}
function markSize(){['S','M','L','XL'].forEach(k=>{const b=$('size'+k);b.classList.toggle('on',k===current);b.setAttribute('aria-pressed',k===current?'true':'false');});}
markSize();
let town=buildTown(current),intro=0,outgoing=null,outT=0,pending=null;
town.world.scale.setScalar(0.001);
function setSize(k){
  audio();
  if(k===current&&!outgoing){if(town)town.world.scale.setScalar(1);return;}
  current=k;markSize();try{localStorage.setItem(SIZE_KEY,k);}catch(e){}
  if(outgoing){pending=k;return;}
  outgoing=town;town=null;outT=0;pending=k;sfx.shrink();
}
['S','M','L','XL'].forEach(k=>$('size'+k).onclick=()=>setSize(k));
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeOutBack=x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(outgoing){
    outT+=dt/(reduce?0.15:0.42);const u=Math.min(1,outT);
    outgoing.world.scale.setScalar(Math.max(0.001,1-u*u));outgoing.world.rotation.y=u*u*0.6;
    outgoing.frame(dt);
    if(u>=1){outgoing.dispose();outgoing=null;town=buildTown(pending);intro=0;town.world.scale.setScalar(0.001);town.world.rotation.y=-0.6;sfx.grow();}
  }else if(town){
    if(intro<1){intro=Math.min(1,intro+dt/(reduce?0.2:0.9));const e=reduce?intro:easeOutBack(intro);town.world.scale.setScalar(Math.max(0.001,e));town.world.rotation.y=-0.6*(1-Math.min(1,intro*1.2))**2;}
    town.frame(dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
