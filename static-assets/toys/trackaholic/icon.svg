<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#140f2e"/>
<stop offset="0.45" stop-color="#3b2364"/>
<stop offset="0.62" stop-color="#ff7ac8"/>
<stop offset="0.68" stop-color="#ffd27a"/>
</linearGradient>
<linearGradient id="valley" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2a1d52"/>
<stop offset="1" stop-color="#140f2e"/>
</linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="7"/>
</filter>
</defs>
<rect width="512" height="512" fill="url(#sky)"/>
<path d="M0 300 L70 262 L130 284 L200 236 L262 270 L330 228 L400 268 L460 246 L512 262 L512 512 L0 512 Z" fill="url(#valley)"/>
<!-- The road winds from the bottom edge to a vanishing point below the far hills -->
<path d="M150 512 C190 440 330 430 330 372 C330 320 210 330 232 290 C244 270 266 268 270 266" fill="none" stroke="#6ff4ff" stroke-width="22" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
<path d="M150 512 C190 440 330 430 330 372 C330 320 210 330 232 290 C244 270 266 268 270 266" fill="none" stroke="#0b0820" stroke-width="40" stroke-linecap="round"/>
<path d="M150 512 C190 440 330 430 330 372 C330 320 210 330 232 290 C244 270 266 268 270 266" fill="none" stroke="#6ff4ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="16 14"/>
<!-- Brake lights of the car rounding the bend -->
<circle cx="294" cy="408" r="9" fill="#ff7ac8"/>
<circle cx="322" cy="398" r="9" fill="#ff7ac8"/>
<circle cx="308" cy="403" r="26" fill="#ff7ac8" filter="url(#glow)" opacity="0.6"/>
<circle cx="380" cy="132" r="5" fill="#f6f3ff" opacity="0.8"/>
<circle cx="150" cy="104" r="4" fill="#f6f3ff" opacity="0.6"/>
<circle cx="250" cy="150" r="3" fill="#f6f3ff" opacity="0.5"/>
</svg>
