<title>Catflap</title>
<meta name="description" content="A game for small children: let the cat in through the cat flap, then tap to give it dinner, water, treats and fish until it curls up in its basket to sleep">
<meta name="toy-category" content="games">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one full-screen kitchen, drawn on a 1600×1000 stage scaled to fit. The back layer holds the room and the
   things on the shelf, the cats walk in front of it, and the front layer holds the door, the basket's rim and the
   effects. A grown-up's settings button hides in the top right corner, opened by holding it. */
:root{
  --wall:#f7e6c4; --ink:#5b3a1e; --accent:#ef8b3c; --panel:#fffaf0; --line:#e2c99b;
  --f-round:"Fredoka", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--wall);font-family:var(--f-round);color:var(--ink)}
#game{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#game svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cats{position:absolute;inset:0;pointer-events:none;z-index:1}
#game #front{pointer-events:none;z-index:2}
#wake,#grown{z-index:3}
#dark{position:absolute;inset:0;background:#33407e;mix-blend-mode:multiply;opacity:0;pointer-events:none;z-index:2}
.sleeper{position:absolute;left:0;top:0;pointer-events:none;transform-origin:50% 100%}
.sleeper img,.sleeper svg{position:absolute;inset:0;width:100%;height:100%}

/* the morning button: a big sun, well clear of the bottom edge */
#wake{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer;
  animation:breathe 2.4s ease-in-out infinite}
#wake svg{position:static;width:100%;height:100%}
@keyframes breathe{50%{transform:scale(1.08)}}

/* grown-ups only: hold for a moment to open */
#grown{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;
  border:0;background:rgba(91,58,30,.08);color:rgba(91,58,30,.45);display:grid;place-items:center;cursor:pointer;padding:0}
#grown svg{position:absolute;inset:0;width:100%;height:100%}
#grown .ring{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:126;stroke-dashoffset:126;transform:rotate(-90deg);transform-origin:50% 50%}
#panel{border:0;border-radius:18px;padding:22px 22px 18px;max-width:min(420px,calc(100vw - 32px));background:var(--panel);color:var(--ink);
  font:16px/1.45 var(--f-round);box-shadow:0 20px 60px rgba(60,30,10,.3)}
#panel::backdrop{background:rgba(60,40,20,.35)}
#panel h2{margin:0 0 6px;font-weight:600;font-size:22px}
#panel p{margin:0 0 14px;font-size:14px;color:#8a6a4a}
#panel label{display:block;font-size:14px;margin:12px 0 4px}
#panel input{font:inherit;width:100%;box-sizing:border-box;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#panel button{font:600 15px var(--f-round);padding:10px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
#panel button.main{background:var(--accent);border-color:var(--accent);color:#fff}
#panel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#panel input:focus-visible,#panel button:focus-visible,#grown:focus-visible,#wake:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Keep iOS from selecting the page on taps and long presses */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
</style>

<dialog id="panel">
  <h2 id="panelTitle">Catflap</h2>
  <p>Tap the cat flap to let the cat in, then tap whatever it is thinking of. Everything works by tapping, nothing can go wrong, and after a few courses the cat goes to sleep: tap the sun to start a new day.</p>
  <label for="nameInput">Child’s name, shown on the door</label>
  <input id="nameInput" maxlength="24" autocomplete="off" placeholder="Optional">
  <div class="row">
    <button id="soundBtn" aria-pressed="false">Sound off</button>
    <button id="restartBtn">Start a new day</button>
    <button id="closeBtn" class="main">Done</button>
  </div>
</dialog>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, easeOut = t => 1 - Math.pow(1 - t, 3);
const wait = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
function tween(ms, fn, ease = easeInOut) {

  clack() { if (!ac) return; const n = now(); [0, 0.14, 0.26].forEach((t, i) => { noise(n + t, 0.05, 0.3 / (i + 1), 'bandpass', 900, 0, 3, 0.001); tone(220, n + t, 0.06, 0.18 / (i + 1), 'triangle'); }); },
  pour() { if (!ac) return; const n = now(); for (let t = 0; t < 0.7; t += 0.025 + Math.random() * 0.03) noise(n + t, 0.03, 0.08 + Math.random() * 0.1, 'bandpass', 2500 + Math.random() * 2500, 0, 3, 0.001); },

  lap() { if (!ac) return; const n = now(); tone(700, n, 0.05, 0.08, 'sine', 1100); noise(n, 0.04, 0.06, 'bandpass', 3000, 0, 4); },

const cat = {

const KINDS = {
  kibble: { h: 200 }, jug: { h: 190 }, jar: { h: 212 }, fish: { h: 90 },

/* ---------- taps ---------- */
// Everything happens on the finger going down. Only one finger counts, and the bottom edge, where small wrists rest,

let started = false, targets = [], tapWaiter = null, activeTouches = 0;
function waitTap(list, { hint, every = 7000 } = {}) {
  targets = list;
  return new Promise(resolve => {
    let timer;
    const arm = () => { clearTimeout(timer); if (hint) timer = setTimeout(() => { hint(); arm(); }, every); };
    tapWaiter = t => { clearTimeout(timer); targets = []; tapWaiter = null; resolve(t); };
    arm();

const game = $('game');

  if (e.pointerType === 'touch' && e.clientY > innerHeight * 0.94) return;

  const [x, y] = toStage(e.clientX, e.clientY);
  ripple(x, y);
  if (!started) { start(); return; }
  const t = targets.find(t => t.hit(x, y));
  if (t && tapWaiter) { tapWaiter(t); return; }

// a stroke: a chirp and a heart, and a purr when it is asleep
let stroking = false;
async function stroke() {
  if (stroking) return;
  stroking = true;
  if (cat.mode === 'sleeper') { S.purr(1.5); hearts(1); }
  else if (!cat.busy) {
    S.chirp(0.9 + Math.random() * 0.3); hearts(1);
    if (cat.mode === 'walker') cat.walker.play('swish');
  } else S.chirp();
  await wait(500); stroking = false;
}

/* ---------- the day: the cat comes in, has three courses, and goes to bed ---------- */
// before the first tap, the cat is outside, rattling the flap and meowing to be let in

    rattle();
  }, 2600);
}
cat.layout();
cat.walker.place({ flip: true });
rattle();

async function start() {
  started = true; clearTimeout(outsideTimer);
  try { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen)?.call(d, { navigationUI: 'hide' })?.catch?.(() => {}); } catch (e) {}
  await cat.ready;
  await comeIn();
  for (;;) {
    for (const round of ['dinner', ...shuffle(['water', 'treats', 'fish']).slice(0, 2)]) await playRound(round);
    await goToBed();
    await waitTap([{ hit: () => false }], {});   // settled by the sun
    await wakeUp();
  }
}

async function comeIn() {
  cat.busy = true;
  S.clack();
  tween(260, t => setFlap(1 - 0.85 * t));
  await cat.walkTo(420, 800);
  tween(500, t => setFlap(0.15 + 0.85 * t), easeOut).then(() => S.clack());
  await cat.walkTo(HOME, FLOOR);
  cat.face(true); cat.stand();
  S.meow(); hearts(2);
  await wait(600);
  cat.busy = false;
}

async function playRound(kind) {
  const need = ROUND_ITEM[kind];
  const kinds = shuffle([need, ...shuffle(SILLIES).slice(0, 2)]);
  shelf = kinds.map((kind, slot) => new Item(kind, slot));
  await Promise.all(shelf.map((it, i) => it.popIn(i * 160)));
  const wanted = shelf.find(it => it.kind === need);
  for (;;) {
    await think(need);
    S.meow(0.95 + Math.random() * 0.15);
    const tapped = await waitTap(shelf, { hint: () => { wanted.wiggle(); nudgeThought(); S.meow(1.05); } });
    unthink();
    if (tapped === wanted) break;
    await silly(tapped);
  }
  await SERVE[kind](wanted);
  // well fed: hearts, a purr, and the shelf cleared for the next course
  S.sparkle(); hearts(4); S.purr(2.4);
  if (cat.mode === 'walker') cat.walker.play('swish');
  await Promise.all(shelf.filter(it => it.el.isConnected).map(it => it.popOut()));
  shelf = [];
  await wait(900);
}

/* ---------- serving each course ---------- */
// three taps' worth poured from a bag or a jug into a bowl, then the cat goes over and eats or drinks it
// The bag or jug hovers beside the bowl at `hover`, tipped by `tip` degrees, and pours from `spout`, a point of its drawing
async function pourInto(item, { vessel, at, hover, tip, spout, pour, lapping }) {
  cat.busy = true;
  S.whoosh();
  await item.arcTo(at + hover, 720, { rot: tip, lift: 120 });
  for (let n = 1; n <= 3; n++) {
    if (n > 1) await waitTap([item], { hint: () => item.wiggle(), every: 5000 });
    const r0 = item.rot, more = Math.sign(tip) * 16;
    await tween(160, t => { item.rot = r0 + more * t; item.draw(); });
    pour(item.point(...spout), at);
    await vessel.to(n / 3, 500);
    await tween(200, t => { item.rot = r0 + more * (1 - t); item.draw(); });
    await count(n, at + hover * 0.4, 500);
  }
  await wait(400);
  clearCount();
  S.whoosh();
  await item.home({ lift: 120 });
  await item.popOut();
  shelf = shelf.filter(it => it !== item);
  await cat.walkTo(at + MOUTH, FLOOR);
  cat.face(true);
  cat.feed(lapping);
  for (let n = 3; n > 0; n--) {
    for (let i = 0; i < 3; i++) { lapping ? S.lap() : S.crunch(); await wait(lapping ? 230 : 320); }
    await vessel.to((n - 1) / 3, 250);
  }
  cat.stand();
  S.meow(1.1);
  await cat.walkTo(HOME, FLOOR);
  cat.face(true); cat.stand();
  cat.busy = false;
}
function kibbleFall([sx, sy], at) {
  S.pour();
  for (let i = 0; i < 16; i++) {
    const c = svgEl('circle', { r: 6 + Math.random() * 3, fill: pick(['#9b5a2c', '#7a4220', '#b06a34']) }, fxBack);
    const x0 = sx + (Math.random() - 0.5) * 30, x1 = at + (Math.random() - 0.5) * 100, y1 = 806 + Math.random() * 10, d = Math.random() * 320;
    wait(d).then(() => tween(400, (_, u) => { c.setAttribute('cx', lerp(x0, x1, u)); c.setAttribute('cy', lerp(sy, y1, u * u)); }, x => x)).then(() => c.remove());
  }
}
function waterFall([sx, sy], at) {
  S.splash();
  const p = svgEl('path', { fill: 'none', stroke: '#8fd0ff', 'stroke-width': 16, 'stroke-linecap': 'round', opacity: .9 }, fxBack);
  tween(700, (_, u) => {
    const bottom = lerp(sy, 820, Math.min(1, u * 3)), top = lerp(sy, bottom, Math.max(0, u - 0.7) / 0.3), x1 = lerp(sx, at, Math.min(1, u * 3));
    p.setAttribute('d', `M${sx} ${top} Q${(sx + x1) / 2} ${Math.min(top, bottom) - 10} ${x1} ${bottom}`);
  }, x => x).then(() => p.remove());
}

const SERVE = {
  dinner: item => pourInto(item, { vessel: bowl, at: BOWL, hover: -150, tip: 115, spout: [0, -196], pour: kibbleFall }),
  water: item => pourInto(item, { vessel: dish, at: DISH, hover: 140, tip: -80, spout: [-74, -178], pour: waterFall, lapping: true }),

  // the jar hovers by the cat, which sits up and begs; each tap throws it a treat to catch
  async treats(item) {
    cat.busy = true;
    S.whoosh();
    const jx = HOME - 420, jy = 640;
    await Promise.all([item.arcTo(jx, jy, { lift: 100 }), cat.become('upright')]);
    for (let n = 1; n <= 3; n++) {
      if (n > 1) await waitTap([item], { hint: () => { item.wiggle(); S.chirp(); }, every: 5000 });
      S.pop();
      const y0 = item.y;
      tween(260, (_, u) => { item.y = y0 - 26 * Math.sin(Math.PI * u); item.draw(); }, x => x);
      const t = svgEl('use', { href: '#heart', fill: pick(['#e9546b', '#f7b733', '#7bc96f']) }, fxBack);
      const sx = jx, sy = jy - 220;
      await tween(560, (_, u) => {
        const [mx, my] = cat.mouth();
        t.setAttribute('transform', `translate(${lerp(sx, mx, u)} ${lerp(sy, my, u) - 160 * 4 * u * (1 - u)}) scale(1.1)`);
      }, x => x);
      t.remove();
      S.chirp(1.1); S.crunch();
      cat.upright.tweak.head = -10; setTimeout(() => { cat.upright.tweak.head = 0; }, 180);
      await count(n, jx - 170, 520);
    }
    await wait(300);
    clearCount();
    S.whoosh();
    item.home({ lift: 100 }).then(() => item.popOut());
    shelf = shelf.filter(it => it !== item);
    await cat.upright.play('cheer');
    await cat.become('walker');
    cat.stand();
    cat.busy = false;
  },

  // the fish is set down on the floor, and the cat pounces on it
  async fish(item) {
    cat.busy = true;
    S.whoosh();
    await item.arcTo(FISH, FLOOR + 10, { lift: 160, s: 1.25 });
    S.thud();
    shelf = shelf.filter(it => it !== item);
    cat.face(true);
    await wait(200);
    const from = cat.x, to = FISH + MOUTH + 10;
    S.whirr();
    await cat.walker.play('pounce', { distance: (from - to) / SZ, height: 0.45, onLand: () => S.thud() });
    cat.sync();
    cat.feed(false);
    for (let i = 0; i < 10; i++) { S.crunch(); await wait(300); if (i === 6) { item.el.querySelector('.flesh').style.display = 'none'; item.el.querySelector('.bones').style.display = ''; } }
    cat.stand();
    S.meow(1.15);
    item.fade(700);
    await cat.walkTo(HOME, FLOOR);
    cat.face(true); cat.stand();
    cat.busy = false;
  },
};

/* ---------- the wrong things: never wrong, just funny ---------- */
async function silly(item) {
  cat.busy = true;
  const front = cat.x - 0.66 * SZ;
  if (item.silly === 'hat') {
    // the slipper lands on the cat's head; it sits up and puts a paw to its face
    await cat.become('upright');
    S.whoosh();
    const onHead = () => { const [mx, my] = cat.mouth(); return [mx + 70, my - 70]; };
    let [hx, hy] = onHead();
    await item.arcTo(hx, hy, { lift: 120, rot: -14, s: 0.8 });
    S.boing();
    let riding = true;
    (function ride() { if (!riding) return; [item.x, item.y] = onHead(); item.draw(); requestAnimationFrame(ride); })();
    await cat.upright.play('facepaw');
    riding = false;
    S.meow(0.85);
    await item.home({ lift: 160 });
    await cat.become('walker');
    cat.stand();
  } else {
    S.whoosh();
    await item.arcTo(front, FLOOR + 6, { lift: 120, rot: item.kind === 'yarn' ? 200 : 0 });
    S.thud();
    if (item.silly === 'sneeze') {
      await cat.walker.drive(t => ({ y: SETTLE + 18, rot: -6, chest: -6, head: -34 + Math.sin(t * 22) * 4 }), { duration: 1.1, blend: 0.3 });
      S.sniff();
      await cat.walker.drive(t => ({ y: SETTLE + 6, rot: -2, head: -10 + 6 * Math.sin(t * 4) }), { duration: 0.45, blend: 0.3 });
      S.sneeze();
      await wait(400);
      await cat.walker.drive(t => ({ x: 26 * Math.sin(Math.min(1, t / 0.5) * Math.PI), y: SETTLE, rot: 6 * Math.sin(Math.min(1, t / 0.5) * Math.PI), head: 24 * Math.sin(Math.min(1, t / 0.4) * Math.PI) }), { duration: 0.6, blend: 0.1 });
      cat.stand();
    } else if (item.silly === 'squeak') {
      for (let i = 0; i < 2; i++) {
        await cat.walker.play('swat', { at: toScreen(item.x, item.y - 30), onStrike: () => { S.squeak(); const s0 = 1; tween(240, (_, u) => { item.s = s0 - 0.25 * Math.sin(Math.PI * u); item.draw(); }, x => x); } });
      }
      cat.stand();
    } else if (item.silly === 'roll') {
      // a bat at the wool sends it rolling away across the floor and back again
      const play = cat.walker.play('bat');
      await wait(700);
      S.whoosh();
      const x0 = item.x;
      await tween(1000, t => { item.x = lerp(x0, 300, t); item.rot += 9; item.draw(); }, easeOut);
      await wait(250);
      await tween(900, t => { item.x = lerp(300, x0, t); item.rot -= 9; item.draw(); }, easeInOut);
      await play;
      cat.stand();
    }
    S.meow(0.9);
    await item.home({ lift: 200 });
  }
  item.rot = 0; item.s = 1; item.draw();
  cat.busy = false;
}

/* ---------- bedtime, and morning ---------- */
let purring = null, zzzTimer = null;
async function goToBed() {
  cat.busy = true;
  await wait(400);
  await cat.walkTo(BASKET - 60, FLOOR + 4);
  await cat.become('sleeper');
  await wait(400);
  cat.sleeper.img.src = '../cat/cat-sprites/yawn.webp'; S.yawn();
  await wait(1300);
  cat.sleeper.img.src = '../cat/cat-sprites/loaf.webp';
  await wait(700);
  await Promise.all([
    tween(900, t => cat.sleeper.lids.setAttribute('opacity', t)),
    tween(2200, t => { $('dark').style.opacity = 0.8 * t; $('night').setAttribute('opacity', t); }),
  ]);
  purring = S.purr(600);
  breathe(true);
  zzz();
  await wait(1200);
  $('wake').hidden = false;
  cat.busy = false;
}
let breathing = false;
function breathe(on) {
  breathing = on;
  const s = cat.sleeper.el.style;
  if (!on) { s.transform = ''; return; }
  const t0 = performance.now();
  (function step(t) { if (!breathing) return; s.transform = `scale(1, ${1 + 0.018 * Math.sin((t - t0) / 1300 * Math.PI * 2)})`; requestAnimationFrame(step); })(t0);
}
function zzz() {
  const [x, y] = [cat.bed.x + 150, cat.bed.y - 270];
  const z = svgEl('text', { 'font-family': 'Fredoka, Arial Rounded MT Bold, sans-serif', 'font-weight': 600, 'font-size': 60, fill: '#fff' }, fxFront);
  z.textContent = 'z';
  tween(2600, (_, u) => { z.setAttribute('transform', `translate(${x + 60 * u + 14 * Math.sin(u * 8)} ${y - 160 * u}) scale(${0.6 + u})`); z.setAttribute('opacity', u < .2 ? u / .2 : 1 - (u - .2) / .8); }, x => x).then(() => z.remove());
  zzzTimer = setTimeout(zzz, 1100);
}
$('wake').addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  if (tapWaiter) { $('wake').hidden = true; tapWaiter({}); }
});
async function wakeUp() {
  cat.busy = true;
  S.sparkle();
  clearTimeout(zzzTimer); purring && purring.stop(); purring = null; breathe(false);
  await Promise.all([
    tween(1400, t => { $('dark').style.opacity = 0.8 * (1 - t); $('night').setAttribute('opacity', 1 - t); }),
    tween(600, t => cat.sleeper.lids.setAttribute('opacity', 1 - t)),
  ]);
  cat.sleeper.img.src = '../cat/cat-sprites/yawn.webp'; S.yawn();
  await wait(1100);
  cat.sleeper.img.src = '../cat/cat-sprites/loaf.webp';
  cat.face(true);
  await cat.become('walker');
  await cat.walkTo(HOME, FLOOR);
  cat.face(true); cat.stand();
  S.meow(); hearts(2);
  await wait(500);
  cat.busy = false;
}

/* ---------- grown-ups: hold the corner button to open the settings ---------- */
const grown = $('grown'), ring = grown.querySelector('.ring');
let holdAnim = null;
grown.addEventListener('pointerdown', e => {
  e.preventDefault();
  holdAnim = ring.animate([{ strokeDashoffset: 126 }, { strokeDashoffset: 0 }], { duration: 1200, fill: 'forwards' });
  holdAnim.onfinish = () => { holdAnim = null; ring.getAnimations().forEach(a => a.cancel()); openPanel(); };
});
const release = () => { if (holdAnim) { holdAnim.cancel(); holdAnim = null; } };
grown.addEventListener('pointerup', release); grown.addEventListener('pointerleave', release); grown.addEventListener('pointercancel', release);
grown.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(); } });
function openPanel() { $('nameInput').value = readName(); $('panel').showModal(); }
$('closeBtn').onclick = () => {
  const name = $('nameInput').value.trim().slice(0, 24), params = new URLSearchParams(location.hash.slice(1));
  if (name) params.set('name', name); else params.delete('name');
  const hash = params.toString();
  history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
  showName();
  $('panel').close();
};
$('soundBtn').onclick = () => { audio(); setMuted(!muted); };
$('restartBtn').onclick = () => { location.reload(); };
})();
</script>
