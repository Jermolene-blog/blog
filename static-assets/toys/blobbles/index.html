<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blobbles</title>
<meta name="description" content="Blobs of glass at your command">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#ececec; --ink:#0a0a0a; --hint:#6f6f6f; color-scheme: light; }
  html, body { margin:0; height:100%; background:var(--paper); overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  #hint {
    position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    text-align:center; font:500 12px/1.4 Inter, "Helvetica Neue", Arial, sans-serif;
    color:var(--hint); pointer-events:none; transition:opacity .8s;
  }
  #word {
    position:fixed; left:0; top:50%; width:100%; box-sizing:border-box; padding:0 10vw; margin:0; transform:translateY(-50%);
    border:0; outline:0; background:transparent; color:transparent; caret-color:var(--ink);
    font-family:Inter, "Helvetica Neue", Arial, sans-serif; font-weight:800; letter-spacing:-0.05em; line-height:1.2;
    text-align:center; display:none;
  }
  #word::selection { background:rgba(0,120,255,0.18); color:transparent; }
  #hud { position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); right:calc(12px + env(safe-area-inset-right, 0px));
    font:500 12px/1.4 Inter, "Helvetica Neue", Arial, sans-serif; color:var(--ink); }
  #hud-toggle { display:block; margin-left:auto; width:36px; height:36px; padding:0; border:0; border-radius:50%;
    background:rgba(255,255,255,0.7); color:var(--ink); font-size:18px; line-height:36px; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.15); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  /* the panel sits below the 36px button and must fit the visible viewport, which on phones is shorter than 100vh */
  #hud-panel { display:none; margin-top:8px; padding:12px 14px; width:220px; box-sizing:border-box; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; border-radius:12px;
    max-height:calc(100vh - 72px); max-height:calc(100dvh - 68px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    background:rgba(255,255,255,0.8); box-shadow:0 2px 12px rgba(0,0,0,0.15); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  #hud.open #hud-panel { display:block; }
  #hud label { display:block; margin-bottom:10px; }
  #hud h2 { margin:14px 0 8px; font-size:11px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--hint); }
  #hud h2:first-child { margin-top:0; }
  #hud label span { display:flex; justify-content:space-between; }
  #hud output { color:var(--hint); font-variant-numeric:tabular-nums; }
  #hud input[type=range] { width:100%; margin:4px 0 0; accent-color:var(--ink); }
  #hud [hidden] { display:none !important; }
  #hud select { display:block; width:100%; margin-top:4px; font:inherit; padding:4px 6px; border:1px solid rgba(0,0,0,0.2); border-radius:6px; background:rgba(255,255,255,0.6); color:var(--ink); }
  @media (pointer:coarse) { #hud select { font-size:16px; } }
  #hud input[type=color] { display:block; width:100%; height:28px; margin:4px 0 0; padding:0 2px; border:1px solid rgba(0,0,0,0.2); border-radius:6px; background:transparent; cursor:pointer; }
  #hud .swatches { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:10px; }
  #hud label.check { display:flex; align-items:center; gap:8px; }
  #hud label.check input { margin:0; accent-color:var(--ink); }
  #fps { position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); left:calc(12px + env(safe-area-inset-left, 0px)); padding:6px 9px; border-radius:8px;
    background:rgba(0,0,0,0.6); color:#fff; font:500 11px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space:pre; pointer-events:none; }
  #hud-reset { font:inherit; padding:4px 10px; border:1px solid rgba(0,0,0,0.2); border-radius:6px; background:transparent; color:var(--ink); cursor:pointer; }
  #err { position:fixed; inset:0; display:none; place-items:center; font:500 15px Inter, Arial, sans-serif; color:var(--ink); padding:24px; text-align:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<input id="word" type="text" maxlength="60" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Word to set in the background">
<div id="hint">Drag and flick the glass, with as many fingers as you like. Tap merged blobs to burst them. Double-tap to change the word.</div>
<div id="fps" hidden></div>
<div id="hud">
  <button id="hud-toggle" type="button" aria-expanded="false" aria-controls="hud-panel" title="Settings">⚙︎</button>
  <div id="hud-panel"></div>
</div>
<div id="err">This effect needs WebGL, which isn't available in this browser.</div>
<script>
(() => {
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('err').style.display = 'grid'; return; }

const params = new URLSearchParams(location.search);
let WORD = params.get('text') || 'glass.';
const FONT = 'Inter, "Helvetica Neue", Arial, sans-serif';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- background texture (type + light) ---------------- */
const tex2d = document.createElement('canvas');
const ctx = tex2d.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, textBox = { cx: 0, cy: 0, w: 0, h: 0 };

const paper = document.createElement('canvas');
let wordFs = 0;

// paper and light only change on resize, so are cached apart from the word
function drawPaper() {
  paper.width = W; paper.height = H;
  const ctx = paper.getContext('2d');
  // paper: soft studio falloff, brighter upper centre
  let g = ctx.createRadialGradient(W * 0.5, H * 0.32, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.75);
  g.addColorStop(0, '#f6f6f6'); g.addColorStop(0.55, '#e9e9e9'); g.addColorStop(1, '#cfcfcf');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, H * 0.6, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.07)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // prismatic light streaks
  const streak = (x, y, len, wid, ang, a) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.filter = `blur(${Math.round(wid * 0.35)}px)`;
    const lg = ctx.createLinearGradient(0, -wid / 2, 0, wid / 2);
    ['#ff3b30', '#ffcc00', '#34c759', '#00c7ff', '#5856d6'].forEach((c, i, arr) => lg.addColorStop(i / (arr.length - 1), c));
    ctx.globalAlpha = a; ctx.fillStyle = lg; ctx.fillRect(0, -wid / 2, len, wid);
    ctx.restore();
  };
  streak(W * 0.02, H * 0.05, S * 0.9, S * 0.05, 0.62, 0.10);
  streak(W * 0.10, H * 0.02, S * 0.6, S * 0.025, 0.75, 0.08);
  streak(W * 0.05, H * 1.02, S * 0.8, S * 0.05, -0.55, 0.12);
  streak(W * 0.78, H * 0.02, S * 0.5, S * 0.03, 2.3, 0.07);
  ctx.filter = 'none'; ctx.globalAlpha = 1;
}

function drawBackground() {
  tex2d.width = W; tex2d.height = H;
  ctx.drawImage(paper, 0, 0);

  // the word
  let fs = S * 0.5;
  ctx.font = `800 ${fs}px ${FONT}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${-0.05 * fs}px`;
  let m = ctx.measureText(WORD);
  const maxW = W * 0.8;
  if (m.width > maxW) {
    fs *= maxW / m.width;
    ctx.font = `800 ${fs}px ${FONT}`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${-0.05 * fs}px`;
    m = ctx.measureText(WORD);
  }
  const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const x = (W - m.width) / 2, y = H * 0.5 + (asc - desc) / 2;
  ctx.fillStyle = '#0a0a0a'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(WORD, x, y);
  // blobs roam along the word, so keep them spread out even when it is short or empty
  textBox = { cx: W / 2, cy: H * 0.5, w: Math.max(m.width, S * 0.5), h: asc + desc };
  wordFs = fs;

}

/* ---------------- WebGL ---------------- */
// The shader is compiled for the exact number of blobs (N), bubbles per blob (NB)
// and whether the glass is tinted (TINT), so every loop unrolls and unused work
// vanishes. Everything that is the same for every pixel of a blob (its squash,
// spread, wobble phases and bubble positions) is worked out on the CPU each frame.
const vs = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
const fs = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uS, uT, uMerge, uFar, uRef, uDis;
uniform vec4 uB[N];  // centre, radius, and 1/(0.7 r^2) for the dome
uniform vec4 uDf[N]; // squash and stretch: the stretch axis, then 1/(1+m) and 1+m for a stretch of 1+m
uniform vec4 uSt[N]; // 1/spread along each axis, the distance scale, and a radius the blob never leaves
uniform vec4 uWb[N]; // wobble: (A cos phi, A sin phi) for the 3-lobed then the 5-lobed ripple
uniform vec2 uE[N];  // how fast the distance grows outside the bounding radius, and how far its bubbles reach
#if TINT
uniform vec3 uC[N];  // blob colours, in OKLab
uniform float uCs, uSw; // colour strength and marbling
#endif
#if NB > 0
uniform vec3 uBub[N*NB]; // bubble centres and radii
#endif

float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }

// an offset from a blob's centre mapped into its undeformed, unspread shape
vec2 local(vec2 p, vec4 b, vec4 f, vec4 s){
  vec2 q = p - b.xy;
  float a = dot(q, f.xy);
  return (f.xy*a*f.z + (q - f.xy*a)*f.w)*s.xy;
}

// signed distance to a blob, ignoring its wobble
float blobDist(vec2 p, vec4 b, vec4 f, vec4 s){ return (length(local(p, b, f, s)) - b.z)*s.z; }

float sdf(vec2 p){
  float d = 1e5;
  for (int i = 0; i < N; i++){
    vec4 b = uB[i], s = uSt[i], w = uWb[i];
    vec2 q = local(p, b, uDf[i], s);
    float l = length(q);
    // ripples round the rim: sin(3a + phi) and sin(5a + phi) built from cos a and sin a, with no atan
    vec2 cs = q/max(l, 1e-6);
    float c = cs.x, sn = cs.y, c2 = c*c, s2 = sn*sn;
    float sin3 = sn*(3. - 4.*s2), cos3 = c*(4.*c2 - 3.);
    float sin5 = sn*(5. + s2*(16.*s2 - 20.)), cos5 = c*(5. + c2*(16.*c2 - 20.));
    float wob = sin3*w.x + cos3*w.y + sin5*w.z + cos5*w.w;
    d = smin(d, (l - b.z - wob)*s.z, uMerge);
  }
  // and is flattened where it meets the edge
  float edge = -min(min(p.x, uRes.x - p.x), min(p.y, uRes.y - p.y));
  return -smin(-d, -edge, uS*0.02);
}

// a cheap distance that is never more than the true one, to spot pixels far from any blob
float bound(vec2 p){
  float d = 1e5;
  for (int i = 0; i < N; i++) d = min(d, (length(p - uB[i].xy) - uSt[i].w)*uE[i].x);
  return d;
}

float dome(vec2 p){
  float f = 0.;
  for (int i = 0; i < N; i++){
    vec2 q = local(p, uB[i], uDf[i], uSt[i]);
    f += exp(-dot(q,q)*uB[i].w);
  }
  return 1. - exp(-1.6*f);
}

// the height of the glass at p, given the distance d there
float hgtd(vec2 p, float d){
  float t = clamp(-d/(uS*0.10), 0., 1.);
  if (t <= 0.) return 0.;
  float bevel = sqrt(1. - (1.-t)*(1.-t));
  return bevel*(0.55 + dome(p)*0.45);
}
float hgt(vec2 p){ return hgtd(p, sdf(p)); }

vec3 tx(vec2 p){ return texture2D(uTex, clamp(p/uRes, 0.001, 0.999)).rgb; }
vec3 spectrum(float t){ return 0.5 + 0.5*cos(6.2831*(t + vec3(0., .33, .67))); }

#if TINT
vec3 fromLab(vec3 c){
  float l = c.x + 0.3963377774*c.y + 0.2158037573*c.z;
  float m = c.x - 0.1055613458*c.y - 0.0638541728*c.z;
  float s = c.x - 0.0894841775*c.y - 1.2914855480*c.z;
  l = l*l*l; m = m*m*m; s = s*s*s;
  vec3 lin = vec3(4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
                 -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
                 -0.0041960863*l - 0.7034186147*m + 1.7076147010*s);
  return pow(clamp(lin, 0., 1.), vec3(1./2.2));
}

// the colour of the glass at p. Where blobs of different colours have merged, each
// colour holds its own territory, and the seam between them is marbled by a slowly
// flowing warp; across the seam colours mix in OKLab with their chroma kept up, so
// they blend through clear, bright intermediate hues rather than going muddy
vec3 tint(vec2 p){
  vec2 w = p/uS;
  w += uSw*0.045*vec2(sin(w.y*9. + uT*0.8), sin(w.x*8. - uT*0.6));
  w += uSw*0.022*vec2(sin(w.y*21. + w.x*6. - uT*1.3), sin(w.x*17. - w.y*5. + uT*1.1));
  vec2 pw = w*uS;
  vec3 lab = vec3(0.);
  float ws = 1e-20, cs = 0.;
  for (int i = 0; i < N; i++){
    float wi = exp(-blobDist(pw, uB[i], uDf[i], uSt[i])/(uS*0.012));
    lab += wi*uC[i]; cs += wi*length(uC[i].yz); ws += wi;
  }
  lab /= ws; cs /= ws;
  lab.yz *= min(cs/max(length(lab.yz), 1e-5), 3.);
  return fromLab(lab);
}
#endif

void main(){
  vec2 p = gl_FragCoord.xy;
  vec3 col = tx(p);
  // most of the screen is nowhere near the glass or its shadow, and is just the paper
  if (bound(p) < uFar){
    float d = sdf(p);
    float aa = 1.2;
    float m = smoothstep(aa, -aa, d);
    vec3 bg = col;

    // --- ground: shadow + focused caustic behind the drop, hidden under solid glass
    if (d > -aa){
      vec2 so = vec2(0.03, -0.075)*uS;
      float ds = sdf(p - so);
      float sh = smoothstep(uS*0.10, -uS*0.04, ds);
      float caus = smoothstep(-uS*0.02, -uS*0.16, ds);
      // light through coloured glass colours its shadow and caustic
      vec3 lt = vec3(1.);
#if TINT
      if (sh > 0.002) lt = pow(max(tint(p - so), 0.02), vec3(uCs*0.6));
#endif
      bg *= (1. - sh*0.20)*mix(vec3(1.), lt, sh*0.5);
      bg += caus*vec3(1., .98, .94)*lt*0.16;
      float band = exp(-pow((ds + uS*0.012)/(uS*0.012), 2.));
      bg += (spectrum(ds/uS*6. + 0.2) - 0.5)*band*0.06;
      col = bg;
    }

    if (d < aa){
      // the slope of the glass, from the height here and a little to the right and above
      float e = 1.5;
      float h0 = hgtd(p, d);
      vec2 g = vec2(hgt(p + vec2(e, 0.)) - h0, hgt(p + vec2(0., e)) - h0)/e*uS; // scale-free
      vec3 n = normalize(vec3(-g*0.16, 1.));
      float rim = 1. - n.z;

      // refraction with dispersion
      vec2 off = g*uS*0.008*uRef;
      float cab = (0.015 + rim*0.07)*uDis;
      vec3 gc;
      gc.r = tx(p + off*(1. - cab)).r;
      gc.g = tx(p + off).g;
      gc.b = tx(p + off*(1. + cab)).b;

      // body: slight lift, darker thick edges, reflected room
      gc = gc*0.96 + 0.035;
#if TINT
      // coloured glass absorbs more where it is thicker
      float th = clamp(-d/(uS*0.10), 0., 1.);
      gc *= pow(max(tint(p), 0.02), vec3(uCs*(0.45 + 0.65*th)));
#endif
      float fr = pow(clamp(rim*1.4, 0., 1.), 1.6);
      gc = mix(gc, vec3(0.12), fr*0.38);
      vec3 env = tx(vec2(p.x, uRes.y - p.y) - n.xy*uS*0.5);
      gc = mix(gc, env, fr*0.22);

      // contour: dark outer line, bright inner line
      float ed = -d;
      gc *= 1. - 0.45*exp(-pow((ed - uS*0.003)/(uS*0.0035), 2.));
      gc += 0.28*exp(-pow((ed - uS*0.011)/(uS*0.004), 2.));

      // speculars
      vec3 V = vec3(0.,0.,1.);
      vec3 H1 = normalize(normalize(vec3(-.45, .55, .70)) + V);
      vec3 H2 = normalize(normalize(vec3(.55, -.35, .75)) + V);
      float s1 = max(dot(n, H1), 0.), s2 = max(dot(n, H2), 0.);
      gc += pow(s1, 220.)*1.8 + pow(s1, 26.)*0.10 + pow(s2, 120.)*0.55;
      gc += (spectrum(rim*2.5 + 0.1) - 0.5)*smoothstep(0.3, 0.8, rim)*0.25;

#if NB > 0
      // trapped air bubbles
      for (int i = 0; i < N; i++){
        if (length(p - uB[i].xy) > uE[i].y) continue;
        for (int j = 0; j < NB; j++){
          vec3 bb = uBub[i*NB + j];
          float br = bb.z, bd = length(p - bb.xy);
          if (bd > br) continue;
          float ring = smoothstep(br, br*0.75, bd)*(1. - smoothstep(br*0.75, br*0.35, bd));
          gc = mix(gc, gc*0.35, ring*0.85);
          gc += smoothstep(br*0.45, 0., length(p - bb.xy - vec2(-.3,.3)*br))*0.7;
        }
      }
#endif
      col = mix(bg, gc, m);
    }
  }
  gl_FragColor = vec4(col, 1.);
}`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const msg = gl.getShaderInfoLog(s); gl.deleteShader(s); throw new Error(msg); }
  return s;
}
const vshader = sh(gl.VERTEX_SHADER, vs);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// bubbles are uniforms now, so how many there can be depends on the GPU's uniform space
const MAXB = Math.max(0, Math.min(16, Math.floor(((gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS) || 0) - 64) / 8)));

// per-blob uniform data, packed on the CPU; a program's views cover just the blobs in play
const bufB = new Float32Array(32), bufDf = new Float32Array(32), bufSt = new Float32Array(32), bufWb = new Float32Array(32);
const bufE = new Float32Array(16), bufC = new Float32Array(24), bufBub = new Float32Array(8 * 16 * 3);

// programs are compiled once for each combination of blob count, bubble count and tint, and kept
const progs = new Map();
function program(N, NB, T) {
  const key = `${N} ${NB} ${T}`;
  let v = progs.get(key);
  if (v) return v;
  const prog = gl.createProgram();
  try {
    gl.attachShader(prog, vshader);
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `#define N ${N}\n#define NB ${NB}\n#define TINT ${T}\n${fs}`));
    gl.bindAttribLocation(prog, 0, 'a');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) {
    gl.deleteProgram(prog);
    // a GPU that cannot fit the bubbles does without them
    if (NB > 0) { v = program(N, 0, T); progs.set(key, v); return v; }
    throw e;
  }
  const U = n => gl.getUniformLocation(prog, n);
  v = { prog, NB,
    uRes: U('uRes'), uS: U('uS'), uT: U('uT'), uMerge: U('uMerge'), uFar: U('uFar'), uRef: U('uRef'), uDis: U('uDis'), uCs: U('uCs'), uSw: U('uSw'),
    uB: U('uB[0]'), uDf: U('uDf[0]'), uSt: U('uSt[0]'), uWb: U('uWb[0]'), uE: U('uE[0]'), uC: U('uC[0]'), uBub: U('uBub[0]'),
    B: bufB.subarray(0, 4 * N), Df: bufDf.subarray(0, 4 * N), St: bufSt.subarray(0, 4 * N), Wb: bufWb.subarray(0, 4 * N),
    E: bufE.subarray(0, 2 * N), C: bufC.subarray(0, 3 * N), Bub: bufBub.subarray(0, 3 * N * NB) };
  progs.set(key, v);
  return v;
}
let current = null;

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
[[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
 [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]
  .forEach(([k, v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));

function upload() {
  drawBackground();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, tex2d);
}

/* ---------------- settings ---------------- */
const pct = v => `${Math.round(v * 100)}%`;
const COLOUR_MODES = { clear: 'Clear glass', one: 'One colour', rainbow: 'Rainbow', each: 'A colour for each blob' };
const tinted = () => cfg.tint !== 'clear';
// settings are sliders unless they give a type; `when` hides a setting that does not apply

/* ---------------- colours ---------------- */
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const linear = c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
function oklab(hex) {
  const [r, g, b] = hexRgb(hex).map(linear);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
// the OKLab colour of blob i of n, with its hue turned by `turn` radians
function blobColour(i, n, turn) {
  const [L, a, b] = cfg.tint === 'rainbow' ? [0.74, 0.15 * Math.cos(i / n * 6.2832), 0.15 * Math.sin(i / n * 6.2832)]
    : oklab(cfg.tint === 'each' ? cfg.colours[i] : cfg.colour);
  const c = Math.cos(turn), s = Math.sin(turn);
  return [L, a * c - b * s, a * s + b * c];
}

/* ---------------- liquid bodies ---------------- */
// path(t) returns offsets in units of text half-width (x) and S (y)
const blobs = [
  { r: 0.20, seed: 1.3, path: t => [Math.sin(t*0.21)*0.62 + Math.sin(t*0.53)*0.12, Math.sin(t*0.37 + 1)*0.05] },
  { r: 0.12, seed: 4.1, path: t => [Math.sin(t*0.29 + 2.2)*0.7, Math.sin(t*0.41 + 0.3)*0.07] },
  { r: 0.085, seed: 7.7, path: t => [Math.sin(t*0.17 + 4.0)*0.75, Math.cos(t*0.33)*0.08] },
  { r: 0.10, seed: 2.9, path: t => [Math.sin(t*0.25 + 5.1)*0.55, Math.sin(t*0.47 + 2.4)*0.06] },
  { r: 0.07, seed: 5.6, path: t => [Math.sin(t*0.23 + 1.1)*0.8, Math.sin(t*0.31 + 3.3)*0.12] },
  { r: 0.15, seed: 3.4, path: t => [Math.sin(t*0.19 + 3.0)*0.5, Math.cos(t*0.27 + 1.7)*0.09] },
  { r: 0.06, seed: 8.8, path: t => [Math.sin(t*0.33 + 0.6)*0.85, Math.sin(t*0.39 + 4.4)*0.14] },
  { r: 0.11, seed: 6.2, path: t => [Math.sin(t*0.27 + 2.7)*0.65, Math.cos(t*0.43 + 0.9)*0.10] },
].map(b => ({ ...b, x: 0, y: 0, vx: 0, vy: 0, init: false,
  da: 0, db: 0, dva: 0, dvb: 0, // squash and stretch (see uDf in the shader) and its rate of change
  fly: 0, whizz: 0, home: null, // seconds left flying free, then whizzing back to home (or its path)
}));

const active = () => blobs.slice(0, cfg.count);
const radius = b => b.r * cfg.size * S;

function target(b, t) {
  const [ox, oy] = b.path(t);
  return [textBox.cx + ox * textBox.w * 0.5, H - (textBox.cy + oy * S)]; // GL coords (y up)
}

const drags = new Map(); // pointerId -> { b, x, y, dx, dy, trail, down }
const ptr = e => [e.clientX * DPR, H - e.clientY * DPR];
const held = b => { for (const d of drags.values()) if (d.b === b) return true; return false; };
canvas.addEventListener('pointerdown', e => {
  if (editing) editor.blur();
  noteTapStart(e);
  const [px, py] = ptr(e);
  let best = null, bd = Infinity;
  active().forEach(b => {
    if (held(b)) return;
    const d = Math.hypot(b.x - px, b.y - py) - radius(b);
    if (d < bd) { bd = d; best = b; }
  });
  const reach = S * (e.pointerType === 'touch' ? 0.14 : 0.08);
  if (best && bd < reach) {
    drags.set(e.pointerId, { b: best, x: px, y: py, dx: best.x - px, dy: best.y - py,
      trail: [[px, py, e.timeStamp]], down: [e.clientX, e.clientY, e.timeStamp] });

    canvas.classList.add('dragging');

  }
});
canvas.addEventListener('pointermove', e => {
  const d = drags.get(e.pointerId);
  if (!d) return;
  const [px, py] = ptr(e);
  d.x = px; d.y = py;
  // keep the last moment of movement, to measure the speed of a flick
  d.trail.push([px, py, e.timeStamp]);
  while (d.trail.length > 2 && e.timeStamp - d.trail[0][2] > 120) d.trail.shift();

const endDrag = e => { drags.delete(e.pointerId); if (!drags.size) canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', e => {
  const d = drags.get(e.pointerId);

    // a tap on merged blobs bursts them, and doesn't count towards a double-tap
    if (tap && burst(d.b)) { taps.delete(e.pointerId); lastTap = null; return; }
    if (!tap) flick(d.b, [...d.trail, [px, py, e.timeStamp]], e.timeStamp);

canvas.addEventListener('lostpointercapture', endDrag);

/* ---------------- flicks and bursts ---------------- */
const WHIZZ = 1.3;
// nudge the squash and stretch towards a stretch of the given strength along angle a
function kick(b, strength, a) {
  b.dva += cfg.jelly * strength * Math.cos(2 * a);
  b.dvb += cfg.jelly * strength * Math.sin(2 * a);
}
// a blob let go while moving fast flies free, with more of a push the faster the flick,
// then whizzes back to where it roams
function flick(b, trail, now) {
  const recent = trail.filter(([, , t]) => now - t <= 100);
  const [x0, y0, t0] = recent[0], [x1, y1, t1] = recent[recent.length - 1];
  const secs = (t1 - t0) / 1000;
  if (secs < 0.008 || !cfg.fling) return;
  let vx = (x1 - x0) / secs, vy = (y1 - y0) / secs;
  const speed = Math.hypot(vx, vy) / S; // in blob-world units per second
  if (speed < 0.7) return;
  const gain = Math.min(1 + cfg.fling * Math.min(speed / 4, 1.5), 9 * S / Math.hypot(vx, vy));
  b.vx = vx * gain; b.vy = vy * gain;
  b.fly = Math.min(0.2 + 0.15 * speed * gain, 1.8); b.whizz = 0; b.home = null;
  kick(b, Math.min(speed * gain, 12) * 0.9, Math.atan2(vy, vx));
}
// the blobs merged with b, found by following overlaps from one to the next
function clump(b0) {
  const free = active().filter(b => !held(b));
  const found = [b0];
  for (let i = 0; i < found.length; i++) {
    const a = found[i];
    free.forEach(b => {
      if (!found.includes(b) && Math.hypot(a.x - b.x, a.y - b.y) < radius(a) + radius(b) + S * cfg.merge * 0.3) found.push(b);
    });
  }
  return found;
}
// merged blobs fly apart, bounce off the walls, and then whizz back together
function burst(b0) {
  const group = clump(b0);
  if (group.length < 2) return false;
  let cx = 0, cy = 0, total = 0;
  group.forEach(b => { const w = radius(b) ** 2; cx += b.x * w; cy += b.y * w; total += w; });
  cx /= total; cy /= total;
  const spin = Math.random() * 6.2832;
  group.forEach((b, i) => {
    // blobs away from the centre fly straight out; one near the middle takes a spare direction
    let a = Math.hypot(b.x - cx, b.y - cy) > radius(b) * 0.2 ? Math.atan2(b.y - cy, b.x - cx) : spin + i / group.length * 6.2832;
    a += (Math.random() - 0.5) * 0.7;
    // small blobs are thrown further
    const speed = S * cfg.burstSpeed * (0.7 + Math.random() * 0.5) * Math.min(Math.sqrt(0.12 / b.r), 1.6);
    b.vx = Math.cos(a) * speed; b.vy = Math.sin(a) * speed;
    // slower bursts fly for longer, so the blobs still get to bounce off the walls
    b.home = [b.x, b.y]; b.fly = (1.6 + Math.random() * 0.6) / Math.sqrt(cfg.burstSpeed); b.whizz = 0;
    // a pop: squashed flat across the direction of travel, springing into a stretch along it
    kick(b, -6, a);
  });
  return true;
}
// stop iOS/Android from treating multi-finger gestures as page zoom/scroll
['gesturestart', 'gesturechange', 'touchmove'].forEach(t => document.addEventListener(t, e => { if (!hud.contains(e.target)) e.preventDefault(); }, { passive: false }));

/* ---------------- editing the word ---------------- */
// Double-clicks and double-taps are detected from pointer events: the native
// dblclick event is unreliable for touch. Editing starts on pointerup so that the
// focus survives the mousedown, and still counts as a gesture for mobile keyboards.
const editor = document.getElementById('word');
let editing = false, savedWord = WORD, lastTap = null;
const taps = new Map(); // pointerId -> { x, y, t }
function noteTapStart(e) {
  if (e.isPrimary) taps.set(e.pointerId, { x: e.clientX, y: e.clientY, t: e.timeStamp });
}
function noteTapEnd(e) {
  const down = taps.get(e.pointerId);
  taps.delete(e.pointerId);
  if (!down || e.timeStamp - down.t > 400 || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) { lastTap = null; return; }
  const tap = { x: e.clientX, y: e.clientY, t: e.timeStamp };
  if (lastTap && tap.t - lastTap.t < 450 && Math.hypot(tap.x - lastTap.x, tap.y - lastTap.y) < 30) {
    lastTap = null;
    startEdit();
  } else lastTap = tap;
}
function syncEditor() { editor.style.fontSize = `${wordFs / DPR}px`; }
function startEdit() {
  if (editing) return;

}
function endEdit(keep) {

  WORD = keep && w ? w : savedWord;
  editor.style.display = 'none';
  upload();

    params.set('text', WORD);
    try { history.replaceState(null, '', `${location.pathname}?${params}${location.hash}`); } catch (_) {}
  }
}
editor.addEventListener('input', () => { WORD = editor.value; upload(); syncEditor(); });
editor.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); endEdit(true); }
  else if (e.key === 'Escape') { e.preventDefault(); endEdit(false); }

setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 6000);

let drawnScale = 0;
function resize() {
  drawnScale = cfg.scale;

  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);

addEventListener('resize', resize);

let last = performance.now(), clock = 0, roam = 0, drift = 0, turn = 0;
let fpsFrames = 0, fpsTime = 0, fpsWorst = 0;
const T0 = +params.get('t') || 8;
// how far a blob of radius r at position x is pressed into either edge of [0, size]
const depth = (x, r, size) => Math.max(r - x, x - (size - r), 0);
const press = (x, r, size) => Math.min(depth(x, r, size) / r, cfg.press);
function wall(x, v, r, size) {
  if (x < r) return (r - x) * cfg.stiffness - v * cfg.damping;
  if (x > size - r) return (size - r - x) * cfg.stiffness - v * cfg.damping;
  return 0;
}
// never let a blob press in further than cfg.press of its radius; a blob flying free
// bounces back off. Returns the new position and velocity, and the speed of any impact
function limit(x, v, r, size, bounce) {
  const lo = r * (1 - cfg.press), hi = size - lo;
  if (x < lo) return [lo, v < 0 ? -v * bounce : v, Math.max(-v, 0)];
  if (x > hi) return [hi, v > 0 ? -v * bounce : v, Math.max(v, 0)];
  return [x, v, 0];
}
// each bubble wanders on its own: a slow orbit plus a drift at its own pace, all seeded once
const hash = n => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); };
const bubbleSeeds = blobs.map((b, i) => Array.from({ length: 16 }, (_, j) => {
  const s = i * 13 + j * 3.7 + b.seed;
  return { a0: hash(s) * 6.2831, av: (0.08 + 0.18 * hash(s + 1)) * Math.sign(hash(s + 4) - 0.5), orbit: 0.5 * Math.sqrt(hash(s + 2)),
    fx: 0.25 + 0.35 * hash(s + 5), fy: 0.25 + 0.35 * hash(s + 6), px: 6.2831 * hash(s + 7), py: 6.2831 * hash(s + 8), size: 0.010 + 0.022 * hash(s + 3) };
}));
function frame(now) {
  const elapsed = now - last;
  const dt = Math.min(0.05, elapsed / 1000); last = now;
  const pace = dt * (reduceMotion ? 0.25 : 1);
  clock += pace; roam += pace * cfg.roam; drift += pace * cfg.drift; turn += pace * cfg.cycle * 0.5;
  const t = roam + T0;
  const T = tinted() ? 1 : 0;
  const v = program(cfg.count, Math.min(cfg.bubbles, MAXB), T), NB = v.NB;
  // blobs beyond the chosen number are let go, and start afresh if they come back
  blobs.slice(cfg.count).forEach(b => { b.init = false; b.vx = b.vy = b.da = b.db = b.dva = b.dvb = b.fly = b.whizz = 0; b.home = null; });
  for (const [id, d] of drags) if (!active().includes(d.b)) drags.delete(id);
  if (!drags.size) canvas.classList.remove('dragging');
  active().forEach((b, i) => {
    let [tx, ty] = target(b, t);
    let k = 5, c = 3.2;
    if (held(b)) {
      for (const d of drags.values()) if (d.b === b) { tx = d.x + d.dx; ty = d.y + d.dy; }
      k = 60; c = 11; b.fly = b.whizz = 0; b.home = null;
    } else if (b.fly > 0) {
      // flying free: no pull home and hardly any drag, so it keeps its momentum
      k = 0; c = 0.35;
      if ((b.fly -= dt) <= 0) b.whizz = WHIZZ;
    } else if (b.whizz > 0) {
      // a strong, springy pull that eases back to the usual gentle one
      const f = b.whizz / WHIZZ;
      k = 5 + 20 * f; c = 3.2 + 3.5 * f;
      if (b.home) [tx, ty] = b.home;
      if ((b.whizz -= dt) <= 0) b.home = null;
    }
    if (!b.init) { b.x = tx; b.y = ty; b.init = true; }
    const breathe = 1 + 0.04 * Math.sin(t * 0.9 + b.seed * 3);
    const r = radius(b) * breathe * 1.03;
    // the edges of the window are soft springs: a blob presses into them and squishes
    // (the shader flattens it against the edge), then springs back out
    const [wx, wy] = [wall(b.x, b.vx, r, W), wall(b.y, b.vy, r, H)];
    b.vx += ((tx - b.x) * k - b.vx * c + wx) * dt;
    b.vy += ((ty - b.y) * k - b.vy * c + wy) * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    const bounce = b.fly > 0 ? 0.8 : 0;
    let hitX, hitY;
    [b.x, b.vx, hitX] = limit(b.x, b.vx, r, W, bounce);
    [b.y, b.vy, hitY] = limit(b.y, b.vy, r, H, bounce);
    // hitting a wall squashes a blob flat against it
    if (hitX) kick(b, -Math.min(hitX / S, 8) * 1.6, 0);
    if (hitY) kick(b, -Math.min(hitY / S, 8) * 1.6, Math.PI / 2);
    // squash and stretch: a wobbly spring pulls towards a stretch along the direction of travel
    const speed = Math.hypot(b.vx, b.vy) / S, a = 2 * Math.atan2(b.vy, b.vx);
    const want = cfg.jelly * 0.5 * Math.tanh(speed / 3);
    b.dva += ((want * Math.cos(a) - b.da) * 380 - b.dva * 9) * dt;
    b.dvb += ((want * Math.sin(a) - b.db) * 380 - b.dvb * 9) * dt;
    b.da += b.dva * dt; b.db += b.dvb * dt;
    let m = Math.hypot(b.da, b.db);
    if (m > 0.6) { b.da *= 0.6 / m; b.db *= 0.6 / m; m = 0.6; }
    if (m < 1e-4) m = 0;

    // --- pack what the shader needs to know about this blob
    const rz = radius(b) * breathe;
    // the stretch is by 1+m along the axis u, and the area is kept, so 1/(1+m) across it
    let ux = 0, uy = 1;
    if (m) {
      const hx = b.da / m + 1, hy = b.db / m, hl = Math.hypot(hx, hy);
      if (hl > 1e-3) { ux = hx / hl; uy = hy / hl; }
    }
    // a blob pressed against an edge spreads out along it
    const stx = 1 + cfg.spread * press(b.y, r, H), sty = 1 + cfg.spread * press(b.x, r, W);
    const stMin = Math.min(stx, sty), stMax = Math.max(stx, sty);
    const scale = stMin / (1 + m);
    bufB.set([b.x, b.y, rz, 1 / (rz * rz * 0.7)], i * 4);
    bufDf.set([ux, uy, 1 / (1 + m), 1 + m], i * 4);
    // nothing of the blob, wobble included, lies outside this radius of its centre
    bufSt.set([1 / stx, 1 / sty, scale, rz * (1 + 0.026 * cfg.wobble) * (1 + m) * stMax], i * 4);
    const A3 = 0.016 * cfg.wobble * rz, A5 = 0.010 * cfg.wobble * rz, p3 = clock * 1.6 + i * 2.1, p5 = -clock * 2.2 + i * 1.3;
    bufWb.set([A3 * Math.cos(p3), A3 * Math.sin(p3), A5 * Math.cos(p5), A5 * Math.sin(p5)], i * 4);
    if (T) bufC.set(blobColour(i, cfg.count, turn), i * 3);
    // the bubbles, spread with a squished blob, stretched with it, and kept clear of the edge
    let reach = 0;
    const seeds = bubbleSeeds[i];
    for (let j = 0; j < NB; j++) {
      const s = seeds[j], an = s.a0 + drift * s.av;
      let x = s.orbit * Math.cos(an) + 0.22 * Math.sin(drift * s.fx + s.px) + 0.08 * Math.sin(drift * s.fy * 2.3 + s.py);
      let y = s.orbit * Math.sin(an) + 0.22 * Math.cos(drift * s.fy + s.py) + 0.08 * Math.sin(drift * s.fx * 1.9 + s.px);
      const ql = Math.hypot(x, y);
      if (ql > 0.72) { x *= 0.72 / ql; y *= 0.72 / ql; }
      x *= rz * stx; y *= rz * sty;
      const along = x * ux + y * uy, k1 = 1 + m;
      const dx = ux * along * k1 + (x - ux * along) / k1, dy = uy * along * k1 + (y - uy * along) / k1;
      const br = cfg.bubbleSize * rz * s.size;
      const bx = Math.min(Math.max(b.x + dx, br * 3), W - br * 3), by = Math.min(Math.max(b.y + dy, br * 3), H - br * 3);
      const o = (i * NB + j) * 3;
      bufBub[o] = bx; bufBub[o + 1] = by; bufBub[o + 2] = br;
      reach = Math.max(reach, Math.hypot(bx - b.x, by - b.y) + br);
    }
    bufE.set([scale / ((1 + m) * stMax), reach], i * 2);
  });
  if (v !== current) { gl.useProgram(v.prog); current = v; }
  gl.uniform2f(v.uRes, W, H);
  gl.uniform1f(v.uS, S);
  gl.uniform1f(v.uT, clock);
  gl.uniform4fv(v.uB, v.B);
  gl.uniform4fv(v.uDf, v.Df);
  gl.uniform4fv(v.uSt, v.St);
  gl.uniform4fv(v.uWb, v.Wb);
  gl.uniform2fv(v.uE, v.E);
  if (T) {
    gl.uniform3fv(v.uC, v.C);
    gl.uniform1f(v.uCs, cfg.strength);
    gl.uniform1f(v.uSw, cfg.tint === 'one' ? 0 : cfg.marble);
  }
  if (NB) gl.uniform3fv(v.uBub, v.Bub);
  gl.uniform1f(v.uMerge, S * cfg.merge);
  // beyond this cheap lower bound on the distance, a pixel shows only paper (see bound() in the shader)
  gl.uniform1f(v.uFar, S * (cfg.merge + 0.19));
  gl.uniform1f(v.uRef, cfg.refraction);
  gl.uniform1f(v.uDis, cfg.dispersion);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (cfg.fps) {
    fpsFrames++; fpsTime += elapsed; fpsWorst = Math.max(fpsWorst, elapsed);
    if (fpsTime >= 500) {
      fpsBox.textContent = `${Math.round(fpsFrames * 1000 / fpsTime)} fps\n${(fpsTime / fpsFrames).toFixed(1)} ms avg, ${Math.round(fpsWorst)} ms worst\n${W}×${H} px`;
      fpsFrames = fpsTime = fpsWorst = 0;
    }
  }
  requestAnimationFrame(frame);
}

const start = () => {
  try { program(cfg.count, Math.min(cfg.bubbles, MAXB), tinted() ? 1 : 0); }
  catch (e) { console.error(e); document.getElementById('err').style.display = 'grid'; return; }
  resize(); requestAnimationFrame(frame);
};
if (document.fonts && document.fonts.load) {
  Promise.race([document.fonts.load(`800 100px Inter`), new Promise(r => setTimeout(r, 2500))]).then(start, start);
} else start();
})();
</script>
</body>
