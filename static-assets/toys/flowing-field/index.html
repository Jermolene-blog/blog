<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0b10">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="../pwa.js" defer></script>
<title>Flowing Field</title>
<meta name="description" content="An animated ink drawing of thousands of fine pen strokes sweeping into dark creased ridges, with sections filled with hand-drawn patterns. Drag to rake the strokes into line, then randomise, explore nearby drawings and cycle psychedelic colours">
<meta name="toy-tagline" content="Thousands of fine pen strokes sweep into ridges and rake into line under your finger">
<meta name="toy-category" content="trifles">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed live ink flow canvas; floating lacquer toolbar bottom, collapsible control panel right (bottom sheet on phones). Single dark UI look by choice. */
:root{
  --ink:#0c0b10;
  --lacquer:rgba(14,12,19,.84);
  --rice:#ece6da;
  --dim:#a39bab;
  --line:rgba(236,230,218,.14);
  --accent:hsl(200 60% 62%);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--rice);font-family:var(--f-body);-webkit-font-smoothing:antialiased;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#c.stroking{cursor:grabbing}
canvas#c.panning{cursor:move}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mark{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;align-items:baseline;gap:10px;pointer-events:none;background:var(--lacquer);border:1px solid var(--line);border-radius:10px;padding:6px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mark h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em}
.mark span{font-family:var(--f-display);font-weight:600;font-size:12px;color:var(--accent);letter-spacing:.3em}

.hint{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lacquer);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-weight:600;font-size:15px;pointer-events:none;transition:opacity .8s ease;white-space:nowrap;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hint.gone{opacity:0}

.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:5px;background:var(--lacquer);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5;width:max-content;max-width:calc(100% - 24px)}
.bar button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.02em;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.bar button:hover{background:rgba(236,230,218,.08)}
.bar button[aria-pressed="true"]{background:var(--accent);color:#0c0b10}
.bar kbd{font-family:var(--f-mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.bar button[aria-pressed="true"] kbd{color:#0c0b10;border-color:rgba(0,0,0,.3)}
@media (max-width:620px){.bar kbd{display:none}.bar button{padding:8px 9px;font-size:12px}}

.panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:292px;background:var(--lacquer);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow-y:auto;z-index:4;padding:14px 16px 18px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
@media (max-width:620px){.panel{top:auto;left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));width:auto;max-height:52vh;bottom:calc(112px + env(safe-area-inset-bottom,0px))}}
.grp{display:flex;flex-direction:column;gap:9px}
.grp h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:14px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.grp h2 small{font-family:var(--f-display);font-weight:600;font-size:12px;color:var(--dim)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.row label,.lbl{font-size:12px;color:var(--rice)}
.row output{font-family:var(--f-mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.row input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--rice);margin-top:-5.5px;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--rice)}
input[type=range]:focus-visible::-webkit-slider-thumb{background:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:rgba(0,0,0,.3);padding:3px;border-radius:8px}
.seg button{border:0;background:transparent;font-size:11px;padding:6px 0;border-radius:6px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--rice);color:#0c0b10}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.btns button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 8px;cursor:pointer;font-family:var(--f-body);font-size:11px}
.foot{font-size:11px;color:var(--dim);line-height:1.6;max-width:65ch;margin:0}
.foot kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 3px}

.grid{position:fixed;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;z-index:3}
.grid button{border:0;background:transparent;cursor:pointer;position:relative;outline-offset:-3px}
.grid button:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.grid button span{position:absolute;left:8px;bottom:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--lacquer);padding:3px 6px;border-radius:4px;color:var(--dim)}
.grid button.centre{box-shadow:inset 0 0 0 2px var(--accent)}
.grid button.centre span{color:var(--accent)}
.xbar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px;align-items:center;background:var(--lacquer);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;font-size:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100% - 24px)}
.xbar input{width:110px}
.xbar button{border:0;background:rgba(236,230,218,.1);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12px;white-space:nowrap}
.nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15px}
.dbg{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:6;background:var(--lacquer);border:1px solid var(--line);border-radius:10px;padding:8px 10px;pointer-events:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dbg pre{margin:0 0 6px;font-family:var(--f-mono);font-size:11px;line-height:1.5;color:var(--rice);font-variant-numeric:tabular-nums}
.dbg b{font-weight:500;color:var(--accent)}
.dbg canvas{display:block;width:160px;height:36px}
.hideui .mark,.hideui .bar,.hideui .panel,.hideui .xbar,.hideui .hint{display:none}
</style>

<canvas id="c" aria-label="Animated field of feathered ink strokes and hand-drawn patterns. Drag to draw through it."></canvas>
<div class="mark"><h1>Flowing Field</h1><span>流</span></div>
<div class="hint" id="hint">Drag to draw through the ink</div>
<div class="dbg" id="dbg" hidden><pre id="dbgt"></pre><canvas id="dbgc" width="320" height="72" aria-label="Frame time graph"></canvas></div>

<div class="grid" id="grid" hidden></div>
<div class="xbar" id="xbar" hidden>
  <label for="mut">Mutation</label><input id="mut" type="range" min="0.05" max="1" step="0.01" value="0.35">
  <button id="reroll" type="button">New neighbours</button>
  <button id="xdone" type="button">Done</button>
</div>

<aside class="panel" id="panel" aria-label="Controls"></aside>

<nav class="bar" aria-label="Actions">
  <button id="bRand" type="button">Randomise <kbd>R</kbd></button>
  <button id="bExp" type="button" aria-pressed="false">Explore <kbd>E</kbd></button>
  <button id="bPause" type="button" aria-pressed="false">Pause <kbd>␣</kbd></button>
  <button id="bReset" type="button">Reset</button>
  <button id="bPurr" type="button" aria-pressed="true">Nib sound</button>
  <button id="bPanel" type="button" aria-pressed="true">Controls</button>
</nav>

<script>
(()=>{
// ---------- parameters ----------
const SPEC=[
 {g:'Pen',jp:'筆',items:[
  {k:'hand',l:'Nib width (px)',min:20,max:240,step:1,d:90,keep:1},
  {k:'press',l:'Pen pressure',min:.1,max:1,step:.01,d:.75,keep:1},
  {k:'memory',l:'Mark persistence (s)',min:1,max:120,step:1,d:12,keep:1},
  {k:'purr',l:'Nib sound volume',min:0,max:1,step:.01,d:.6,keep:1},
 ]},
 {g:'Field',jp:'場',items:[
  {k:'scale',l:'Frequency',min:.3,max:5,step:.01,d:1.1},
  {k:'oct',l:'Detail layers',min:1,max:4,step:1,d:2},
  {k:'gain',l:'Detail strength',min:.15,max:.8,step:.01,d:.42},
  {k:'crease',l:'Crease sharpness',min:0,max:1,step:.01,d:1},
  {k:'curl',l:'Curl (degrees)',min:-90,max:90,step:1,d:42},
  {k:'warp',l:'Warp',min:0,max:1.5,step:.01,d:.2},
  {k:'drift',l:'Drift speed',min:0,max:1,step:.005,d:.08},
 ]},
 {g:'Tangle',jp:'紋',items:[
  {k:'tAmt',l:'Patterned sections',min:0,max:1,step:.01,d:.6},
  {k:'tCell',l:'Section size',min:.2,max:2,step:.01,d:.6},
  {k:'tVar',l:'Pattern variety',min:1,max:9,step:1,d:9},
  {k:'tSp',l:'Line spacing (px)',min:4,max:40,step:.5,d:10},
  {k:'tW',l:'Line weight',min:.3,max:4,step:.05,d:1.2},
  {k:'tWob',l:'Freehand wobble',min:0,max:1,step:.01,d:.45},
  {k:'tFill',l:'Black fills',min:0,max:1,step:.01,d:.3},
  {k:'tStr',l:'String weight (px)',min:0,max:6,step:.1,d:2.2},
  {k:'tMove',l:'Line drift',min:-1,max:1,step:.01,d:.12},
 ]},
 {g:'Feathering',jp:'線',items:[
  {k:'spacing',l:'Stroke spacing (px)',min:3,max:24,step:.5,d:7.5,keep:1},
  {k:'len',l:'Stroke length (px)',min:10,max:300,step:1,d:170},
  {k:'width',l:'Line weight',min:.3,max:5,step:.05,d:1.1},
  {k:'taper',l:'Taper',min:0,max:1,step:.01,d:.7},
  {k:'ink',l:'Ink load',min:.05,max:1,step:.01,d:.55},
  {k:'dash',l:'Dry-brush breaks',min:0,max:.8,step:.01,d:.08},
  {k:'dashLen',l:'Break length (px)',min:3,max:40,step:.5,d:14},
  {k:'flow',l:'Ink travel',min:-3,max:3,step:.05,d:.6},
 ]},
 {g:'Colour',jp:'色',items:[
  {k:'mode',l:'Palette',type:'seg',opts:['Ink','Spectrum','Acid','Duotone'],d:0},
  {k:'key',l:'Colour by',type:'seg',opts:['Direction','Field','Stroke'],d:0},
  {k:'hue',l:'Hue',min:0,max:1,step:.005,d:.6},
  {k:'hueSpread',l:'Hue range',min:0,max:3,step:.01,d:1},
  {k:'sat',l:'Saturation',min:0,max:1,step:.01,d:.05},
  {k:'cycle',l:'Colour cycling',min:-.5,max:.5,step:.005,d:.03},
 ]},
 {g:'Paper',jp:'紙',items:[
  {k:'paper',l:'Paper tone',min:0,max:1,step:.01,d:.93},
  {k:'grain',l:'Grain',min:0,max:1,step:.01,d:.25},
 ]},
];
const ALL=SPEC.flatMap(g=>g.items);
const DEF=Object.fromEntries(ALL.map(s=>[s.k,s.d]));DEF.seed=1729;
const clone=o=>JSON.parse(JSON.stringify(o));
const LS='sumi-field-v3';
let P=clone(DEF);
try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s)P=Object.assign(clone(DEF),s)}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- GL ----------
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{antialias:true,premultipliedAlpha:false});
if(!gl){document.body.insertAdjacentHTML('beforeend','<div class="nogl">Flowing Field needs WebGL2, which this browser does not provide.</div>');return}
const FAST=!!gl.getExtension('EXT_color_buffer_float')&&location.hash!=='#slow';
const ENC=FAST?0:1;
const MAXTEX=gl.getParameter(gl.MAX_TEXTURE_SIZE);

const NOISE=`
vec3 m289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 m289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 perm(vec4 x){return m289(((x*34.)+1.)*x);}
float snoise(vec3 v){
 const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
 vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
 vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
 vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
 i=m289(i);
 vec4 p=perm(perm(perm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
 vec3 ns=.142857142857*D.wyz-D.xzx;
 vec4 j=p-49.*floor(p*ns.z*ns.z);
 vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
 vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);
 vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
 vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));
 vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
 vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
 vec4 nr=1.79284291400159-.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));
 p0*=nr.x;p1*=nr.y;p2*=nr.z;p3*=nr.w;
 vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
 return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
vec3 hsl(float h,float s,float l){vec3 c=clamp(abs(mod(h*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);return l+s*(c-.5)*(1.-abs(2.*l-1.));}
`;
// Zentangle-style sections: wobbly Voronoi 'string' divides the plane; each section is feathering or a hand-drawn line pattern.
const TANGLE=`
uniform float uTAmt,uTCell,uTVar,uTPer,uTWob,uTKOff;
vec3 h33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
vec2 site(vec2 c){vec3 h=h33(vec3(c,uSeedOff*7.1));return c+.5+.36*vec2(sin(uT*1.3+h.x*6.283),cos(uT*1.1+h.y*6.283));}
vec2 cellP(vec2 p){vec2 q=p/uTCell;return q+uTWob*.22*vec2(snoise(vec3(q*1.3,uT*.4+uSeedOff+40.)),snoise(vec3(q*1.3+7.7,uT*.4+uSeedOff+50.)));}
bool tangled(vec2 id){return h33(vec3(id,uSeedOff+3.7)).x<uTAmt;}
vec2 nearest(vec2 q,out vec2 s){vec2 ip=floor(q),bid=ip;float bd=1e9;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 c=ip+vec2(i,j);vec2 t=site(c);vec2 e=q-t;float d=dot(e,e);if(d<bd){bd=d;bid=c;s=t;}}
  return bid;}
float border(vec2 q,vec2 bid,vec2 s,out vec2 nid){float ed=1e9;nid=bid;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){if(i==0&&j==0)continue;vec2 c=bid+vec2(i,j);vec2 t=site(c);vec2 n=t-s;float l=length(n);if(l<1e-4)continue;n/=l;float d=dot(.5*(s+t)-q,n);if(d<ed){ed=d;nid=c;}}
  return ed;}
`;
const INK=`
vec3 ink(float key){
  float t=uHue+key*uHueSpread+uPhase;
  if(uMode==0){vec3 base=uAdd==1?vec3(.93,.91,.87):vec3(.05,.05,.07);vec3 tint=hsl(fract(t),1.,uAdd==1?.7:.3);return mix(base,tint,uSat*.85);}
  if(uMode==1)return hsl(fract(t),uSat*.5+.5,uAdd==1?.6:.42);
  if(uMode==2){vec3 c=.5+.5*cos(6.28318*(t+vec3(0.,.33,.67)));float y=dot(c,vec3(.3,.59,.11));c=mix(vec3(y),c,.6+.6*uSat);return clamp(uAdd==1?c:c*.8,0.,1.);}
  float m=.5+.5*sin(6.28318*(key*uHueSpread+uPhase));
  return mix(hsl(fract(uHue),.4+.6*uSat,uAdd==1?.55:.32),hsl(fract(uHue+.5),.4+.6*uSat,uAdd==1?.7:.45),m);
}
`;
const VS_TRI=`#version 300 es
layout(location=0) in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;

// Flow field: noise gradient, rotated by curl, then blended toward the groomed (stroked) direction.
const FS_FIELD=`#version 300 es
precision highp float;
uniform vec2 uSize,uView,uPan;uniform float uZoom,uScale,uGain,uCrease,uCurl,uWarp,uT,uSeedOff;uniform int uOct;
uniform sampler2D uGroom,uFsc;uniform int uGroomOn,uEnc,uPass;
out vec4 o;
${NOISE}
${TANGLE}
float F(vec2 p){
  vec2 w=p;
  if(uWarp>0.)w+=uWarp*vec2(snoise(vec3(p*.6,uT*.7+uSeedOff+11.)),snoise(vec3(p*.6+5.2,uT*.7+uSeedOff+23.)));
  float a=1.,fr=uScale,s=0.,n=0.;
  for(int k=0;k<4;k++){if(k>=uOct)break;float nz=snoise(vec3(w*fr,uT+uSeedOff+float(k)*17.));s+=a*mix(nz,.5-abs(nz)*(k==0?1.:1.2),uCrease);n+=a;a*=uGain;fr*=2.07;w=mat2(.8,-.6,.6,.8)*w;}
  return s/n;
}
float rf(ivec2 c){ivec2 mx=ivec2(uSize)-1;return dot(texelFetch(uFsc,clamp(c,ivec2(0),mx),0).xy,vec2(1.,1./255.));}
void main(){
  vec2 uv=gl_FragCoord.xy/uSize;
  if(uPass==0){float m=min(uView.x,uView.y);vec2 p=(uv-.5)*uView/m*2./uZoom+uPan;
    float f=clamp(F(p)*.5+.5,0.,.9999)*255.;o=vec4(floor(f)/255.,fract(f),0.,1.);return;}
  ivec2 ci=ivec2(gl_FragCoord.xy);
  vec2 g=vec2(rf(ci+ivec2(1,0))-rf(ci-ivec2(1,0)),rf(ci+ivec2(0,1))-rf(ci-ivec2(0,1)));
  float L=length(g);vec2 v=L>1e-8?g/L:vec2(1.,0.);

function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume().catch(()=>{});return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null;return}
  // nib on paper: white noise with a fibrous grain, band-passed; volume and brightness follow pen speed
  const sr=ac.sampleRate,len=sr*2,buf=ac.createBuffer(1,len,sr),d=buf.getChannelData(0);let g=1;
  for(let i=0;i<len;i++){if(i%Math.floor(sr/900)===0)g=.35+Math.random()*.9;d[i]=(Math.random()*2-1)*g}

bPurr.onclick=()=>{initAudio();setPurr(!purrOn)};
const bPanel=document.getElementById('bPanel');function setPanel(v){panel.hidden=!v;bPanel.setAttribute('aria-pressed',v)}
bPanel.onclick=()=>setPanel(panel.hidden);
if(innerWidth<620)setPanel(false);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.key!==' ')return;const k=e.key.toLowerCase();
  if(k==='r')document.getElementById('bRand').click();else if(k==='e')bExp.click();else if(k===' '){e.preventDefault();setPause(!paused)}else if(k==='h')document.body.classList.toggle('hideui');else if(k==='d')setDbg(dbg.hidden);else if(k==='escape'&&exploring)setExplore(false)});

// ---------- pointer: drag rakes the strokes; two fingers / right / shift pan and pinch ----------
const ptrs=new Map();let mode=null,pinch=null;
const hint=document.getElementById('hint');
const toW=(x,y)=>{const m=Math.min(cssW,cssH);return{x:(x-cssW/2)/m*2/view.z+view.x,y:-(y-cssH/2)/m*2/view.z+view.y}};
function setMode(m){mode=m;cv.classList.toggle('stroking',m==='stroke');cv.classList.toggle('panning',m==='pan'||m==='pinch');handDown=m==='stroke'}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  initAudio();cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.timeStamp});
  if(ptrs.size===1)setMode(e.button!==0||e.shiftKey?'pan':'stroke');
  else{const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};setMode('pinch')}
});
function addSeg(x0,y0,x1,y1,speed,pressure){
  const len=Math.hypot(x1-x0,y1-y0);if(len<.3)return;
  const sx=gW/cssW,sy=gH/cssH;
  const str=Math.min(1,(.3+speed/900))*P.press*pressure;
  const s=[x0*sx,(cssH-y0)*sy,x1*sx,(cssH-y1)*sy,(x1-x0)/len,-(y1-y0)/len,str,P.hand*sx*.5];
  if(segs.length>=16){const l=segs[15];l[2]=s[2];l[3]=s[3];l[4]=(l[4]+s[4])/2;l[5]=(l[5]+s[5])/2;const q=Math.hypot(l[4],l[5])||1;l[4]/=q;l[5]/=q;l[6]=Math.max(l[6],s[6])}
  else segs.push(s);
}
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){
    const x=ev.clientX,y=ev.clientY,dx=x-p.x,dy=y-p.y;const dtm=Math.max(1,ev.timeStamp-p.t);
    if(mode==='stroke'){
      const sp=Math.hypot(dx,dy)/dtm*1000;
      addSeg(p.x,p.y,x,y,sp,ev.pointerType==='pen'?.35+.9*(ev.pressure||.5):1);
      handSpeed+=(sp-handSpeed)*.25;lastStrokeT=performance.now();
      if(!hint.classList.contains('gone')&&Math.hypot(dx,dy)>2)hint.classList.add('gone');
    }else if(mode==='pan'){const m=Math.min(cssW,cssH);view.x-=dx/m*2/view.z;view.y+=dy/m*2/view.z}
    p.x=x;p.y=y;p.t=ev.timeStamp;
  }
  if(mode==='pinch'&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    const before=toW(pinch.mx,pinch.my);view.z=Math.min(8,Math.max(.25,view.z*d/pinch.d));const after=toW(mx,my);
    view.x+=before.x-after.x;view.y+=before.y-after.y;pinch={d,mx,my}}
  if(mode!=='stroke')dirty=true;
});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0)setMode(null);else if(mode==='pinch'&&ptrs.size===1){mode='after-pinch';handDown=false}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const b=toW(e.clientX,e.clientY);view.z=Math.min(8,Math.max(.25,view.z*Math.exp(-e.deltaY*.0015)));const a=toW(e.clientX,e.clientY);view.x+=b.x-a.x;view.y+=b.y-a.y;dirty=true},{passive:false});

resize();sync();setPause(paused);setPurr(purrOn);setAccent();requestAnimationFrame(frame);
window.__sumi={get fast(){return FAST},halt(){halted=true},snap(){return new Promise(r=>{snapCb=r;dirty=true})},frames(){return frameN}};
})();
</script>
