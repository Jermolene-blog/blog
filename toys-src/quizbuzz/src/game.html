<meta charset="utf-8">
<title>Quizbuzz</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*__FONTS__*/</style>
<style>
/* Layout: a 16:9 late-60s colour studio (scaled as one unit) above a strip of host controls and a grid of buzzer pads. Single committed look. */
:root{
  --teak:#1d1411; --teak2:#2b1d18; --wood:#6e4024; --wood2:#8a5530;
  --peacock:#0f5a60; --peacock2:#0a3f44; --deep:#082c30;
  --cream:#f4e6c6; --cream2:#e9d4a6; --ink:#1e1712;
  --tangerine:#e8742a; --mustard:#e2a62a; --avocado:#8b9b2c; --sky:#3a8fb3; --plum:#97406f; --coral:#de604c;
  --ok:#9bbd2e; --bad:#de604c;
  --f-display:"Shrikhand","Cooper Black","Georgia",serif;
  --f-label:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-body:"Jost","Futura","Century Gothic","Helvetica Neue",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--teak);color:var(--cream);font-family:var(--f-body);margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
#app{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 24px;display:flex;flex-direction:column;gap:10px;max-width:1500px;margin:0 auto}

/* ---------- scaled boxes ---------- */
.fit{position:relative;width:100%;overflow:hidden}
.fit>.inner{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---------- STAGE ---------- */
#stageFit{margin:0 auto;border-radius:10px;box-shadow:0 0 0 2px #000,0 10px 40px #000a}
.stage{width:1600px;height:900px;position:relative;overflow:hidden;background:var(--peacock2);font-family:var(--f-body);filter:saturate(.93) contrast(1.03)}
.set{position:absolute;inset:0;
  background:
   radial-gradient(ellipse 70% 60% at 50% 38%,#1a7a80 0%,var(--peacock) 45%,var(--peacock2) 100%);}
.flat{position:absolute;top:110px;width:250px;height:520px;border-radius:0 0 125px 125px;overflow:hidden;opacity:.9}
.flat.l{left:-40px}.flat.r{right:-40px}
.flat::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 70%,var(--tangerine) 0 22px,var(--mustard) 22px 44px,var(--cream) 44px 52px,var(--plum) 52px 74px)}
.flat.r::before{background:repeating-radial-gradient(circle at 50% 70%,var(--avocado) 0 22px,var(--mustard) 22px 44px,var(--cream) 44px 52px,var(--sky) 52px 74px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(#3b211a,#22130f);border-top:6px solid #120a08}
.floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 118px,#0003 118px 122px)}
.marquee{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 46px 12px;border-radius:60px;background:var(--deep);box-shadow:0 0 0 5px var(--wood),0 0 0 9px var(--teak2),0 8px 30px #0008;white-space:nowrap}
.marquee h1{margin:0;font:400 58px/1.15 var(--f-display);color:var(--cream);text-shadow:3px 3px 0 var(--tangerine),6px 6px 0 var(--plum);letter-spacing:.5px}
.bulbs{position:absolute;inset:-4px;border-radius:60px;pointer-events:none;
  background:radial-gradient(circle,#fff6d0 0 3px,#ffd36a 4px,#0000 6px) 0 0/30px 30px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% 10px no-repeat,linear-gradient(#000 0 0) bottom/100% 10px no-repeat;mask:linear-gradient(#000 0 0) top/100% 10px no-repeat,linear-gradient(#000 0 0) bottom/100% 10px no-repeat;animation:chase 1.2s steps(2) infinite}
@keyframes chase{50%{background-position:15px 0}}

.screen{position:absolute;left:250px;top:128px;width:1100px;height:500px;border-radius:44px/56px;background:var(--cream);color:var(--ink);
  box-shadow:0 0 0 14px var(--wood),0 0 0 18px #3a2014,0 0 0 22px var(--wood2),0 20px 50px #000a, inset 0 0 60px #b9925066;overflow:hidden}
.screen .pane{position:absolute;inset:0;padding:34px 50px 40px;display:flex;flex-direction:column}
.eyebrow{font:400 17px/1 var(--f-label);letter-spacing:3px;text-transform:uppercase;color:var(--plum);display:flex;justify-content:space-between;gap:20px}
.eyebrow .cat{color:var(--peacock)}
.qtext{font:700 44px/1.18 var(--f-body);margin:22px 0 0;text-wrap:balance;min-height:110px}
.qtext.long{font-size:38px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin-top:auto}
.opt{display:flex;align-items:center;gap:16px;min-height:86px;padding:10px 20px 10px 12px;border-radius:50px;background:#fff7e2;box-shadow:inset 0 0 0 3px #0001;position:relative;transition:opacity .3s,transform .3s}
.opt .let{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:400 30px var(--f-display);color:#fff;text-shadow:2px 2px 0 #0003;box-shadow:inset -4px -6px 0 #0002}
.opt .ot{font:600 30px/1.1 var(--f-body);text-wrap:balance}
.opt .who{position:absolute;right:16px;top:-12px;display:flex;gap:4px}
.chip{min-width:28px;height:28px;padding:0 8px;border-radius:14px;font:400 12px/28px var(--f-label);color:#fff;text-align:center;box-shadow:0 2px 0 #0003}
.c0{background:var(--tangerine)}.c1{background:var(--mustard)}.c2{background:var(--avocado)}.c3{background:var(--sky)}
.s0{--seat:var(--coral)}.s1{--seat:var(--mustard)}.s2{--seat:var(--avocado)}.s3{--seat:var(--sky)}.s4{--seat:var(--plum)}.s5{--seat:var(--tangerine)}
.screen.reveal .opt:not(.right){opacity:.35;transform:scale(.97)}
.screen.reveal .opt.right{box-shadow:inset 0 0 0 5px var(--ok),0 0 30px #9bbd2e88;animation:pop .5s}
@keyframes pop{40%{transform:scale(1.05)}}
.lamps{position:absolute;left:50px;right:50px;bottom:14px;display:flex;gap:10px;justify-content:center}
.lamp{width:18px;height:18px;border-radius:50%;background:#c9b48c;box-shadow:inset 0 2px 3px #0003;transition:background .2s,box-shadow .2s}
.lamp.on{background:#ffcf4a;box-shadow:0 0 10px #ffb21a,inset 0 -2px 2px #c77b00}
.lamp.on.hot{background:#ff6a3a;box-shadow:0 0 12px #ff4a1a}
.worth{position:absolute;right:40px;top:28px;font:400 15px var(--f-label);letter-spacing:2px;color:var(--plum);text-align:right}
.worth b{display:block;font:400 54px/1 var(--f-display);color:var(--tangerine);letter-spacing:0;font-variant-numeric:tabular-nums}

.card{align-items:center;justify-content:center;text-align:center;gap:14px;background:conic-gradient(from 0deg at 50% 60%,var(--cream) 0 10deg,var(--cream2) 10deg 20deg) }
.card .k{font:400 20px/1 var(--f-label);letter-spacing:6px;text-transform:uppercase;color:var(--plum)}
.card .big{font:400 96px/1.05 var(--f-display);color:var(--tangerine);text-shadow:4px 4px 0 var(--plum);text-wrap:balance}
.card .big.mid{font-size:74px}
.card p{font:500 30px/1.3 var(--f-body);max-width:860px;margin:0;text-wrap:balance}
.card .small{font:500 20px/1.4 var(--f-body);color:#5d4a36}

.board{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.board.tight{gap:6px;margin-top:6px}.board.tight .brow{grid-template-columns:44px 200px 1fr 120px}.board.tight .bar{height:26px}.board.tight .nm,.board.tight .sc{font-size:24px}
.brow{display:grid;grid-template-columns:44px 200px 1fr 120px;align-items:center;gap:16px}
.brow .pl{font:400 26px var(--f-display);color:var(--plum)}
.brow .nm{font:700 30px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bar{height:34px;border-radius:17px;background:var(--seat);box-shadow:inset 0 -5px 0 #0002;transition:width 1s ease-out;min-width:34px}
.brow .sc{font:400 26px var(--f-label);text-align:right;font-variant-numeric:tabular-nums}

.banner{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,110%);background:var(--plum);color:var(--cream);font:700 30px/1 var(--f-body);padding:16px 40px 20px;border-radius:30px 30px 0 0;white-space:nowrap;transition:transform .35s cubic-bezier(.3,1.4,.6,1)}
.banner.show{transform:translate(-50%,0)}

/* podiums */
.podiums{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:22px;padding:0 60px}
.pod{width:220px;height:196px;position:relative}
.pod .face{position:absolute;inset:34px 0 0;border-radius:12px 12px 4px 4px;background:linear-gradient(var(--wood2),var(--wood));box-shadow:inset 0 0 0 4px #0002,0 10px 20px #0008;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:6px}
.pod .lampbar{position:absolute;left:10px;right:10px;top:0;height:30px;border-radius:10px 10px 0 0;background:var(--seat);box-shadow:inset 0 -6px 0 #0003;transition:filter .2s}
.pod .name{width:186px;height:50px;border-radius:8px;background:#3c2a1c;color:#8c7860;display:grid;place-items:center;font:400 18px var(--f-label);text-transform:uppercase;letter-spacing:1px;transition:background .15s,color .15s,box-shadow .15s;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 8px}
.pod.here .name{background:#f8ecd0;color:var(--ink);box-shadow:0 0 18px #ffe6a855}
.pod.lit .name{background:#fffbe9;color:var(--ink);box-shadow:0 0 30px #ffe08a,0 0 0 3px #ffd36a}
.pod.ok .name{background:var(--ok);color:#16200a;box-shadow:0 0 30px #b5dd3a}
.pod.bad .name{background:var(--bad);color:#fff;box-shadow:0 0 20px #ff6a4a88}
.pod.empty{opacity:.45}
.pod .score{font:400 40px/1 var(--f-label);color:var(--cream);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #0006}
.pod .delta{position:absolute;left:0;right:0;top:-20px;text-align:center;font:400 40px var(--f-display);color:#fff;text-shadow:3px 3px 0 var(--plum);opacity:0;pointer-events:none}
.pod .delta.go{animation:rise 2.2s ease-out}
@keyframes rise{0%{opacity:0;transform:translateY(30px)}15%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.pod .x2{position:absolute;right:-8px;top:-14px;background:var(--mustard);color:var(--ink);font:400 26px/1 var(--f-display);padding:10px 12px;border-radius:50%;transform:rotate(12deg);box-shadow:0 4px 0 #0004}
.cracker{position:absolute;left:50%;top:-112px;width:250px;margin-left:-125px;transform-origin:50% 80%;filter:drop-shadow(0 6px 6px #0008)}
.qm .pod{cursor:pointer}

.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#0000000d 2px 4px),radial-gradient(ellipse at center,#0000 55%,#0006 100%)}
.paused{position:absolute;inset:0;display:grid;place-items:center;background:#0008;font:400 90px var(--f-display);color:var(--cream);text-shadow:4px 4px 0 var(--plum)}
#fx{position:absolute;inset:0;pointer-events:none}

/* ---------- host controls ---------- */
.hostbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.hb{border:0;border-radius:22px;padding:10px 18px;background:var(--teak2);font:400 12px var(--f-label);letter-spacing:1px;text-transform:uppercase;box-shadow:inset 0 0 0 1px #ffffff1c}
.hb.primary{background:var(--tangerine);color:var(--ink)}
.hb:disabled{opacity:.35;cursor:default}
.settings{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;background:var(--teak2);border-radius:14px;padding:12px 16px;font-size:14px}
.setting{display:flex;align-items:center;gap:8px}
.setting>span{font:400 11px var(--f-label);letter-spacing:1px;text-transform:uppercase;color:var(--cream2)}
.seg{display:flex;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff26}
.seg button{border:0;background:none;padding:7px 12px;font:500 14px var(--f-body)}
.seg button[aria-pressed="true"]{background:var(--mustard);color:var(--ink)}
.note{font-size:13px;color:#c7b08a;text-align:center;margin:0}

/* ---------- pads ---------- */
.padgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.padcell{display:flex;flex-direction:column;gap:6px;min-width:0}
.padcap{white-space:nowrap;display:flex;justify-content:space-between;align-items:center;font:400 10px var(--f-label);letter-spacing:1px;text-transform:uppercase;color:var(--cream2);gap:6px}
.padcap span{overflow:hidden;text-overflow:ellipsis}
.padcap button{border:0;border-radius:10px;padding:4px 8px;background:var(--teak2);font:400 10px var(--f-label);box-shadow:inset 0 0 0 1px #ffffff26}
.padcap button[aria-pressed="true"]{background:var(--sky);color:#fff}
.padfit{border-radius:16px}
.pad{width:360px;height:600px;background:var(--deep);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;font-family:var(--f-body);color:var(--cream);box-shadow:inset 0 0 0 3px #ffffff14}
.pad .top{background:var(--seat,var(--wood));color:var(--ink);padding:16px 20px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;box-shadow:inset 0 -5px 0 #0002}
.pad .top .n{font:400 16px var(--f-label);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .top .s{font:400 22px var(--f-label);font-variant-numeric:tabular-nums}
.pad .body{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px;min-height:0}
.pad .msg{margin:auto 0;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.pad .msg h2{margin:0;font:400 40px/1.05 var(--f-display);color:var(--mustard);text-wrap:balance}
.pad .msg p{margin:0;font:500 20px/1.3 var(--f-body);text-wrap:balance}
.pad .pq{font:600 17px/1.25 var(--f-body);color:var(--cream2);text-wrap:balance}
.pad .ab{flex:1;border:0;border-radius:22px;display:flex;align-items:center;gap:14px;padding:8px 16px 8px 10px;text-align:left;color:var(--ink);font:700 21px/1.1 var(--f-body);box-shadow:inset 0 -6px 0 #0003;transition:opacity .2s,transform .1s}
.pad .ab:active{transform:scale(.97)}
.pad .ab .let{flex:none;width:52px;height:52px;border-radius:50%;background:#fff8;display:grid;place-items:center;font:400 26px var(--f-display);color:var(--ink)}
.pad .ab[disabled]{cursor:default}
.pad.locked .ab:not(.mine){opacity:.25}
.pad.locked .ab.mine{box-shadow:0 0 0 4px var(--cream),0 0 24px #ffe7a0}
.pad .lockline{text-align:center;font:400 13px var(--f-label);letter-spacing:2px;text-transform:uppercase;color:var(--mustard);min-height:16px}
.pad .verdict{margin:auto 0;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.pad .verdict .mark{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font:400 90px/1 var(--f-display);color:#fff}
.pad .verdict .mark.ok{background:var(--ok)} .pad .verdict .mark.bad{background:var(--bad)} .pad .verdict .mark.none{background:#ffffff22}
.pad .verdict .pts{font:400 44px var(--f-display);color:var(--mustard)}
.pad .verdict p{margin:0;font:500 18px/1.3 var(--f-body)}
.pad .tgt{border:0;border-radius:18px;background:var(--seat);color:var(--ink);padding:14px 18px;display:flex;justify-content:space-between;font:700 22px var(--f-body);box-shadow:inset 0 -5px 0 #0003}
.pad .tgt span:last-child{font:400 16px var(--f-label);align-self:center}
.pad input{width:100%;box-sizing:border-box;border:0;border-radius:16px;padding:16px;font:600 24px var(--f-body);background:var(--cream);color:var(--ink);text-align:center}
.pad .go{border:0;border-radius:22px;padding:18px;background:var(--tangerine);color:var(--ink);font:400 30px var(--f-display);box-shadow:inset 0 -6px 0 #0003}
.pad.toddler{background:radial-gradient(circle at 50% 45%,var(--peacock),var(--deep))}
.bigred{margin:auto;width:270px;height:270px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ff9a7a,var(--coral) 45%,#9b2e20);box-shadow:0 14px 0 #5e1a12,0 20px 40px #0008;font:400 64px var(--f-display);color:#fff;text-shadow:3px 3px 0 #0004;transition:transform .08s,box-shadow .08s}
.bigred:active,.bigred.down{transform:translateY(10px);box-shadow:0 4px 0 #5e1a12,0 8px 20px #0008}
.wob{animation:wob .5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
/* ---------- lobby tutorial (attract loop on the studio screen) ---------- */
.pane.tut{padding:30px 46px 22px;cursor:pointer}
.tut .tslide{flex:1;display:grid;grid-template-columns:1fr 400px;gap:36px;align-items:center;min-height:0;animation:tIn .5s ease-out}
@keyframes tIn{from{opacity:0;transform:translateY(14px)}}
.tut .tk{font:400 16px/1 var(--f-label);letter-spacing:4px;text-transform:uppercase;color:var(--plum)}
.tut .tt{font:400 66px/1.04 var(--f-display);color:var(--tangerine);text-shadow:3px 3px 0 var(--plum);margin:14px 0 18px;text-wrap:balance}
.tut .tb{font:500 29px/1.3 var(--f-body);margin:0;text-wrap:pretty}
.tut .tb b{font-weight:800}
.tut .art{position:relative;width:400px;height:330px}
.tutfoot{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:12px;border-top:2px dashed #97406f40;font:600 21px var(--f-body)}
.tutfoot .hint{font:400 13px var(--f-label);letter-spacing:2px;text-transform:uppercase;color:#7a6650}
.tdots{display:flex;gap:9px}
.tdots i{width:14px;height:14px;border-radius:50%;background:#c9b48c}
.tdots i.on{background:var(--tangerine);box-shadow:0 0 0 3px #e8742a44}
.tcount b{font:400 30px var(--f-display);color:var(--plum);margin-right:6px}
/* mini podiums */
.mp{position:absolute;width:110px;height:120px}
.mp .lb{position:absolute;left:6px;right:6px;top:0;height:18px;border-radius:7px 7px 0 0;background:var(--seat)}
.mp .fc{position:absolute;inset:18px 0 0;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--wood2),var(--wood));display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px}
.mp .pl{width:90px;height:32px;border-radius:6px;background:#3c2a1c;color:#8c7860;display:grid;place-items:center;font:400 13px var(--f-label);text-transform:uppercase}
.mp .sc{font:400 22px var(--f-label);color:var(--cream)}
.mp.sm{width:58px;height:84px}.mp.sm .lb{height:12px;left:4px;right:4px}.mp.sm .fc{inset:12px 0 0;padding-top:10px}.mp.sm .pl{width:46px;height:22px;font-size:9px}
.mp .pl.on{animation:plateOn .35s forwards}
@keyframes plateOn{to{background:#fffbe9;color:var(--ink);box-shadow:0 0 18px #ffe08a,0 0 0 2px #ffd36a}}
/* mini phone */
.mph{position:absolute;left:100px;top:0;width:200px;height:326px;border-radius:28px;background:var(--deep);box-shadow:0 0 0 6px #241a14,0 12px 26px #0006;overflow:hidden}
.mph .bar{height:34px;background:var(--seat);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font:400 11px var(--f-label);color:var(--ink)}
.mph .mab{margin:10px 12px 0;height:52px;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--ink);font:700 17px var(--f-body);box-shadow:inset 0 -4px 0 #0003}
.mph .mab span{width:32px;height:32px;border-radius:50%;background:#fff8;display:grid;place-items:center;font:400 17px var(--f-display)}
.mph .ll{text-align:center;margin-top:12px;font:400 11px var(--f-label);letter-spacing:2px;color:var(--mustard);opacity:0}
.t-fade{animation:tFade .3s 2.1s forwards}@keyframes tFade{to{opacity:.25}}
.t-ring{animation:tRing .3s 2.1s forwards}@keyframes tRing{to{box-shadow:0 0 0 4px var(--cream),0 0 22px #ffe7a0}}
.t-show{animation:tShow .3s forwards}@keyframes tShow{to{opacity:1}}
.fing{position:absolute;left:182px;top:184px;width:46px;height:46px;border-radius:50%;background:#ffffffaa;box-shadow:0 0 0 3px #fff,0 6px 14px #0005;opacity:0;animation:tap 3s .3s forwards}
@keyframes tap{0%{opacity:0;transform:translate(160px,140px)}20%{opacity:1}55%{transform:translate(0,0) scale(1)}62%{transform:scale(.75)}72%{transform:scale(1)}100%{opacity:1;transform:none}}
/* ladder */
.lad{position:absolute;inset:14px 0 0;display:flex;flex-direction:column;gap:12px}
.lad div{display:grid;grid-template-columns:54px 1fr 64px;align-items:center;gap:12px;font:400 18px var(--f-label)}
.lad em{font:400 22px var(--f-display);color:var(--plum);font-style:normal}
.lad i{display:block;height:30px;border-radius:15px;background:var(--seat);box-shadow:inset 0 -4px 0 #0002;transform-origin:left;transform:scaleX(0);animation:grow .6s forwards}
@keyframes grow{to{transform:scaleX(1)}}
/* coins, cracker, bang */
.coin{position:absolute;left:276px;top:90px;padding:10px 16px;border-radius:24px;background:var(--mustard);color:var(--ink);font:400 26px var(--f-display);box-shadow:0 5px 0 #0004;opacity:0;animation:steal 2s 1.2s forwards}
@keyframes steal{0%{opacity:1;transform:none}50%{transform:translate(-115px,-80px) rotate(-10deg)}100%{opacity:1;transform:translate(-232px,0)}}
.dl{position:absolute;font:400 34px var(--f-display);text-shadow:2px 2px 0 #0003;opacity:0;animation:tShow .3s 3.3s forwards}
.tcrk{position:absolute;left:0;top:96px;width:130px;animation:hop 5s .4s forwards}
@keyframes hop{0%{transform:translate(0,0)}14%{transform:translate(62px,-60px) rotate(20deg)}26%,40%{transform:translate(125px,0)}54%{transform:translate(187px,-60px) rotate(-20deg)}66%,82%{transform:translate(250px,0)}86%{opacity:1}92%,100%{opacity:0;transform:translate(250px,0) scale(1.6)}}
.bang{position:absolute;left:100px;top:40px;font:400 84px var(--f-display);color:var(--coral);text-shadow:4px 4px 0 var(--plum);opacity:0;animation:bang .6s 4.6s forwards}
@keyframes bang{0%{opacity:0;transform:scale(.3) rotate(-12deg)}60%{opacity:1;transform:scale(1.2) rotate(6deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}
/* countdown */
.tworth{position:absolute;inset:10px 0 auto;text-align:center;font:400 16px var(--f-label);letter-spacing:3px;color:var(--plum)}
.tworth b{display:block;font:400 130px/1.05 var(--f-display);color:var(--tangerine);letter-spacing:0;font-variant-numeric:tabular-nums;text-shadow:4px 4px 0 var(--plum)}
.tlamps{position:absolute;left:30px;right:30px;bottom:40px;display:flex;justify-content:center;gap:8px}
.tpen{position:absolute;left:0;right:0;bottom:0;text-align:center;font:600 20px var(--f-body);color:var(--coral)}
/* toddler */
.tred{position:absolute;left:100px;top:40px;width:200px;height:200px;font-size:48px;animation:press 2.4s .6s infinite}
@keyframes press{0%,30%,100%{transform:none;box-shadow:0 14px 0 #5e1a12,0 20px 40px #0008}12%{transform:translateY(10px);box-shadow:0 4px 0 #5e1a12,0 8px 20px #0008}}
.tx2{position:absolute;right:62px;top:20px;background:var(--mustard);color:var(--ink);font:400 40px/1 var(--f-display);padding:16px 14px;border-radius:50%;box-shadow:0 5px 0 #0004;opacity:0;animation:bang .5s 1.1s forwards}
/* fair play */
.tbank{position:absolute;inset:20px 0 0;text-align:center}
.tbank b{display:block;font:400 150px/1 var(--f-label);color:var(--peacock);letter-spacing:-4px;font-variant-numeric:tabular-nums}
.tbank span{display:block;margin-top:12px;font:400 17px var(--f-label);letter-spacing:3px;text-transform:uppercase;color:var(--plum)}
.tseal{display:flex;justify-content:center;gap:12px;margin-top:28px}
.tseal i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:400 28px var(--f-display);color:#fff;font-style:normal;animation:wob .9s ease-in-out infinite}
.tseal i:nth-child(2){animation-delay:.15s}.tseal i:nth-child(3){animation-delay:.3s}.tseal i:nth-child(4){animation-delay:.45s}
.art{position:relative;width:400px;height:330px}
.pod .rdy{position:absolute;right:-8px;top:18px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#16200a;display:grid;place-items:center;font:400 28px/1 var(--f-display);box-shadow:0 4px 0 #0004;animation:pop .4s}
/* projector: how to join */
.pane.jn{padding:26px 40px 18px;cursor:pointer}
.jgrid{flex:1;display:grid;grid-template-columns:1fr 320px;gap:30px;min-height:0}
.jn .tk{font:400 16px/1 var(--f-label);letter-spacing:4px;text-transform:uppercase;color:var(--plum)}
.jt{font:400 52px/1.05 var(--f-display);color:var(--tangerine);text-shadow:3px 3px 0 var(--plum);margin:8px 0 14px}
.jrow{display:grid;grid-template-columns:1fr 200px;gap:20px;align-items:start}
.jsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.jsteps li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;opacity:.42;transition:opacity .3s}
.jsteps li.on{opacity:1}
.jsteps li>b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#c9b48c;color:#fff;font:400 20px var(--f-display)}
.jsteps li.on>b{background:var(--tangerine);box-shadow:0 0 0 4px #e8742a40}
.jsteps .st{font:700 23px/1.25 var(--f-body);padding-top:5px}
.jsteps strong{font-weight:800}
.jsteps .sd{display:none;font:500 19px/1.3 var(--f-body);margin-top:4px;color:#3c2f22}
.jsteps li.on .sd{display:block;animation:tIn .4s}
.jart{width:200px;height:300px}
.jart .mph{left:0;height:300px}
.jcard{align-self:center;background:#fff;border-radius:24px;padding:18px 18px 16px;text-align:center;box-shadow:0 0 0 5px var(--wood),0 10px 24px #0004}
.jcard img{display:block;width:250px;height:250px;margin:6px auto 8px;image-rendering:pixelated}
.jk{font:400 17px var(--f-label);letter-spacing:3px;text-transform:uppercase;color:var(--plum)}
.jproto{font:500 15px/1.3 var(--f-body);color:#7a6650;text-wrap:balance}
.jcard .jk+.jproto{max-width:250px;margin:14px auto 0}
.jhost{display:block;margin:22px auto;padding:16px 26px;border:0;border-radius:999px;background:var(--tangerine);color:#fff;font:400 15px var(--f-label);letter-spacing:1px;white-space:nowrap;text-transform:uppercase;box-shadow:0 4px 0 #9c4512}
.jhost+.jproto{max-width:250px;margin:0 auto}
.tcount .who{font:600 21px var(--f-body);margin-right:6px}
.tcount .nm{display:inline-block;margin:0 0 0 6px;padding:2px 10px;border-radius:12px;background:var(--seat);color:#fff;font:600 16px/1.4 var(--f-body)}
/* phone mock-ups for the join steps */
.jcam{background:#111}
.jcam .vf{position:relative;margin:34px 18px 0;height:180px;border-radius:14px;box-shadow:inset 0 0 0 3px #ffffff70;display:grid;place-items:center;overflow:hidden}
.jcam .vf img{width:118px;transform:perspective(300px) rotateX(12deg) rotate(-4deg)}
.jcam .scan{position:absolute;left:10px;right:10px;top:20px;height:3px;background:var(--tangerine);box-shadow:0 0 10px var(--tangerine);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:156px}}
.jcam .pill{margin:16px 16px 0;padding:10px;border-radius:16px;background:#ffffffe0;color:var(--ink);font:600 15px var(--f-body);text-align:center;opacity:0;animation:tShow .3s 2s forwards}
.jcam .pill.ok{background:var(--ok)}
.jcam .mini{width:100px;height:140px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #333}
.jcam .mini img{width:84px;transform:none}
.jrep{background:#fff;animation:lift 2.6s ease-in-out infinite alternate}
@keyframes lift{to{transform:translateY(-10px) rotate(-6deg)}}
.jrep .wh{display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 12px 0}
.jrep img{width:164px;image-rendering:pixelated}
.jrep span{font:700 15px var(--f-body);color:var(--ink)}
.jname .nmq{text-align:center;margin:44px 0 12px;font:500 16px var(--f-body);color:var(--cream)}
.jname .nmi{margin:0 16px;height:46px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font:600 22px var(--f-body);color:var(--ink)}
.jname .typ{display:inline-block;width:0;overflow:hidden;white-space:nowrap;border-right:2px solid var(--ink);animation:typ 1.2s steps(3) .5s forwards}
@keyframes typ{to{width:3ch}}
.jname .nmb{margin:14px 16px 0;padding:13px;border-radius:16px;background:var(--tangerine);color:var(--ink);text-align:center;font:400 18px var(--f-display);box-shadow:inset 0 -4px 0 #0003;animation:press 1.4s 2.1s 2}
/* phone: game tutorial */
.pad .tk2{font:400 11px var(--f-label);letter-spacing:2px;text-transform:uppercase;color:var(--cream2)}
.pad .pcard{flex:none;position:relative;height:232px;border-radius:18px;background:var(--cream);color:var(--ink);overflow:hidden}
.pad .pcard .art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.68)}
.pad .pt{font:400 28px/1.05 var(--f-display);color:var(--mustard);text-wrap:balance}
.pad .pb{margin:0;flex:1;font:500 17px/1.32 var(--f-body);text-wrap:pretty}
.pad .pb b{color:#fff}
.pad .tnavs{display:flex;gap:10px}
.pad .tnav{flex:1;border:0;border-radius:20px;padding:14px;background:var(--tangerine);color:var(--ink);font:400 22px var(--f-display);box-shadow:inset 0 -5px 0 #0003}
.pad .tnavs .tnav.ghost{flex:.6}
.pad .tnav.ghost{flex:none;background:none;color:var(--cream);box-shadow:inset 0 0 0 2px #ffffff40;font:600 17px var(--f-body)}
/* ---------- new rounds, toddler attacks, modes ---------- */
.pad{position:relative}
.setting.wide{flex-basis:100%;justify-content:center;flex-wrap:wrap}
.lineup{font:600 14px var(--f-body);color:var(--cream)}
/* podium extras */
.pod .hearts{position:absolute;left:0;right:0;top:-40px;display:flex;justify-content:center;gap:6px;font:400 34px/1 var(--f-display);color:var(--coral);text-shadow:0 3px 0 #0006}
.pod .hearts i{font-style:normal;transition:color .3s,transform .3s}
.pod .hearts i.gone{color:#ffffff28;text-shadow:none;transform:scale(.8)}
.pod .bettag{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--mustard);color:var(--ink);font:400 20px var(--f-label);padding:6px 16px;border-radius:18px;white-space:nowrap;box-shadow:0 4px 0 #0004}
.pod.out{filter:grayscale(1) brightness(.55)}
.pod.out .name{text-decoration:line-through}
.pod.away{opacity:.55}
.pod .awaytag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:400 14px var(--f-label);letter-spacing:2px;color:var(--mustard);text-transform:uppercase}
.pod.spin{animation:podspin .9s ease-in-out}
@keyframes podspin{50%{transform:rotate(14deg) scale(1.05)}75%{transform:rotate(-10deg)}}
.pod .splatfx{position:absolute;left:4px;right:4px;top:30px;height:96px;pointer-events:none;
  background:radial-gradient(circle at 50% 48%,#fff6d8 0 34px,#0000 35px),radial-gradient(circle at 26% 40%,#f3dfa6 0 26px,#0000 27px),radial-gradient(circle at 76% 34%,#f3dfa6 0 22px,#0000 23px),radial-gradient(circle at 70% 76%,#f3dfa6 0 18px,#0000 19px),radial-gradient(circle at 18% 78%,#f3dfa6 0 12px,#0000 13px),radial-gradient(circle at 50% 50%,#e9c77d 0 46px,#0000 47px);
  filter:drop-shadow(0 4px 0 #b98a3e);animation:splatIn .25s ease-out}
@keyframes splatIn{from{transform:scale(.2);opacity:0}}
.pod .icefx{position:absolute;inset:34px 0 0;border-radius:12px 12px 4px 4px;pointer-events:none;background:linear-gradient(160deg,#e6f8ffd9,#9fd6f0b3);box-shadow:inset 0 0 0 3px #fff,0 0 30px #9fd6f0;animation:splatIn .3s}
.proj{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none;z-index:6}
.proj.pie{border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff6d8 0 38%,#e9c77d 40% 60%,#b98a3e 62%);box-shadow:0 8px 16px #0006}
.proj.freeze,.proj.scramble{display:grid;place-items:center;font:400 86px/1 var(--f-display);color:#d7f2ff;text-shadow:0 0 18px #fff,0 0 30px #9fd6f0}
.proj.scramble{color:var(--mustard);text-shadow:4px 4px 0 var(--plum)}
/* line-up, bets, survivors */
.lineup-list{display:flex;flex-direction:column;gap:12px;margin-top:6px;align-items:flex-start;min-width:520px}
.lineup-list div{display:flex;align-items:center;gap:20px;font:700 34px/1.1 var(--f-body);opacity:0;animation:tShow .4s forwards}
.lineup-list em{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--plum);color:#fff;font:400 26px var(--f-display);font-style:normal}
.lineup-list .fin{color:var(--tangerine)}
.lineup-list .fin em{background:var(--tangerine)}
.betters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:900px}
.betters .chip{height:auto;font:600 20px/1.6 var(--f-body);padding:2px 14px;border-radius:16px}
.pane.card .lamps{bottom:16px}
/* the race */
.pane.race{padding:26px 44px 26px}
.track{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;margin-top:8px}
.lane{display:grid;grid-template-columns:124px 1fr;align-items:center;height:56px}
.lane .ln{font:700 24px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.lane .turf{position:relative;height:100%;background:repeating-linear-gradient(90deg,#6f9a3a 0 64px,#7aa644 64px 128px);border-block:3px solid #fff;box-shadow:inset 6px 0 0 var(--seat)}
.lane .turf::after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(#111 0 9px,#fff 9px 18px)}
.horse{position:absolute;bottom:0;left:calc(var(--f) * (100% - 108px));width:92px;height:62px;transition:left 2.2s cubic-bezier(.45,.05,.35,1)}
.horse svg{width:100%;height:100%;overflow:visible}
.horse.run svg,.mh svg{animation:gallop .26s ease-in-out infinite alternate}
@keyframes gallop{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-6px) rotate(3deg)}}
.horse.run .lg.a,.mh .lg.a{animation:legA .26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}
.horse.run .lg.b,.mh .lg.b{animation:legB .26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}
@keyframes legA{from{transform:rotate(28deg)}to{transform:rotate(-24deg)}}
@keyframes legB{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
.lane .plc{position:absolute;right:28px;top:50%;transform:translateY(-50%);font:400 32px var(--f-display);color:#fff;text-shadow:3px 3px 0 var(--plum);animation:pop .4s}
.prizes{display:flex;justify-content:center;gap:28px;margin-top:10px;font:600 22px var(--f-body)}
.prizes b{font:400 24px var(--f-display);color:var(--plum);margin-right:8px}
/* tutorial art for the new rounds */
.wcat{position:absolute;left:60px;right:60px;top:6px;padding:14px;border-radius:18px;background:var(--peacock);color:var(--cream);text-align:center;font:400 13px var(--f-label);letter-spacing:3px;text-transform:uppercase}
.wcat b{display:block;font:400 46px/1.1 var(--f-display);letter-spacing:0;text-transform:none;color:var(--mustard)}
.chips{position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;gap:18px}
.chips i{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--mustard);color:var(--ink);font:400 26px var(--f-display);font-style:normal;box-shadow:inset 0 0 0 7px #fff6,0 6px 0 #0004}
.chips i.up{animation:chipUp .5s 1.2s forwards}
@keyframes chipUp{to{transform:translateY(-18px);background:var(--tangerine);color:#fff}}
.wout{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:26px;font:400 28px var(--f-display);opacity:0;animation:tShow .4s 2.4s forwards}
.wout .g{color:var(--ok)}.wout .r{color:var(--coral)}
.hrt{position:absolute;left:0;right:0;top:50px;display:flex;justify-content:center;gap:18px}
.hrt i{font:400 116px/1 var(--f-display);font-style:normal;color:var(--coral);text-shadow:4px 4px 0 var(--plum)}
.hrt i.brk{animation:brk .6s 1.8s forwards}
@keyframes brk{to{color:#c9b48c;text-shadow:none;transform:scale(.75) rotate(-14deg)}}
.hcap{position:absolute;left:0;right:0;bottom:20px;text-align:center;font:400 16px var(--f-label);letter-spacing:2px;text-transform:uppercase;color:var(--plum)}
.mtrack{position:absolute;inset:30px 0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.ml{position:relative;height:72px;background:repeating-linear-gradient(90deg,#6f9a3a 0 40px,#7aa644 40px 80px);border-block:3px solid #fff}
.ml::after{content:"";position:absolute;right:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(#111 0 8px,#fff 8px 16px)}
.mh{position:absolute;left:4px;bottom:2px;width:86px;height:60px;animation:mrun 3.2s cubic-bezier(.45,.05,.35,1) forwards}
@keyframes mrun{to{transform:translateX(var(--d))}}
.tpie{position:absolute;left:330px;top:300px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff6d8 0 38%,#e9c77d 40% 60%,#b98a3e 62%);opacity:0;animation:tpie .9s .5s ease-in forwards}
@keyframes tpie{0%{opacity:1;transform:none}50%{transform:translate(-80px,-240px) rotate(160deg)}99%{opacity:1}100%{opacity:0;transform:translate(-130px,-130px) rotate(320deg)}}
.tsplat{position:absolute;left:150px;top:176px;width:100px;height:80px;opacity:0;background:radial-gradient(circle at 50% 48%,#fff6d8 0 28px,#0000 29px),radial-gradient(circle at 25% 40%,#f3dfa6 0 20px,#0000 21px),radial-gradient(circle at 78% 36%,#f3dfa6 0 18px,#0000 19px),radial-gradient(circle at 50% 50%,#e9c77d 0 38px,#0000 39px);animation:tShow .2s 1.4s forwards}
/* pad: bets, hearts, overlays */
.pad .top .hp{display:flex;gap:2px;font:400 18px/1 var(--f-display);color:var(--ink)}
.pad .top .hp i{font-style:normal}.pad .top .hp i.gone{opacity:.25}
.pad .cat2{font:400 12px var(--f-label);letter-spacing:2px;text-transform:uppercase;color:var(--cream2);text-align:center}
.pad .catn{font:400 40px/1.05 var(--f-display);color:var(--mustard);text-align:center;text-wrap:balance;margin-bottom:6px}
.pad .betb{flex:1;border:0;border-radius:22px;background:var(--mustard);color:var(--ink);font:400 30px var(--f-display);box-shadow:inset 0 -6px 0 #0003}
.pad .betb:active{transform:scale(.97)}
.pad .ovl{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;border-radius:30px}
.pad .ovl.splat{background:radial-gradient(circle at 42% 44%,#fff6d8 0 92px,#0000 94px),radial-gradient(circle at 66% 60%,#f3dfa6 0 72px,#0000 74px),radial-gradient(circle at 28% 70%,#f3dfa6 0 44px,#0000 46px),radial-gradient(circle at 72% 28%,#f3dfa6 0 38px,#0000 40px),radial-gradient(circle at 50% 52%,#e9c77d 0 130px,#0000 132px);animation:splatPad 2.6s forwards}
@keyframes splatPad{0%{transform:scale(.3);opacity:0}10%{transform:scale(1.04);opacity:1}75%{opacity:1}100%{opacity:0}}
.pad .ovl.ice{pointer-events:auto;background:linear-gradient(160deg,#e6f8ffee,#a8dcf2dd);color:#164a63;box-shadow:inset 0 0 0 4px #fff}
.pad .ovl.ice b{font:400 56px var(--f-display)}
.pad .ovl.ice span{font:600 18px var(--f-body)}
/* toddler phone */
.pad.toddler .body{position:relative;justify-content:center}
.pad.toddler .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;justify-items:center;align-content:center}
.pad.toddler .tgrid.n1,.pad.toddler .tgrid.n2{grid-template-columns:1fr}
.tgt2{width:142px;height:142px;border-radius:50%;border:0;background:radial-gradient(circle at 36% 30%,#ffffff70 0 16%,#0000 38%),var(--seat);box-shadow:0 10px 0 #0005;font:400 70px/1 var(--f-display);color:#fff;text-shadow:3px 3px 0 #0004;transition:transform .08s,box-shadow .08s,opacity .3s}
.tgt2:active,.tgt2.hit{transform:translateY(8px) scale(.96);box-shadow:0 2px 0 #0005}
.pad.toddler.sleep .tgt2{opacity:.25;filter:grayscale(.7)}
.pad.toddler .rech{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:400 12px var(--f-label);letter-spacing:3px;text-transform:uppercase;color:var(--cream2)}
.pad.toddler .ring{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;transform:rotate(-90deg)}
.pad.toddler .ring circle{fill:none;stroke-width:12}
.pad.toddler .ring .rbg{stroke:#ffffff1c}
.pad.toddler .ring .rfg{stroke:var(--mustard);stroke-linecap:round;transition:stroke-dashoffset var(--rd,0ms) linear!important}
.pad.toddler .zz{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:400 40px var(--f-display);color:var(--cream);opacity:.8;animation:wob 2s ease-in-out infinite}
/* solo phone pages (#pad, #toddler) */
body.solo{background:var(--teak)}
.solocell{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:12px}
.solocell .padfit{border-radius:22px}
/* ---------- LAN joining ---------- */
.jcard.live{padding:14px 16px 12px}
.jcard.live img{width:236px;height:236px;margin:4px auto 8px;transition:opacity .3s}
.camrow{display:flex;align-items:center;gap:10px;text-align:left}
.camslot{flex:none;width:96px;height:72px;border-radius:10px;overflow:hidden;background:#1d1411;box-shadow:inset 0 0 0 2px var(--wood)}
.campv{width:100%;height:100%;object-fit:cover}
.campv.front{transform:scaleX(-1)}
.camrow .jproto{font-size:14px;text-align:left}
.joinov{position:absolute;right:24px;top:16px;z-index:7}

<script>
"use strict";
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LETTERS='ABCD';
const ORD=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)]||'th');

/* ============ question bank (lightly scrambled so the answers aren't readable in the source) ============ */
const BANK_DATA="__BANK__";
const CATS={hist:'History',geo:'Geography',tv:'TV & Radio',film:'Film',music:'Pop Music',sport:'Sport',food:'Food & Drink',words:'Books & Words',sci:'Science & Nature',xmas:'Christmas & Miscellany'};
const Bank={all:[],used:new Set(store.get('qb.used',[])),lastCat:null};
(function decode(){
  const key='quizbuzz',bin=atob(BANK_DATA),b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i)^key.charCodeAt(i%key.length);
  Bank.all=JSON.parse(new TextDecoder().decode(b));
})();
function unseenCount(){return Bank.all.filter(q=>!Bank.used.has(q.id)).length}
function drawQuestion(diffs){
  let pool=Bank.all.filter(q=>!Bank.used.has(q.id));
  if(pool.length<12){Bank.used.clear();pool=Bank.all.slice()}
  let p=pool.filter(q=>diffs.includes(q.d)&&q.c!==Bank.lastCat);
  if(!p.length)p=pool.filter(q=>q.c!==Bank.lastCat);
  if(!p.length)p=pool;
  const q=pick(p);Bank.used.add(q.id);store.set('qb.used',[...Bank.used]);Bank.lastCat=q.c;
  const order=shuffle([0,1,2,3]);
  return {id:q.id,c:q.c,d:q.d,text:q.q,opts:order.map(i=>q.a[i]),k:order.indexOf(q.k)};
}

/* ============ sound (synthesised, starts on first tap) ============ */
const SFX={ctx:null,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  ok(){return this.ctx&&H.settings.sound},
  tone(f,d,type='sine',v=.18,at=0,f2=null){if(!this.ok())return;const c=this.ctx,t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)},
  noise(d,v=.3,at=0,cut=1200){if(!this.ok())return;const c=this.ctx,t=c.currentTime+at,n=c.sampleRate*d,buf=c.createBuffer(1,n,c.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n)**2;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=cut;g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(t)},
  lock(seat){this.tone(392+seat*70,.12,'square',.08)},
  right(){this.tone(784,.14,'sine',.2);this.tone(1175,.35,'sine',.2,.12)},
  wrong(){this.tone(150,.5,'sawtooth',.12,0,105)},
  tick(){this.tone(1500,.03,'square',.04)},
  fanfare(){[523,659,784,1047].forEach((f,i)=>this.tone(f,i==3?.5:.16,'triangle',.18,i*.13))},
  whistle(){this.tone(380,.7,'sine',.2,0,1700)},
  bang(){this.noise(.9,.7,0,900);this.tone(70,.5,'sine',.5,0,35)},
  pass(){this.tone(900,.22,'triangle',.15,0,320)},
  steal(){[880,740,622,523].forEach((f,i)=>this.tone(f,.12,'square',.07,i*.07))},
  splat(){this.noise(.35,.6,0,500);this.tone(220,.25,'sine',.3,0,70)},
  freeze(){[1568,1760,2093,2637].forEach((f,i)=>this.tone(f,.3,'sine',.09,i*.06))},
  scramble(){this.tone(300,.6,'triangle',.15,0,900);this.tone(900,.6,'triangle',.1,.1,300)},
  gallop(){for(let i=0;i<8;i++)this.noise(.06,.3,i*.13,i%2?700:400)},
  win(){[523,659,784,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.18,i*.16))}
};
document.addEventListener('pointerdown',()=>SFX.init());

/* ============ virtual clock (pausable) ============ */
const SPEED=Math.max(1,+(new URLSearchParams(location.search).get('speed'))||1); // test hook: ?speed=8
const Clock={v:0,last:performance.now(),paused:false,ev:[]};
function after(ms,fn){const e={at:Clock.v+ms,fn};Clock.ev.push(e);return e}
setInterval(()=>{const n=performance.now(),dt=Math.min(n-Clock.last,250);Clock.last=n;if(Clock.paused)return;Clock.v+=dt*SPEED;
  const due=Clock.ev.filter(e=>e.at<=Clock.v);if(!due.length)return;Clock.ev=Clock.ev.filter(e=>e.at>Clock.v);
  due.sort((a,b)=>a.at-b.at).forEach(e=>{if(!e.dead)try{e.fn()}catch(err){console.error(err)}})},25);

/* ============ transports ============
   studio  : everything on one page; in-page pads talk through a loopback
   host    : projector page; buzzers are other windows on the same device (BroadcastChannel)
   pad     : one buzzer, full screen (BroadcastChannel now; WebRTC/QR later, same messages)
   toddler : the toddler's phone
   Messages up:   {t:'hello'|'join'|'ans'|'bet'|'choose'|'ready'|'chaos'|'ping', ...}
   Messages down: a complete view of that player's screen (see padView), so a rejoin just resends it. */
const HASH=location.hash.slice(1),JOIN_CODE=/^(j=)?QB\d/i.test(HASH)?HASH:null;
const MODE=JOIN_CODE?'pad':['host','pad','toddler'].includes(HASH)?HASH:'studio';
addEventListener('hashchange',()=>{if(/^#(j=)?QB\d/i.test(location.hash))location.reload()}); // a fresh scan in the same tab
function makeLoopback(onHostMsg){
  const guests=new Map(),LAT=()=>rnd(5,25);
  return {
    connect(pid,onGuestMsg){guests.set(pid,onGuestMsg);return {send:m=>setTimeout(()=>onHostMsg(pid,JSON.parse(JSON.stringify(m))),LAT())}},
    send(pid,m){const g=guests.get(pid);if(g){const c=JSON.stringify(m);setTimeout(()=>g(JSON.parse(c)),LAT())}},
    seen(){return Date.now()}
  };
}
const CHANNEL='quizbuzz-1';
function makeChannelHost(onHostMsg){
  const bc=new BroadcastChannel(CHANNEL),last=new Map();
  bc.onmessage=e=>{const d=e.data;if(!d||d.to!=='host'||!d.from)return;last.set(d.from,Date.now());if(d.m&&d.m.t!=='ping')onHostMsg(d.from,d.m)};
  return {send(pid,m){bc.postMessage({to:pid,m})},seen(pid){return last.get(pid)||0}};
}
function makeChannelGuest(pid,onMsg){
  const bc=new BroadcastChannel(CHANNEL);
  bc.onmessage=e=>{const d=e.data;if(d&&d.to===pid)onMsg(d.m)};
  const send=m=>bc.postMessage({to:'host',from:pid,m});
  setInterval(()=>send({t:'ping'}),2000);
  setTimeout(()=>send({t:'hello'}),50);
  return {send};
}

/* ============ LAN transport: WebRTC with QR signalling (adapted from Bowling Bear) ============
   One invite at a time. The projector shows a QR of the game URL with the host's offer in the fragment (#QB2O…*, see packSDP).
   A phone opens it, makes an answer and shows it as a QR; the iPad's front camera reads it; the data channel opens.
   As soon as one phone connects, a fresh invite replaces the code on screen.
   The phone then says hello with its persistent id, so a reconnecting phone gets its own podium back. */
const RTC_OK=typeof RTCPeerConnection!=='undefined'&&window.isSecureContext;
const B41='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ+-./:',SETUPS=['actpass','active','passive'];
const ICE64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const b41=bytes=>{let s='';for(let i=0;i<bytes.length;i+=2){
  if(i+1<bytes.length){const n=bytes[i]*256+bytes[i+1];s+=B41[n%41]+B41[(n/41|0)%41]+B41[n/1681|0];}
  else s+=B41[bytes[i]%41]+B41[bytes[i]/41|0];}return s;};
const unb41=s=>{const o=[],v=[...s].map(c=>{const k=B41.indexOf(c);if(k<0)throw 0;return k;});
  for(let i=0;i<v.length;i+=3){
    if(i+2<v.length){const n=v[i]+v[i+1]*41+v[i+2]*1681;if(n>65535)throw 0;o.push(n>>8,n&255);}
    else if(i+1<v.length){const n=v[i]+v[i+1]*41;if(n>255)throw 0;o.push(n);}else throw 0;}
  return new Uint8Array(o);};
const ice6=s=>{const o=[s.length];let acc=0,bits=0;for(const ch of s){const k=ICE64.indexOf(ch);if(k<0)throw new Error('Unexpected connection details (ice).');
  acc=acc<<6|k;bits+=6;if(bits>=8){bits-=8;o.push(acc>>bits&255);}}if(bits)o.push(acc<<(8-bits)&255);return o;};
function ip6Bytes(a){const[h,t]=a.split('::'),w=s=>s?s.split(':'):[],hw=w(h),tw=t===undefined?[]:w(t);
  const all=[...hw,...Array(8-hw.length-tw.length).fill('0'),...tw],o=[];for(const x of all){const n=parseInt(x,16);o.push(n>>8,n&255);}return o;}
const ip6Text=b=>Array.from({length:8},(_,i)=>(b[2*i]*256+b[2*i+1]).toString(16)).join(':');
const UUID_LOCAL=/^([0-9a-f]{8})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{12})\.local$/i;
async function packSDP(kind,sdp){ // kind 'O' offer, 'A' answer
  const get=k=>{const m=new RegExp('^a='+k+':(.*)$','m').exec(sdp);if(!m)throw new Error('Unexpected connection details ('+k+').');return m[1].trim();};
  const fp=get('fingerprint').split(' ');if(fp[0].toLowerCase()!=='sha-256')throw new Error('Unexpected connection details (fingerprint).');
  const cands=[];
  for(const m of sdp.matchAll(/^a=candidate:\S+ 1 udp \d+ (\S+) (\d+) typ host/gim)){
    const[,addr,port]=m;let c;
    if(/^\d+\.\d+\.\d+\.\d+$/.test(addr))c=[4,...addr.split('.').map(Number)];
    else if(UUID_LOCAL.test(addr))c=[16,...addr.slice(0,36).replace(/-/g,'').match(/../g).map(h=>parseInt(h,16))];
    else if(addr.includes(':'))c=[6,...ip6Bytes(addr)];
    else continue;
    c.push(+port>>8,+port&255);if(!cands.some(x=>x.join()===c.join()))cands.push(c);
  }
  // plain addresses first, then mDNS names; IPv6 only when there is nothing else (it makes the code bigger and rarely helps on home Wi-Fi)
  let use=[...cands.filter(c=>c[0]===4),...cands.filter(c=>c[0]===16)];if(!use.length)use=cands;use=use.slice(0,3);
  const mid=get('mid'),str=s=>[s.length,...[...s].map(ch=>ch.charCodeAt(0))];
  const bytes=[SETUPS.indexOf(get('setup'))|(mid==='0'?0:4),...(mid==='0'?[]:str(mid)),...ice6(get('ice-ufrag')),...ice6(get('ice-pwd')),
    ...fp[1].split(':').map(h=>parseInt(h,16)),use.length,...use.flat()];
  return 'QB2'+kind+b41(new Uint8Array(bytes))+'*';
}
const codeOf=text=>(text||'').trim().replace(/^.*#/,'').toUpperCase();
async function unpackSDP(code){
  code=codeOf(code);
  if(/^(J=)?QB1/.test(code))throw new Error('That code is from an older Quizbuzz. Reload the page on the big screen.');
  const m=/^QB2([OA])(.*)\*$/.exec(code),bad=()=>new Error('That isn’t a Quizbuzz code.');
  if(!m)throw bad();
  let b;try{b=unb41(m[2]);}catch(e){throw bad();}
  let i=0;const str=()=>{const n=b[i++];return String.fromCharCode(...b.slice(i,i+=n));};
  const ice=()=>{const n=b[i++];let s='',acc=0,bits=0;while(s.length<n){if(bits<6){acc=(acc<<8|b[i++])&0xffff;bits+=8;}bits-=6;s+=ICE64[acc>>bits&63];}return s;};
  const f=b[i++],setup=SETUPS[f&3],mid=f&4?str():'0',ufrag=ice(),pwd=ice();
  const hex=Array.from(b.slice(i,i+=32),x=>x.toString(16).padStart(2,'0').toUpperCase()).join(':');
  const L=['v=0','o=- '+Math.floor(Math.random()*1e15)+' 2 IN IP4 127.0.0.1','s=-','t=0 0','a=group:BUNDLE '+mid,'a=msid-semantic: WMS',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel','c=IN IP4 0.0.0.0'];
  for(let n=b[i++],k=0;k<n;k++){
    const t=b[i++],a=b.slice(i,i+=t===4?4:16);let addr;
    if(t===4)addr=a.join('.');
    else if(t===6)addr=ip6Text(a);
    else{const h=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');addr=[h.slice(0,8),h.slice(8,12),h.slice(12,16),h.slice(16,20),h.slice(20)].join('-')+'.local';}
    const port=b[i]*256+b[i+1];i+=2;
    L.push('a=candidate:'+(k+1)+' 1 udp '+(2122260223-k)+' '+addr+' '+port+' typ host generation 0');
  }
  if(!setup||i!==b.length||hex.length!==95)throw bad();
  L.push('a=end-of-candidates','a=ice-ufrag:'+ufrag,'a=ice-pwd:'+pwd,'a=fingerprint:sha-256 '+hex,'a=setup:'+setup,'a=mid:'+mid,'a=sctp-port:5000','a=max-message-size:262144');
  return{kind:m[1],sdp:L.join('\r\n')+'\r\n'};
}
function waitIce(pc){return new Promise(res=>{
  if(pc.iceGatheringState==='complete')return res();
  const t=setTimeout(res,3000);
  pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res()}});
})}
function qrDataURL(text,px=560){ // a link: its address as bytes, the code after # in alphanumeric mode
  const q=qrcode(0,'L'),k=text.lastIndexOf('#');
  if(k>=0)q.addData(text.slice(0,k+1),'Byte');q.addData(text.slice(k+1),'Alphanumeric');q.make();
  const n=q.getModuleCount(),quiet=3,s=Math.max(2,Math.floor(px/(n+quiet*2))),c=document.createElement('canvas');
  c.width=c.height=(n+quiet*2)*s;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect((k+quiet)*s,(r+quiet)*s,s,s);
  return c.toDataURL();
}
async function primeCamera(){ // Safari only offers LAN ICE candidates after camera permission
  try{const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop())}catch(e){}
}
const RTC_FAIL='Couldn’t connect. The phone and the iPad must be on the same Wi-Fi, and some guest networks block devices from talking to each other.';

/* ---- spare lines ----
   A dropped connection can't be revived from storage: every WebRTC link needs both sides to swap fresh keys and addresses.
   So while a phone is connected, the host sets up a spare link with it over the live one, but keeps its own addresses back,
   so the spare sits idle. If the live link dies (phone locked, a quick switch to another app), the phone feeds in the host's
   addresses, the host learns the phone's address from its first check, and the spare opens without anyone scanning anything. */
const noCands=sdp=>sdp.split(/\r?\n/).filter(l=>l&&!/^a=(candidate|end-of-candidates)/.test(l)).join('\r\n')+'\r\n';

/* ---- host side ---- */
function makeRtcHost(onHostMsg){
  const peers=new Map(),spares=new Map(),last=new Map(),api={pending:null,joinURL:'',status:'',onChange:()=>{}};
  let n=0,lastCode='';
  function wire(e){
    e.dc.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(err){return}
      if(!e.pid){if(m.t!=='hello')return;e.pid=String(m.pid||('r'+e.n)).slice(0,24)}
      if(m.t==='hello'){const old=peers.get(e.pid);if(old&&old!==e){try{old.pc.close()}catch(x){}}peers.set(e.pid,e);if(spares.get(e.pid)===e)spares.delete(e.pid);spare(e)}
      last.set(e.pid,Date.now());
      if(m.t==='ping'){try{e.dc.send('{"s":"pong"}')}catch(err){}return}
      if(m.t==='spare'){const s=spares.get(e.pid);if(s&&s.n===m.n)s.pc.setRemoteDescription({type:'answer',sdp:m.sdp}).catch(()=>{});return}
      onHostMsg(e.pid,m)};
    e.dc.onclose=()=>{if(e.pid&&peers.get(e.pid)===e)peers.delete(e.pid)};
  }
  async function spare(via){
    const pid=via.pid,old=spares.get(pid);if(old){try{old.pc.close()}catch(x){}}
    const pc=new RTCPeerConnection({iceServers:[]}),dc=pc.createDataChannel('buzzers',{ordered:true});
    const e={pc,dc,pid,n:++n};spares.set(pid,e);wire(e);
    await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);
    if(spares.get(pid)!==e||via.dc.readyState!=='open')return;
    try{via.dc.send(JSON.stringify({s:'spare',n:e.n,sdp:pc.localDescription.sdp}))}catch(err){}
  }
  async function invite(){
    if(api.pending){try{api.pending.pc.close()}catch(e){}}
    const pc=new RTCPeerConnection({iceServers:[]}),dc=pc.createDataChannel('buzzers',{ordered:true});
    const e={pc,dc,pid:null,n:++n};api.pending=e;api.joinURL='';api.status='';api.onChange();wire(e);
    dc.addEventListener('open',()=>{if(api.pending===e){api.pending=null;invite()}});
    pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'&&api.pending===e){api.status=RTC_FAIL;invite()}};
    await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);
    if(api.pending!==e)return;
    const code=await packSDP('O',pc.localDescription.sdp);
    api.joinURL=location.origin+location.pathname+'#'+code;api.onChange();
  }
  api.start=async()=>{await primeCamera();invite()};
  api.acceptReply=async code=>{
    if(code===lastCode)return;lastCode=code;
    const e=api.pending;if(!e)return;
    try{const {kind,sdp}=await unpackSDP(code);if(kind!=='A')return;await e.pc.setRemoteDescription({type:'answer',sdp});api.status='Connecting…';api.onChange()}
    catch(err){api.status=err.message;api.onChange();invite()}
  };
  api.has=pid=>{const e=peers.get(pid);return !!e&&e.dc.readyState==='open'};
  api.send=(pid,m)=>{const e=peers.get(pid);if(e&&e.dc.readyState==='open')try{e.dc.send(JSON.stringify(m))}catch(err){}};
  api.seen=pid=>last.get(pid)||0;
  return api;
}
/* the host's camera (front or back) reads reply codes held up to the iPad */
function startReplyCamera(video,onCode,facing){
  let alive=true,stream=null,det=null;
  (async()=>{
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false})}catch(e){onCode(null,'The camera isn’t available. Allow camera access for this page.');return}
    video.srcObject=stream;video.muted=true;video.playsInline=true;try{await video.play()}catch(e){}
    try{if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}catch(e){}
    const cv=document.createElement('canvas'),g=cv.getContext('2d',{willReadFrequently:true});
    const tick=async()=>{
      if(!alive)return;
      if(video.readyState>=2){let txt=null;
        try{if(det){const r=await det.detect(video);if(r[0])txt=r[0].rawValue}
          else{const w=Math.min(640,video.videoWidth),h=Math.round(video.videoHeight*w/video.videoWidth);cv.width=w;cv.height=h;g.drawImage(video,0,0,w,h);const r=jsQR(g.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r)txt=r.data}}catch(e){}
        if(txt&&codeOf(txt).startsWith('QB2A'))onCode(txt)}
      setTimeout(tick,200);
    };tick();
  })();
  return ()=>{alive=false;if(stream)stream.getTracks().forEach(t=>t.stop());video.srcObject=null};
}
/* host transport: buzzers in other windows (BroadcastChannel) and phones on the LAN (WebRTC) together */
function makeMultiHost(onHostMsg){
  const ch=makeChannelHost(onHostMsg),rtc=RTC_OK?makeRtcHost(onHostMsg):null;
  return {rtc,send(pid,m){if(rtc&&rtc.has(pid))rtc.send(pid,m);else ch.send(pid,m)},seen(pid){return Math.max(ch.seen(pid),rtc?rtc.seen(pid):0)}};
}

/* ---- guest side ---- */
/* keep the phone's screen on while it's a buzzer, so it doesn't lock mid-question */
function keepAwake(){
  if(!('wakeLock' in navigator))return;
  let lock=null;
  const ask=()=>{if(lock||document.visibilityState!=='visible')return;navigator.wakeLock.request('screen').then(l=>{lock=l;l.addEventListener('release',()=>{lock=null})}).catch(()=>{})};
  document.addEventListener('visibilitychange',ask);addEventListener('pointerdown',ask);ask();
}
function makeRtcGuest(pid,offerCode,onMsg){
  let live=null,spare=null,ping=null,heard=0,rescuing=null,opens=0;
  const link={send(m){const dc=live&&live.dc;if(dc&&dc.readyState==='open')try{dc.send(JSON.stringify(m))}catch(e){}}};
  const lost=()=>{if(!rescuing)onMsg({s:'lost'})};
  function wire(line){
    line.pc.ondatachannel=e=>{const dc=line.dc=e.channel;
      dc.onopen=()=>{
        if(live&&live!==line){try{live.pc.close()}catch(x){}}
        live=line;opens++;if(spare===line)spare=null;clearTimeout(rescuing);rescuing=null;heard=Date.now();
        dc.send(JSON.stringify({t:'hello',pid}));
        if(!ping){ping=setInterval(()=>{link.send({t:'ping'});if(Date.now()-heard>6000)rescue()},2000);keepAwake();
          document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()})}};
      dc.onmessage=ev=>{if(live!==line)return;heard=Date.now();let m;try{m=JSON.parse(ev.data)}catch(err){return}
        if(m.s==='pong')return;if(m.s==='spare'){prepare(m);return}onMsg(m)};
      dc.onclose=()=>{if(live===line)rescue()}};
    line.pc.onconnectionstatechange=()=>{const st=line.pc.connectionState;
      if(live===line&&st==='failed')rescue();
      if(live===line&&st==='disconnected')setTimeout(()=>{if(live===line&&line.pc.connectionState!=='connected')rescue()},2500);
      if(!live&&line.first&&st==='failed')onMsg({s:'msg',h:'No luck',p:RTC_FAIL+' Scan the code on the big screen to try again.'})};
  }
  /* on coming back to the page: a quick ping, and the spare if nothing answers */
  function check(){const t=Date.now();link.send({t:'ping'});setTimeout(()=>{if(heard<t)rescue()},1500)}
  async function prepare(m){ // the host's spare offer, minus its addresses for now
    if(spare){try{spare.pc.close()}catch(x){}}
    const line={pc:new RTCPeerConnection({iceServers:[]}),cands:m.sdp.split(/\r?\n/).filter(l=>l.startsWith('a=candidate:')).map(l=>l.slice(2)),mid:(/^a=mid:(\S+)/m.exec(m.sdp)||[])[1]||'0'};
    spare=line;wire(line);
    try{await line.pc.setRemoteDescription({type:'offer',sdp:noCands(m.sdp)});await line.pc.setLocalDescription(await line.pc.createAnswer());
      if(spare===line)link.send({t:'spare',n:m.n,sdp:noCands(line.pc.localDescription.sdp)})}catch(err){if(spare===line)spare=null}
  }
  function rescue(){
    if(rescuing)return;
    const line=spare;if(!line){lost();return}
    rescuing=setTimeout(()=>{rescuing=null;if(live!==line){spare=null;try{line.pc.close()}catch(x){}lost()}},12000);
    onMsg({s:'msg',h:'Back in a moment',p:'Finding the studio again…'});
    line.cands.forEach(c=>line.pc.addIceCandidate({candidate:c,sdpMid:line.mid}).catch(()=>{}));
  }
  link.connect=async()=>{
    onMsg({s:'msg',h:'One moment',p:'Making your reply code…'});
    try{
      await primeCamera();
      const {kind,sdp}=await unpackSDP(offerCode);if(kind!=='O')throw new Error('Scan the code on the big screen.');
      const line={pc:new RTCPeerConnection({iceServers:[]}),first:true};wire(line);
      await line.pc.setRemoteDescription({type:'offer',sdp});
      await line.pc.setLocalDescription(await line.pc.createAnswer());await waitIce(line.pc);
      const reply=await packSDP('A',line.pc.localDescription.sdp);link.reply=reply;
      onMsg({s:'reply',qr:qrDataURL(reply,520)});
    }catch(err){onMsg({s:'msg',h:'No luck',p:err.message})}
  };
  link.debug=()=>({opens,live:live&&live.pc.connectionState,spare:!!spare,spareReady:!!(spare&&spare.pc.localDescription),kill(){live.pc.close()},mute(){live.dc.onmessage=null}});
  return link;
}

/* ============ game definition ============ */
const ROUNDS={
  draw:{id:'draw',name:'Quick on the Draw',blurb:'Everyone answers. The faster you’re right, the more you score.',n:5,diffs:[1,2],dur:15000},
  pick:{id:'pick',name:'Pickpocket',blurb:'Right answers score 200. The fastest right answer steals 300 from anyone they choose.',n:5,diffs:[1,2,3],dur:15000},
  cracker:{id:'cracker',name:'Pull the Cracker',blurb:'Answer right to pass the cracker on. Whoever’s holding it when it bangs loses 500.',goes:2,diffs:[1,2],dur:12000},
  count:{id:'count',name:'The Countdown',blurb:'Points drain away as the clock runs. A wrong answer costs 250.',n:5,diffs:[2,3],dur:15000},
  wager:{id:'wager',name:'Double or Nothing',blurb:'You see the category first, then place your bet. Right wins your stake, wrong loses it.',n:5,diffs:[2,3],dur:15000,betDur:10000},
  lives:{id:'lives',name:'Last One Standing',blurb:'Three hearts each. A wrong answer, or none, costs a heart. Every heart left is worth 250, and the last one standing gets 250 more.',n:8,diffs:[1,2,3],dur:12000},
  furlong:{id:'furlong',name:'The Final Furlong',blurb:'A horse race to finish. Right answers gallop you on, and the leaders start ahead. First past the post wins 1,500.',n:10,diffs:[1,2,3],dur:15000}
};
const MIDDLE=['pick','cracker','count','wager','lives'];
const ROUND_WORDS=['One','Two','Three','Four','Five','Six','Seven','Eight'];
const DRAW_PTS=[500,400,300,250,200,150];
const RACE_PRIZE=[1500,750,300];
const TOD_RECHARGE=25000;
const DEFAULT_NAMES=['Pat','Chris','Sam','Jo','Alex','Viv'];

const H={phase:'lobby',players:[],ri:-1,qi:0,q:null,qStart:0,qDur:15000,answers:{},gen:0,next:null,banner:null,chooser:null,cracker:null,lineup:[],
  settings:Object.assign({role:'play',length:1,toddler:true,bots:true,sound:true},store.get('qb.settings',{})),
  flagged:store.get('qb.flagged',[]),lastTick:0,tod:{readyAt:0,n:0},fxSeq:0};
function saveSettings(){store.set('qb.settings',H.settings)}
function makeLineup(){return ['draw',...shuffle(MIDDLE).slice(0,[2,3,5][H.settings.length]||3),'furlong']}
H.lineup=makeLineup();
const round=()=>ROUNDS[H.lineup[H.ri]];
const P=id=>H.players.find(p=>p.id===id);
const roundLen=r=>r.n;
const live=()=>H.players.filter(p=>!p.out);
const isTod=pid=>String(pid).startsWith('tod');

const net=MODE==='host'?makeMultiHost(onHostMsg):makeLoopback(onHostMsg);

function setPhase(ph){H.phase=ph;H.gen++;H.next=null}
function later(ms,fn){const g=H.gen;return after(ms,()=>{if(g===H.gen)fn()})}
function autoNext(ms,fn){H.next=fn;later(ms,()=>{if(H.next===fn){H.next=null;fn()}})}
function banner(text,ms=2600){H.banner={text,until:Clock.v+ms};renderBanner()}

/* ---- incoming ---- */
function onHostMsg(pid,m){
  if(isTod(pid)){if(m.t==='chaos')onToddler(m.target);else if(m.t==='hello')net.send(pid,todView());return}
  if(m.t==='hello'){const p=P(pid);net.send(pid,p?padView(p):{s:'join'});if(p&&p.away){p.away=false;sync()}return}
  if(m.t==='join'){
    let p=P(pid);
    if(!p){if(H.players.length>=6||H.phase!=='lobby'){net.send(pid,{s:'msg',h:'Full house',p:H.phase==='lobby'?'All six podiums are taken.':'The game has started. Join the next one.'});return}
      const seat=[0,1,2,3,4,5].find(s=>!H.players.some(q=>q.seat===s));
      p={id:pid,seat,name:'',score:0,shown:0,ans:null,ready:false};H.players.push(p);H.players.sort((a,b)=>a.seat-b.seat)}
    p.name=String(m.name||'').trim().slice(0,12)||DEFAULT_NAMES[p.seat];
    SFX.lock(p.seat);sync();
  }
  else if(m.t==='ans')onAnswer(pid,m);
  else if(m.t==='bet')onBet(pid,m);
  else if(m.t==='choose')onChoose(pid,m);
  else if(m.t==='ready'){const p=P(pid);if(p&&H.phase==='lobby'){p.ready=!!m.v;if(p.ready)SFX.lock(p.seat);sync()}}
}
/* presence (multi-window and, later, WebRTC): a player silent for 6 s is marked away */
setInterval(()=>{if(MODE!=='host')return;let ch=false;const now=Date.now();
  H.players.forEach(p=>{const a=now-net.seen(p.id)>6000;if(a!==!!p.away){p.away=a;ch=true}});if(ch)renderStage()},1000);

/* ---- game flow ---- */
function startGame(){
  if(H.players.length<2)return;
  H.players.forEach(p=>{Object.assign(p,{score:0,shown:0,ans:null,ok:null,out:false,hearts:0,bet:0,pos:0,place:0,mult:1,perm:null,fx:null,ready:false})});
  H.ri=-1;H.tod.readyAt=Clock.v+8000;
  setPhase('lineup');SFX.fanfare();sync();autoNext(7000,nextRound);
}
function nextRound(){
  H.ri++;
  if(H.ri>=H.lineup.length)return finale();
  const r=round();H.qi=0;
  H.players.forEach(p=>{p.out=false;p.bet=0;p.hearts=r.id==='lives'?3:0;p.place=0});
  if(r.id==='furlong'){const max=Math.max(1,...H.players.map(p=>p.score));H.players.forEach(p=>{p.pos=.25*p.score/max;p.prev=p.pos})}
  setPhase('intro');SFX.fanfare();sync();
  autoNext(6000,()=>r.id==='cracker'?startCracker(0):r.id==='furlong'?showRace(true):nextQuestion());
}
function nextQuestion(){round().id==='wager'?startBet():ask()}
function freshQuestion(){
  H.q=drawQuestion(round().diffs);H.answers={};
  H.players.forEach(p=>{p.ans=null;p.ok=null;p.mult=1;p.perm=null;p.frozenUntil=0});
}
function ask(){
  const r=round();freshQuestion();
  H.qDur=r.dur;setPhase('q');H.qStart=Clock.v;sync();
  later(H.qDur,reveal);
}
function canAnswer(p){if(p.out)return false;if(round()&&round().id==='cracker')return !!H.cracker&&p.id===H.cracker.holder;return true}
function onAnswer(pid,m){
  const p=P(pid);
  if(!p||H.phase!=='q'||!H.q||m.q!==H.q.id||H.answers[pid]||!canAnswer(p))return;
  if(p.frozenUntil&&Clock.v<p.frozenUntil)return;
  const ms=Clock.v-H.qStart;
  H.answers[pid]={i:m.i|0,ms};p.ans=H.answers[pid];SFX.lock(p.seat);
  if(round().id==='cracker')return crackerAnswer(p);
  sync();
  if(H.players.filter(canAnswer).every(q=>H.answers[q.id]))later(700,reveal);
}
function reveal(){
  if(H.phase!=='q')return;
  const r=round(),q=H.q;
  setPhase('reveal');
  const right=H.players.filter(p=>p.ans&&p.ans.i===q.k).sort((a,b)=>a.ans.ms-b.ans.ms);
  const knocked=[];
  H.players.forEach(p=>{
    let d=0;const ok=!!(p.ans&&p.ans.i===q.k);
    if(r.id==='draw'&&ok)d=DRAW_PTS[right.indexOf(p)];
    if(r.id==='pick'&&ok)d=200;
    if(r.id==='count'){if(ok)d=Math.max(50,Math.round(1000*(1-p.ans.ms/H.qDur)/10)*10);else if(p.ans)d=-250}
    if(r.id==='wager')d=ok?p.bet:-p.bet;
    if(r.id==='lives'&&!p.out&&!ok){p.hearts--;if(p.hearts<=0)knocked.push(p)}
    p.gain=r.id==='furlong'&&ok?(right.indexOf(p)===0?.24:.17):0;
    d*=(p.mult||1);
    if(d<0)d=-Math.min(-d,p.score);
    p.score+=d;p.delta=d;
    p.ok=(r.id==='lives'&&p.out)?null:(p.ans?ok:(r.id==='wager'||r.id==='lives'?false:null));
  });
  if(knocked.length){
    if(!live().some(p=>!knocked.includes(p))){knocked.forEach(p=>p.hearts=1);banner('Everyone would be out, so everyone stays in!',3200)}
    else{knocked.forEach(p=>{p.out=true;p.hearts=0});banner(`Out: ${knocked.map(p=>p.name).join(' and ')}`,3200)}
  }
  right.length?SFX.right():SFX.wrong();
  sync(true);
  if(r.id==='pick'&&right.length)autoNext(3200,()=>startSteal(right[0]));
  else if(r.id==='furlong')autoNext(3200,()=>showRace(false));
  else autoNext(4200,nextQ);
}
function nextQ(){
  H.qi++;const r=round();
  if(r.id==='lives'&&(live().length<=1||H.qi>=roundLen(r)))return endLives();
  if(H.qi>=roundLen(r))return scores();
  nextQuestion();
}
function scores(){setPhase('scores');sync();autoNext(6500,nextRound)}
function finale(){setPhase('final');SFX.win();sync();confetti(260)}

/* ---- Double or Nothing ---- */
function betOptions(p){const s=p.score,o=[100,250,500].filter(v=>v<=Math.max(100,s));if(s>100&&!o.includes(s))o.push(s);return o.slice(-4)}
function startBet(){
  const r=round();freshQuestion();
  H.players.forEach(p=>p.bet=0);
  setPhase('bet');H.qStart=Clock.v;H.qDur=r.betDur;sync();
  later(r.betDur,closeBets);
}
function onBet(pid,m){
  const p=P(pid);if(!p||H.phase!=='bet'||p.bet)return;
  const o=betOptions(p),v=m.v|0;p.bet=o.includes(v)?v:o[0];SFX.lock(p.seat);sync();
  if(H.players.every(q=>q.bet))later(700,closeBets);
}
function closeBets(){
  if(H.phase!=='bet')return;
  H.players.forEach(p=>{if(!p.bet)p.bet=betOptions(p)[0]});
  H.qDur=round().dur;setPhase('q');H.qStart=Clock.v;sync();later(H.qDur,reveal);
}

/* ---- Last One Standing ---- */
function endLives(){
  const surv=live();
  H.players.forEach(p=>{const d=250*Math.max(0,p.hearts)+(surv.length===1&&surv[0]===p?250:0);p.score+=d;p.delta=d});
  setPhase('livesend');SFX.fanfare();sync(true);autoNext(5500,scores);
}

/* ---- The Final Furlong ---- */
function showRace(first){
  H.players.forEach(p=>p.prev=p.pos);
  if(!first){
    H.qi++;
    H.players.forEach(p=>{if(!p.place)p.pos+=p.gain||0;p.gain=0});
    let placed=H.players.filter(p=>p.place).length;
    H.players.filter(p=>!p.place&&p.pos>=1).sort((a,b)=>b.pos-a.pos).forEach(p=>p.place=++placed);
  }
  setPhase('race');SFX.gallop();sync();
  const over=H.players.some(p=>p.place)||H.qi>=roundLen(round());
  autoNext(first?5500:4200,over?finishRace:ask);
}
function finishRace(){
  let placed=H.players.filter(p=>p.place).length;
  H.players.filter(p=>!p.place).sort((a,b)=>b.pos-a.pos).forEach(p=>p.place=++placed);
  H.players.forEach(p=>{const d=RACE_PRIZE[p.place-1]||0;p.score+=d;p.delta=d});
  setPhase('raceend');SFX.win();sync(true);confetti(140);
  autoNext(6500,()=>{H.ri=H.lineup.length;finale()});
}

/* ---- Pickpocket ---- */
function startSteal(p){
  setPhase('steal');H.chooser=p.id;banner(`Fastest right answer: ${p.name}. Whose pocket will it be?`,11000);sync();
  later(12000,()=>{const t=H.players.filter(q=>q!==p).sort((a,b)=>b.score-a.score)[0];doSteal(p,t)});
}
function onChoose(pid,m){
  const t=P(m.target);if(!t||pid!==H.chooser||t.id===pid)return;
  if(H.phase==='steal')doSteal(P(pid),t);
  else if(H.phase==='pass')doPass(P(pid),t);
}
function doSteal(p,t){
  if(H.phase!=='steal')return;
  const amt=Math.min(300,t.score);
  t.score-=amt;p.score+=amt;t.delta=-amt;p.delta=amt;t.ok=null;p.ok=null;
  setPhase('stolen');H.chooser=null;SFX.steal();
  banner(amt?`${p.name} picks ${t.name}’s pocket: ${amt} points!`:`${p.name} picks ${t.name}’s pocket. It’s empty!`,3000);
  sync(true);autoNext(3200,nextQ);
}

/* ---- Pull the Cracker ---- */
function startCracker(go){
  const order=H.players.slice().sort((a,b)=>a.score-b.score);
  H.cracker={go,holder:(go===0?pick(H.players):order[0]).id,id:Math.random()};
  const id=H.cracker.id;
  after(rnd(35000,60000),()=>{if(H.cracker&&H.cracker.id===id)bang()});
  crackerAsk();
}
function crackerAsk(){
  freshQuestion();
  H.qDur=round().dur;setPhase('q');H.qStart=Clock.v;sync();
  later(H.qDur,()=>{banner(`Too slow, ${P(H.cracker.holder).name}! Try another.`,1800);SFX.wrong();crackerAsk()});
}
function crackerAnswer(p){
  const ok=p.ans.i===H.q.k;p.ok=ok;
  setPhase(ok?'pass':'crackwrong');
  if(ok){SFX.right();H.chooser=p.id;banner(`Right! ${p.name} is passing the cracker…`,6500);sync();later(7000,()=>doPass(p,pick(H.players.filter(q=>q!==p))))}
  else{SFX.wrong();sync();later(1800,crackerAsk)}
}
function doPass(p,t){
  if(H.phase!=='pass')return;
  H.cracker.holder=t.id;H.chooser=null;SFX.pass();banner(`${p.name} passes the cracker to ${t.name}`,1600);
  crackerAsk();
}
function bang(){
  const h=P(H.cracker.holder),amt=Math.min(500,h.score);
  h.score-=amt;h.delta=-amt;
  setPhase('bang');SFX.bang();flash();sync(true);
  const go=H.cracker.go;
  autoNext(4200,()=>{H.cracker=null;if(go+1<ROUNDS.cracker.goes)startCracker(go+1);else scores()});
}

/* ---- the toddler: splat, freeze or jumble any player ---- */
function todView(){
  const lobby=H.phase==='lobby'||H.phase==='final';
  return {s:'toddler',charged:lobby||Clock.v>=H.tod.readyAt,readyIn:lobby?0:Math.max(0,H.tod.readyAt-Clock.v),cycle:H.tod.n,
    targets:H.players.map(p=>({id:p.id,seat:p.seat,name:p.name}))};
}
function onToddler(target){
  const t=P(target);
  if(!H.settings.toddler)return;
  if(H.phase==='lobby'||H.phase==='final'||!t){SFX.whistle();confetti(60);if(t){t.spinUntil=Clock.v+1000;renderStage();after(1100,()=>renderStage())}return}
  if(Clock.v<H.tod.readyAt)return;
  H.tod.readyAt=Clock.v+TOD_RECHARGE;H.tod.n++;
  let kind='pie';
  if(H.phase==='q'&&canAnswer(t)&&!H.answers[t.id])kind=pick(['freeze','scramble','pie']);
  const id=++H.fxSeq;
  if(kind==='pie'){const amt=Math.min(150,t.score);t.score-=amt;t.delta=-amt;t.splatUntil=Clock.v+5000;banner(`Splat! The toddler got ${t.name}${amt?`: −${amt}`:''}`,2800)}
  if(kind==='freeze'){t.frozenUntil=Clock.v+6000;banner(`Brrr! ${t.name} is frozen for six seconds`,2800)}
  if(kind==='scramble'){let o;do{o=shuffle([0,1,2,3])}while(o.every((v,i)=>v===i));t.perm=o;t.spinUntil=Clock.v+1000;banner(`Whoops! ${t.name}’s buttons are jumbled`,2800)}
  t.fx={kind,id};
  throwFx(t,kind);
  setTimeout(()=>{SFX[kind==='pie'?'splat':kind]();sync(kind==='pie');after(6200,()=>{renderStage();if(t.fx&&t.fx.id===id)t.fx=null})},650);
}

/* ---- host controls ---- */
function skipQuestion(){
  if(H.phase!=='q'&&H.phase!=='bet')return;
  banner('Question skipped',1400);
  const r=round();
  if(r.id==='cracker')crackerAsk();else if(r.id==='furlong')ask();else{H.qi--;nextQ()}
}
function flagQuestion(){
  if(!H.q)return;
  if(!H.flagged.some(f=>f.id===H.q.id)){H.flagged.push({id:H.q.id,q:H.q.text});store.set('qb.flagged',H.flagged)}
  banner('Question flagged for review',1400);renderHost();
}
function togglePause(){Clock.paused=!Clock.paused;$('#pausedOv').hidden=!Clock.paused;renderHost()}
function abandon(){Join.ov=false;Clock.ev.forEach(e=>e.dead=true);Clock.ev=[];H.cracker=null;setPhase('lobby');H.ri=-1;H.q=null;
  H.players.forEach(p=>Object.assign(p,{score:0,shown:0,ans:null,ok:null,ready:false,out:false,hearts:0,bet:0,fx:null,perm:null}));
  Clock.paused=false;$('#pausedOv').hidden=true;sync()}

/* ============ what each pad sees ============ */
function tutOpts(){return {lineup:H.lineup,toddler:H.settings.toddler,role:H.settings.role,bank:Bank.all.length}}
function padView(p){
  const r=round(),ph=H.phase;
  const base={name:p.name,seat:p.seat,score:p.score,fx:p.fx||null,hearts:r&&r.id==='lives'&&ph!=='intro'?p.hearts:null};
  const answer=()=>LETTERS[H.q.k]+'. '+H.q.opts[H.q.k];
  if(ph==='lobby')return {...base,s:'tut',ready:p.ready,...tutOpts()};
  if(ph==='lineup')return {...base,s:'msg',h:'Tonight’s rounds',p:H.lineup.map(id=>ROUNDS[id].name).join(' · ')};
  if(ph==='intro')return {...base,s:'msg',h:r.name,p:r.blurb};
  if(ph==='bet'){
    if(p.bet)return {...base,s:'msg',h:`Bet ${p.bet}`,p:`On ${CATS[H.q.c]}. Waiting for the others…`};
    return {...base,s:'bet',cat:CATS[H.q.c],opts:betOptions(p)};
  }
  if(ph==='q'){
    if(r.id==='lives'&&p.out)return {...base,s:'msg',h:'You’re out',p:'No hearts left. Cheer on the others!'};
    if(r.id==='cracker'&&p.id!==H.cracker.holder)return {...base,s:'watch',p:`${P(H.cracker.holder).name} has the cracker!`};
    return {...base,s:'q',qid:H.q.id,text:H.q.text,opts:H.q.opts,locked:p.ans?p.ans.i:null,x2:p.mult===2,perm:p.perm,
      frozenMs:Math.max(0,(p.frozenUntil||0)-Clock.v),bet:r.id==='wager'?p.bet:0};
  }
  if(ph==='reveal'){
    const ok=p.ok;let note='';
    if(r.id==='wager')note=`You bet ${p.bet}.`;
    if(r.id==='lives')note=p.out?'Out of hearts!':`${p.hearts} ${p.hearts===1?'heart':'hearts'} left.`;
    if(r.id==='lives'&&p.out&&ok===null)return {...base,s:'msg',h:'You’re out',p:'Cheer on the others!'};
    return {...base,s:'verdict',ok:ok===true?'ok':ok===false?'bad':'none',delta:p.delta||0,correct:answer(),note};
  }
  if(ph==='steal'||ph==='pass'){
    if(p.id===H.chooser){
      const others=H.players.filter(q=>q!==p).map(q=>({id:q.id,name:q.name,score:q.score,seat:q.seat}));
      return {...base,s:'choose',kind:ph,prompt:ph==='steal'?'Whose pocket will you pick?':'Pass the cracker to…',targets:others};
    }
    const c=P(H.chooser);
    return {...base,s:ph==='pass'?'watch':'msg',h:'Uh oh',p:ph==='steal'?`${c.name} is choosing whose pocket to pick…`:`${c.name} is passing the cracker…`};
  }
  if(ph==='crackwrong')return p.id===H.cracker.holder?{...base,s:'verdict',ok:'bad',delta:0,correct:answer(),note:'Still yours! Next question coming.'}:{...base,s:'watch',p:`${P(H.cracker.holder).name} got it wrong!`};
  if(ph==='bang'){const h=P(H.cracker.holder);return p===h?{...base,s:'verdict',ok:'bad',delta:p.delta,correct:'',note:'BANG! The cracker went off in your hands.'}:{...base,s:'msg',h:'BANG!',p:`${h.name} was left holding it.`}}
  if(ph==='stolen')return {...base,s:'msg',h:p.delta>0?'Got it!':p.delta<0?'Robbed!':'Phew',p:p.delta>0?`You stole ${p.delta}.`:p.delta<0?`You lost ${-p.delta}.`:'Your pocket was spared.'};
  if(ph==='livesend'){const surv=p.hearts>0;return {...base,s:'msg',h:surv?'Survivor!':'Knocked out',p:p.delta?`+${p.delta} for your hearts.`:'No hearts left, no bonus.'}}
  if(ph==='race')return {...base,s:'msg',h:p.place?`${ORD(p.place)} past the post!`:H.qi===0?'And they’re off!':'Watch the race',p:p.place?'Wait for the others to finish.':'Right answers gallop you on. The faster you’re right, the further you go.'};
  if(ph==='raceend')return {...base,s:'msg',h:`${ORD(p.place)} in the race`,p:p.delta?`+${p.delta} prize money.`:'No prize this time.'};
  if(ph==='scores'){const rank=rankOf(p);return {...base,s:'msg',h:`You’re ${ORD(rank)}`,p:'Scores on the doors.'}}
  if(ph==='final'){const rank=rankOf(p);return {...base,s:'msg',h:rank===1?'Champion!':`${ORD(rank)} place`,p:`Final score ${p.score}.`}}
  return {...base,s:'msg',h:'Stand by',p:''};
}
