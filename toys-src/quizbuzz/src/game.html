function fakeQR(seed,px){ // illustrative only: the live transport supplies the real join code
  const N=25,c=document.createElement('canvas'),m=4,sz=(N+m*2)*px;c.width=c.height=sz;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,sz,sz);g.fillStyle='#111';
  let r=seed;const rand=()=>(r=(r*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const fin=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(fin(x,y))continue;if(rand()<.47)g.fillRect((x+m)*px,(y+m)*px,px,px)}
  [[0,0],[N-7,0],[0,N-7]].forEach(([x,y])=>{g.fillRect((x+m)*px,(y+m)*px,7*px,7*px);g.fillStyle='#fff';g.fillRect((x+m+1)*px,(y+m+1)*px,5*px,5*px);g.fillStyle='#111';g.fillRect((x+m+2)*px,(y+m+2)*px,3*px,3*px)});
  return c.toDataURL();
}

const LAN=()=>MODE==='host'&&net.rtc;
function joinCardHTML(){
  if(MODE==='studio')return `<div class="jcard"><div class="jk">Practice studio</div><div class="jproto">Play on the pads below, with robots to make up the numbers.</div><button type="button" class="jhost" onclick="event.stopPropagation();location.hash='host';location.reload()">Host a real game</button><div class="jproto">Put this on the big screen and everyone joins with their phone.</div></div>`;

/* in host mode the join card is big enough to scan from the sofa, so it sits on the stage beside the screen: all through the lobby, and during a game when the host asks for it */
function liveCardHTML(title){
  return `<div class="jcard live"><div class="jk">${title}</div><img class="joinqr" src="" alt="Join code"><div class="camrow"><div class="camslot"></div><div class="jproto" id="rtcStatus"></div><button type="button" class="camflip" onclick="event.stopPropagation();flipCamera()">${cam.facing==='user'?'Use back camera':'Use front camera'}</button></div></div>`;
}
function syncJoinCard(){
  const ov=$('#joinOv');if(!ov)return;
  const show=!!LAN()&&(H.phase==='lobby'||Join.ov),title=H.phase==='lobby'?'Scan to join':'Join or rejoin';
  if(show&&(ov.hidden||ov.dataset.title!==title)){ov.innerHTML=liveCardHTML(title);ov.dataset.title=title;refreshJoinQR()}
  ov.hidden=!show;placeCamera();
}
function flipCamera(){
  cam.facing=cam.facing==='user'?'environment':'user';store.set('qb.cam',cam.facing);
  if(cam.stop)cam.stop();if(cam.video)cam.video.remove();cam.video=null;
  $('#joinOv').hidden=true;syncJoinCard();
}
/* the camera preview element survives re-renders and is moved into whichever slot is showing */
const cam={video:null,stop:null,facing:store.get('qb.cam','user')};
function placeCamera(){
  if(!LAN())return;
  if(!cam.video){cam.video=document.createElement('video');cam.video.className='campv'+(cam.facing==='user'?' front':'');cam.video.setAttribute('playsinline','');cam.video.muted=true;
    cam.stop=startReplyCamera(cam.video,(code,err)=>{if(err){net.rtc.status=err;net.rtc.onChange();return}net.rtc.acceptReply(code)},cam.facing)}
  const slot=document.querySelector('#joinOv:not([hidden]) .camslot');
  if(slot&&cam.video.parentNode!==slot)slot.appendChild(cam.video);
}
function refreshJoinQR(){
  if(!LAN())return;
  const url=net.rtc.joinURL,src=url?qrDataURL(url):QR.join;
  document.querySelectorAll('img.joinqr').forEach(im=>{im.src=src;im.style.opacity=url?1:.15});
  document.querySelectorAll('#rtcStatus').forEach(e=>e.textContent=net.rtc.status||'Then hold your phone up to the iPad camera.');
}
function toggleJoinOverlay(show){
  if(!LAN())return;
  Join.ov=show===undefined?!Join.ov:!!show;

}
function joinShow(){
  const art=$('#jart');if(!art)return;
  Join.i=((Join.i%JOIN_STEPS.length)+JOIN_STEPS.length)%JOIN_STEPS.length;
  document.querySelectorAll('#jsteps li').forEach((li,i)=>li.classList.toggle('on',i===Join.i));
  art.innerHTML=JOIN_STEPS[Join.i].art;Join.t0=performance.now();joinFoot();placeCamera();

function joinFoot(){
  const c=$('#joinCount');if(!c)return;
  const n=H.players.length,ready=H.players.filter(p=>p.ready).length;
  const names=H.players.map(p=>`<span class="nm s${p.seat}">${esc(p.name)}${p.ready?' \u2713':''}</span>`).join('');
  c.innerHTML=n===0?'<b>0</b>Nobody\u2019s in yet. Two to six players.'
    :`<b>${n}</b><span class="who">in the studio${n>=2&&ready===n?'. Everyone\u2019s ready!':ready?`, ${ready} ready`:''}</span>${names}`;

function joinTick(){if(performance.now()-Join.t0>Join.dur){Join.i++;joinShow()}}
scr.addEventListener('click',()=>{if(H.phase==='lobby'){Join.i++;joinShow()}});
function renderBanner(){const b=$('#banner');if(!b)return;if(H.banner&&Clock.v<H.banner.until){b.textContent=H.banner.text;requestAnimationFrame(()=>b.classList.add('show'))}else b.classList.remove('show')}

/* per-frame: timer lamps, worth, score tween, banner expiry */
function frame(){
  if(H.phase==='q'||H.phase==='bet'){
    const rem=Math.max(0,H.qDur-(Clock.v-H.qStart)),secs=Math.ceil(rem/1000),lamps=document.querySelectorAll('#lamps .lamp'),n=Math.ceil(rem/H.qDur*15);
    lamps.forEach((l,i)=>{l.classList.toggle('on',i<n);l.classList.toggle('hot',secs<=5)});
    if(secs<=5&&secs>0&&secs!==H.lastTick&&!Clock.paused){H.lastTick=secs;SFX.tick()}
    const w=$('#worth');if(w)w.textContent=Math.max(50,Math.round(1000*rem/H.qDur/10)*10);
  } else H.lastTick=0;
  H.players.forEach(p=>{if(p.shown!==p.score){const d=p.score-p.shown,st=Math.sign(d)*Math.max(1,Math.ceil(Math.abs(d)/14));p.shown=Math.abs(st)>=Math.abs(d)?p.score:p.shown+st;const e=pods.querySelector(`[data-score="${p.id}"]`);if(e)e.textContent=p.shown}});
  if(H.banner&&Clock.v>=H.banner.until){H.banner=null;renderBanner()}
  if(H.phase==='lobby')joinTick();
  artTick();
  drawFx();requestAnimationFrame(frame);
}

/* confetti + flash */
const fx=$('#fx'),fxc=fx.getContext('2d');let bits=[],flashA=0;
function confetti(n){const cols=['#e8742a','#e2a62a','#8b9b2c','#3a8fb3','#97406f','#f4e6c6'];for(let i=0;i<n;i++)bits.push({x:rnd(200,1400),y:rnd(-200,0),vx:rnd(-2,2),vy:rnd(2,7),r:rnd(0,6.3),vr:rnd(-.2,.2),w:rnd(10,22),h:rnd(6,12),c:pick(cols)})}
function flash(){flashA=1}
function drawFx(){
  fxc.clearRect(0,0,1600,900);
  if(flashA>0){fxc.fillStyle=`rgba(255,240,200,${flashA})`;fxc.fillRect(0,0,1600,900);flashA=Math.max(0,flashA-.04)}
  bits=bits.filter(b=>b.y<950);
  for(const b of bits){b.x+=b.vx;b.y+=b.vy;b.vy+=.05;b.r+=b.vr;fxc.save();fxc.translate(b.x,b.y);fxc.rotate(b.r);fxc.fillStyle=b.c;fxc.fillRect(-b.w/2,-b.h/2,b.w,b.h*Math.abs(Math.cos(b.r*2)));fxc.restore()}
}

/* ============ host controls ============ */
function seg(label,key,opts){
  return `<div class="setting"><span>${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v,t])=>`<button type="button" data-set="${key}" data-val="${v}" aria-pressed="${H.settings[key]===v}">${t}</button>`).join('')}</div></div>`;
}
function renderHost(){
  const ph=H.phase,lobby=ph==='lobby',qm=H.settings.role==='host';
  const btn=(id,t,cls='',dis=false)=>`<button type="button" class="hb ${cls}" id="${id}" ${dis?'disabled':''}>${t}</button>`;
  $('#hostbar').innerHTML=lobby
    ?btn('bStart','Start game','primary',H.players.length<2)
    :[btn('bNext','Next',!!H.next?'primary':'',!H.next),btn('bPause',Clock.paused?'Resume':'Pause'),btn('bSkip','Skip question','',ph!=='q'),LAN()?btn('bJoinCode',Join.ov?'Hide join code':'Join code'):'',qm?btn('bFlag','Flag question','',!H.q||ph==='lobby'):'',btn('bQuit',ph==='final'?'New game':'End game')].join('');
  $('#settings').hidden=!lobby;
  if(lobby)$('#settings').innerHTML=
    seg('Host','role',[['play','Playing'],['host','Quizmaster']])+

    `<div class="setting wide"><span>Running order</span><span class="lineup">${H.lineup.map(id=>esc(ROUNDS[id].name)).join(' \u00b7 ')}</span><button type="button" class="hb" id="bShuffle">Shuffle</button></div>`+
    seg('Toddler button','toddler',[[true,'On'],[false,'Off']])+
    (MODE==='studio'?seg('Robot players','bots',[[true,'On'],[false,'Off']]):'')+
    seg('Sound','sound',[[true,'On'],[false,'Off']])+
    `<div class="setting"><span>Questions</span><button type="button" class="hb" id="bReset">Forget asked questions</button>${H.flagged.length?`<button type="button" class="hb" id="bCopyFlags">Copy ${H.flagged.length} flagged</button>`:''}</div>`;
  $('#note').textContent=lobby
    ?(MODE==='host'?'Buzzers: open this page in more windows with #pad at the end of the address (#toddler for the toddler). ':'')+(qm?'Quizmaster: you don’t play or score. You can skip and flag questions, and tap a podium to adjust a score by 100.':`Playing: you’re a contestant${MODE==='studio'?' on pad 1':''}. Nothing on this screen shows an answer before everyone else sees it.`)
    :(qm?'Tap a podium: +100. Long-press: −100.':'');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.set){let v=b.dataset.val;v=v==='true'?true:v==='false'?false:/^\d$/.test(v)?+v:v;H.settings[b.dataset.set]=v;saveSettings();if(b.dataset.set==='length')H.lineup=makeLineup();buildPads();sync();return}
  ({bStart:startGame,bNext:()=>{const f=H.next;if(f){H.next=null;f()}},bPause:togglePause,bSkip:skipQuestion,bFlag:flagQuestion,bQuit:abandon,
    bJoinCode:()=>toggleJoinOverlay(),
    bShuffle:()=>{H.lineup=makeLineup();sync()},

// quizmaster score nudges
let pressT=null;
pods.addEventListener('pointerdown',e=>{if(H.settings.role!=='host')return;const pod=e.target.closest('.pod[data-pid]');if(!pod)return;const p=P(pod.dataset.pid);pressT={p,long:false,t:setTimeout(()=>{pressT.long=true;nudge(p,-100)},550)}});

function nudge(p,d){if(!p||H.phase==='lobby')return;d=d<0?-Math.min(-d,p.score):d;p.score+=d;p.delta=d;renderStage(true);p.delta=0;H.players.forEach(q=>net.send(q.id,padView(q)))}

/* ============ pads ============ */
class Pad{
  constructor(cell,pid,opts){
    this.pid=pid;this.opts=opts;this.bot=!!opts.bot;this.view=null;this.botT=null;this.lastFx=0;this.frozenTill=0;
    this.cell=cell;cell.innerHTML=`${opts.solo?'':`<div class="padcap"><span>${esc(opts.label)}</span>${opts.toddler?'':`<button type="button" aria-pressed="${this.bot}">Robot</button>`}</div>`}<div class="fit padfit"><div class="inner"><div class="pad"></div></div></div>`;
    this.el=cell.querySelector('.pad');this.fit=cell.querySelector('.fit');
    const rb=cell.querySelector('.padcap button');if(rb)rb.onclick=()=>{this.bot=!this.bot;rb.setAttribute('aria-pressed',this.bot);this.botAct()};
    this.link=opts.link?opts.link(m=>this.onMsg(m)):net.connect(pid,m=>this.onMsg(m));
    fitBox(this.fit,360,600,opts.solo?()=>innerHeight-24:null);
    this.el.addEventListener('click',e=>this.onClick(e));
    this.el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')this.join()});
    if(opts.toddler)this.render({s:'toddler',charged:true,targets:[],cycle:-1});
    else if(opts.solo&&!opts.rtc){this.render({s:'msg',h:'Quizbuzz',p:'Looking for the studio…'});setTimeout(()=>{if(!this.view)this.render({s:'msg',h:'Quizbuzz',p:'On a phone? Scan the code on the big screen to join.'})},3000)}
    else{this.render({s:'join'});if(this.bot)setTimeout(()=>{if(!this.dead)this.join(DEFAULT_NAMES[opts.n])},200+opts.n*150)}
  }
  send(m){if(!this.dead)this.link.send(m)}
  join(name){const v=name||(this.el.querySelector('input')||{}).value;store.set('qb.name',v);this.send({t:'join',name:v})}
  onMsg(m){this.view=m;this.render(m);this.botAct()}
  botAct(){
    clearTimeout(this.botT);const v=this.view;if(!this.bot||!v||this.dead)return;
    if(v.s==='join')this.botT=setTimeout(()=>this.join(DEFAULT_NAMES[this.opts.n]),400);
    if(v.s==='tut'&&!v.ready)this.botT=setTimeout(()=>this.send({t:'ready',v:true}),rnd(4000,14000)/SPEED);
    if(v.s==='bet')this.botT=setTimeout(()=>this.send({t:'bet',v:pick(v.opts)}),rnd(1200,6000)/SPEED);
    if(v.s==='q'&&v.locked==null){this.botT=setTimeout(()=>{const k=window.__cheat(v.qid);const i=k>=0&&Math.random()<.6?k:Math.floor(Math.random()*4);this.answer(i)},(rnd(1500,9000)+(v.frozenMs||0))/SPEED)}
    if(v.s==='choose')this.botT=setTimeout(()=>this.send({t:'choose',target:pick(v.targets).id}),rnd(900,2600)/SPEED);
  }
  answer(i){const v=this.view;if(!v||v.s!=='q'||v.locked!=null||performance.now()<this.frozenTill)return;v.locked=i;this.render(v);this.send({t:'ans',q:v.qid,i})}
  onClick(e){
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.a!=null)this.answer(+b.dataset.a);
    else if(b.dataset.t)this.send({t:'choose',target:b.dataset.t});
    else if(b.dataset.bet)this.send({t:'bet',v:+b.dataset.bet});
    else if(b.dataset.hit){this.send({t:'chaos',target:b.dataset.hit});b.classList.add('hit');if(this.view&&this.view.charged&&this.view.cycle>=0){this.view.charged=false;this.view.readyIn=TOD_RECHARGE;this.view.cycle+=.5;setTimeout(()=>this.render(this.view),350)}}
    else if(b.dataset.rtc){if(this.link.g)return;if(b.dataset.rtc==='tod')this.pid='tod';this.link.g=makeRtcGuest(this.pid,this.opts.rtc,m=>this.onMsg(m));this.link.g.connect()}
    else if(b.classList.contains('go'))this.join();
    else if(b.dataset.tut){const L=padSlides(this.view).length,d=b.dataset.tut;if(d==='ready'){this.send({t:'ready',v:true});return}if(d==='again'){this.ti=0;this.send({t:'ready',v:false});return}this.ti=Math.max(0,Math.min(L-1,(this.ti||0)+(d==='next'?1:-1)));this.render(this.view)}
  }
  render(v){
    const el=this.el;
    let key=null;
    if(v.s==='tut')key=['tut',this.ti||0,v.ready,v.name,(v.lineup||[]).join(),v.toddler,v.role].join('|');
    if(v.s==='toddler')key=['tod',v.cycle,v.charged,v.targets.map(t=>t.id+t.name).join()].join('|');
    if(key&&el.dataset.key===key){const s=el.querySelector('.top .s');if(s)s.textContent=v.score;return}
    if(key)el.dataset.key=key;else delete el.dataset.key;
    clearTimeout(this.reT);
    if(v.s==='toddler')return this.renderToddler(v);
    const seat=v.seat!=null?` s${v.seat}`:'';el.className='pad'+seat;
    const hearts=v.hearts!=null?`<span class="hp">${[0,1,2].map(i=>`<i class="${i<v.hearts?'':'gone'}">${HEART}</i>`).join('')}</span>`:'';
    const top=v.name?`<div class="top"><span class="n">${esc(v.name)}</span>${hearts}<span class="s">${v.score}</span></div>`:`<div class="top"><span class="n">${esc(this.opts.label||'Buzzer')}</span><span class="s"></span></div>`;
    let body='';
    if(v.s==='join'){const id='nm-'+this.pid,nm=this.opts.solo?store.get('qb.name',''):this.opts.name;body=`<div class="msg"><h2>Quizbuzz</h2><p>What’s your name?</p></div><input id="${id}" maxlength="12" value="${esc(nm)}" placeholder="Your name" autocomplete="off" aria-label="Your name"><button type="button" class="go">Take my place</button>`}
    else if(v.s==='msg')body=`<div class="msg"><h2>${esc(v.h||'')}</h2><p>${esc(v.p||'')}</p></div>`;
    else if(v.s==='rtcjoin')body=`<div class="msg"><h2>Quizbuzz</h2><p>You’ve found the studio.</p></div><button type="button" class="go" data-rtc="player">Join the game</button><button type="button" class="tnav ghost" data-rtc="tod">This is the toddler’s phone</button>`;
    else if(v.s==='reply'){el.classList.add('replyv');body=`<img class="rqr" src="${v.qr}" alt="Reply code"><p class="rq">Hold this up to the iPad’s camera</p>`}
    else if(v.s==='lost')body=`<div class="msg"><h2>Lost the studio</h2><p>Scan the code on the big screen to rejoin. You’ll get your podium back.</p></div>`;
    else if(v.s==='tut'&&v.ready)body=`<div class="msg"><h2>Ready!</h2><p>Your podium has a tick. The game starts when the host presses Start.</p></div><button type="button" class="tnav ghost" data-tut="again">Read the rules again</button>`;
    else if(v.s==='tut'){
      const L=padSlides(v),i=Math.min(this.ti||0,L.length-1),sl=L[i],last=i===L.length-1;
      body=`<div class="tk2">How to play · ${i+1} of ${L.length}</div><div class="pcard"><div class="art" data-t0="${performance.now()}" aria-hidden="true">${sl.art}</div></div><div class="pt">${sl.t}</div><p class="pb">${sl.b}</p><div class="tnavs">${i?'<button type="button" class="tnav ghost" data-tut="back">Back</button>':''}<button type="button" class="tnav" data-tut="${last?'ready':'next'}">${last?'I’m ready':'Next'}</button></div>`;
    }
    else if(v.s==='watch')body=`<div class="msg">${crackerSVG().replace('class="cracker wob"','class="wob" width="220"')}<p>${esc(v.p)}</p></div>`;
    else if(v.s==='bet')body=`<div class="cat2">The category is</div><div class="catn">${esc(v.cat)}</div><div class="cat2">How much will you bet?</div>${v.opts.map(o=>`<button type="button" class="betb" data-bet="${o}">${o===v.score&&o>100?`All in · ${o}`:o}</button>`).join('')}`;
    else if(v.s==='q'){
      if(v.frozenMs>0)this.frozenTill=performance.now()+v.frozenMs;
      const frozen=performance.now()<this.frozenTill;
      if(v.locked!=null)el.classList.add('locked');
      const order=v.perm||[0,1,2,3];
      body=`<div class="pq">${esc(v.text)}</div>${order.map(i=>`<button type="button" class="ab c${i}${v.locked===i?' mine':''}" data-a="${i}" ${v.locked!=null||frozen?'disabled':''}><span class="let">${LETTERS[i]}</span><span>${esc(v.opts[i])}</span></button>`).join('')}<div class="lockline">${v.locked!=null?'Locked in':v.perm?'Your buttons are jumbled!':v.bet?`Your bet: ${v.bet}`:v.x2?'Double points!':''}</div>`;
      if(frozen){body+=`<div class="ovl ice"><b>Frozen!</b><span>The toddler got you</span></div>`;this.reT=setTimeout(()=>this.render(this.view),this.frozenTill-performance.now()+30)}
    }
    else if(v.s==='verdict'){
      const mark={ok:'✓',bad:'✗',none:'–'}[v.ok];
      body=`<div class="verdict"><div class="mark ${v.ok}">${mark}</div><div class="pts">${v.delta>0?'+'+v.delta:v.delta<0?v.delta:v.ok==='none'?'No answer':'No points'}</div>${v.correct?`<p>Answer: ${esc(v.correct)}</p>`:''}${v.note?`<p>${esc(v.note)}</p>`:''}</div>`;
    }
    else if(v.s==='choose')body=`<div class="msg" style="margin:0"><h2 style="font-size:32px">${esc(v.prompt)}</h2></div>${v.targets.map(t=>`<button type="button" class="tgt s${t.seat}" data-t="${t.id}"><span>${esc(t.name)}</span><span>${t.score}</span></button>`).join('')}`;
    el.innerHTML=top+`<div class="body">${body}</div>`;
    if(v.fx&&v.fx.id!==this.lastFx){this.lastFx=v.fx.id;if(v.fx.kind==='pie'){const o=document.createElement('div');o.className='ovl splat';el.appendChild(o);setTimeout(()=>o.remove(),2700)}}
  }
  renderToddler(v){
    const el=this.el;el.className='pad toddler'+(v.charged?'':' sleep');
    const t=v.targets||[];
    const circles=t.length?`<div class="tgrid n${t.length}">${t.map(x=>`<button type="button" class="tgt2 s${x.seat}" data-hit="${x.id}" ${v.charged?'':'disabled'} aria-label="${esc(x.name)}">${esc(x.name.slice(0,1).toUpperCase())}</button>`).join('')}</div>`
      :`<button type="button" class="bigred" data-hit="none" aria-label="Big button">Boo!</button>`;
    const C=659.7,p0=Math.max(0,Math.min(1,1-(v.readyIn||0)/TOD_RECHARGE));
    const ring=v.charged?'':`<svg class="ring" viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="105" class="rbg"/><circle cx="110" cy="110" r="105" class="rfg" style="stroke-dasharray:${C};stroke-dashoffset:${C*(1-p0)}px"/></svg><div class="zz">z z z</div>`;
    el.innerHTML=`<div class="body">${circles}${ring}<div class="rech">${v.charged?(t.length?'Tap someone!':'Tap the button!'):'Recharging'}</div></div>`;
    const fg=el.querySelector('.rfg');if(fg)requestAnimationFrame(()=>requestAnimationFrame(()=>{fg.style.setProperty('--rd',(v.readyIn||0)+'ms');fg.style.strokeDashoffset="0px"}));
    if(!v.charged&&v.readyIn>0)this.reT=setTimeout(()=>{this.view={...v,charged:true,readyIn:0};this.render(this.view)},v.readyIn+60);
  }
}

/* ============ scaling ============ */
const fits=[];
function fitBox(box,w,h,maxH){fits.push({box,w,h,maxH});layout()}
function layout(){for(const f of fits){const W=f.box.clientWidth;let s=W/f.w;if(f.maxH)s=Math.min(s,f.maxH()/f.h);f.box.style.height=(f.h*s)+'px';if(f.maxH)f.box.style.width=(f.w*s)+'px';f.box.firstElementChild.style.transform=`scale(${s})`}}
new ResizeObserver(layout).observe(document.body);
addEventListener('resize',layout);

/* in-page pads for one-device testing (studio mode) */
let pads=[];
function buildPads(){
  if(MODE!=='studio')return;
  const want=6+(H.settings.toddler?1:0);
  if(pads.length===want&&pads.botsSetting===H.settings.bots&&pads.role===H.settings.role)return;
  if(H.phase!=='lobby'&&pads.length)return;
  const grid=$('#pads');
  pads.forEach(p=>{p.dead=true;clearTimeout(p.botT)});
  grid.innerHTML='';fits.splice(1);
  pads=[];
  for(let n=0;n<6;n++){
    const cell=document.createElement('div');cell.className='padcell';grid.appendChild(cell);
    const human=n===0&&H.settings.role==='play';
    pads.push(new Pad(cell,'p'+(n+1),{n,label:human?'Pad 1 · you':`Pad ${n+1}`,name:DEFAULT_NAMES[n],bot:H.settings.bots&&!human}));
  }
  if(H.settings.toddler){const cell=document.createElement('div');cell.className='padcell';grid.appendChild(cell);pads.push(new Pad(cell,'tod',{label:'Toddler',toddler:true}))}
  pads.botsSetting=H.settings.bots;pads.role=H.settings.role;
  H.players.forEach(p=>net.send(p.id,padView(p)));
  if(H.settings.toddler)net.send('tod',todView());
}

/* offline: on a real host (jermolene.com) the page caches itself; inside the Claude artifact this is skipped */
if('serviceWorker' in navigator&&location.protocol==='https:'&&document.querySelector('link[rel=manifest]')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* ============ start-up by mode ============ */
function guestId(kind,persist){
  if(kind==='toddler')return 'tod';
  const S=persist?localStorage:sessionStorage; // phones keep their id so a rejoin gets the same podium; windows on one iPad each need their own
  let id=null;try{id=S.getItem('qb.pid')}catch(e){}
  if(!id){id='g'+Math.random().toString(36).slice(2,9);try{S.setItem('qb.pid',id)}catch(e){}}
  return id;
}
if(MODE==='pad'||MODE==='toddler'){
  document.body.classList.add('solo');
  $('#app').hidden=true;
  const cell=document.createElement('div');cell.className='solocell';document.body.appendChild(cell);
  if(JOIN_CODE){ // opened from the projector's QR: connect over the LAN
    try{history.replaceState(null,'',location.pathname+location.search+'#pad')}catch(e){}
    const pid=guestId('pad',true);
    const pad=new Pad(cell,pid,{solo:true,label:'Buzzer',rtc:JOIN_CODE,link:cb=>{const L={g:null,send:m=>L.g&&L.g.send(m)};return L}});
    pad.render({s:'rtcjoin'});window.__soloPad=pad;
  } else {
    const pid=guestId(MODE);
    new Pad(cell,pid,{solo:true,toddler:MODE==='toddler',label:MODE==='toddler'?'Toddler':'Buzzer',link:cb=>makeChannelGuest(pid,cb)});
  }
} else {
  fitBox($('#stageFit'),1600,900,()=>Math.max(260,innerHeight*(MODE==='host'?.8:.62)));
  if(LAN()){net.rtc.onChange=refreshJoinQR;net.rtc.start().catch(e=>{net.rtc.status='This device can’t make join codes: '+e.message;refreshJoinQR()})}
  buildPads();sync();requestAnimationFrame(frame);
}
</script>
