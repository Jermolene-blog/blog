<title>Bowling Bear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen top-down lane on a forest floor; HUD cards hug the screen edges, rotated to face each seat */
:root{
  --pine:#0f2219; --pine2:#183427; --cream:#f7ecd4; --honey:#f2a93b; --bark:#3a2618; --ink:#0a140f;
  --display:"Bowlby One SC", "Arial Black", Impact, sans-serif;
  --ui:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;background:var(--pine);overflow:hidden;overscroll-behavior:none}
html{box-sizing:border-box;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:var(--cream);font-family:var(--ui)}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(4,10,7,.55) 100%)}
.layer{position:fixed;inset:0;pointer-events:none}
.layer > *{pointer-events:auto}

/* score cards */
.card{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));background:rgba(9,20,14,.82);border:2px solid color-mix(in srgb,var(--pc) 35%,transparent);border-radius:14px;padding:5px 8px 6px;box-sizing:border-box;transition:box-shadow .3s,border-color .3s,opacity .3s;cursor:pointer}
.card.active{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 30%,transparent),0 0 26px color-mix(in srgb,var(--pc) 55%,transparent)}
.card .top{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.card .nm{font-weight:700;font-size:17px;color:var(--pc);overflow:hidden;text-overflow:ellipsis}
.card .tag{font-size:11px;font-weight:600;letter-spacing:.08em;padding:0 5px;border-radius:5px;background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--cream)}
.card .tot{margin-left:auto;font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.card .frames{display:grid;gap:2px;margin-top:4px}
.card .f{background:rgba(247,236,212,.07);border-radius:4px;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.card .f.cur{background:color-mix(in srgb,var(--pc) 28%,transparent)}
.card .mk{display:flex;justify-content:flex-end;font-size:11px;font-weight:700;line-height:13px;height:13px}
.card .mk i{font-style:normal;width:11px;text-align:center}
.card .mk i.x{color:var(--honey)}
.card .cs{font-size:12px;font-weight:600;line-height:13px;height:13px;color:rgba(247,236,212,.85)}
.card.compact .frames{display:none}
.card.compact .top{flex-direction:column;align-items:flex-start;gap:0}
.card.compact .tot{margin-left:0;font-size:26px}
.card.compact .sub{display:block}
.card .sub{display:none;font-size:13px;font-weight:600;opacity:.8;white-space:nowrap}

/* toast */
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));font-family:var(--display);font-size:clamp(34px,8vmin,74px);color:var(--honey);text-shadow:0 3px 0 var(--bark),0 0 30px rgba(0,0,0,.6);-webkit-text-stroke:2px var(--bark);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1)}
.toast.small{font-size:clamp(20px,4.6vmin,36px);color:var(--cream);-webkit-text-stroke:1px var(--bark)}
.toast.on{opacity:1}
.hint{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--cream);background:rgba(9,20,14,.75);padding:3px 10px;border-radius:20px;border:1.5px solid var(--pc,var(--honey));pointer-events:none;white-space:nowrap;transition:opacity .3s}

/* buttons */
button{font-family:var(--ui);color:inherit}
.iconbtn{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid rgba(247,236,212,.35);background:rgba(9,20,14,.75);transform:translate(-50%,-50%);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn:focus-visible,.btn:focus-visible,.seat:focus-visible,.pill button:focus-visible{outline:3px solid var(--honey);outline-offset:2px}

/* setup */
#setup{background:radial-gradient(ellipse at center,rgba(9,20,14,.35),rgba(9,20,14,.8))}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:min(340px,86vw);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.title{font-family:var(--display);font-size:clamp(40px,9vmin,72px);line-height:.9;color:var(--honey);-webkit-text-stroke:2px var(--bark);text-shadow:0 4px 0 var(--bark)}
.title small{display:block;font-size:.32em;color:var(--cream);-webkit-text-stroke:0;text-shadow:none;letter-spacing:.12em;margin-top:8px;font-family:var(--ui);font-weight:700}
.row{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.pill{display:flex;background:rgba(247,236,212,.1);border-radius:999px;padding:3px}
.pill button{border:0;background:transparent;font-size:16px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer}
.pill button[aria-pressed="true"]{background:var(--honey);color:var(--ink)}
.btn{font-family:var(--display);font-size:26px;letter-spacing:.04em;padding:10px 36px 12px;border-radius:999px;border:0;background:var(--honey);color:var(--ink);box-shadow:0 5px 0 var(--bark);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bark)}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid rgba(247,236,212,.4);box-shadow:none;font-size:18px;padding:7px 20px}
.credit{font-size:11px;opacity:.6;max-width:300px;line-height:1.3}
.credit a{color:inherit}
.seat{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:150px;padding:10px 8px;border-radius:18px;border:2.5px dashed rgba(247,236,212,.35);background:rgba(9,20,14,.7);text-align:center;cursor:pointer;color:var(--cream)}
.seat .sn{font-family:var(--display);font-size:22px;color:var(--pc)}
.seat .st{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;margin-top:2px}
.seat .sh{font-size:11px;opacity:.6;margin-top:2px}
.seat[data-kind="human"],.seat[data-kind="cpu"]{border-style:solid;border-color:var(--pc);box-shadow:0 0 20px color-mix(in srgb,var(--pc) 35%,transparent)}
.seat[data-kind="empty"] .sn{opacity:.35}

/* results / sheet / menu */
.sheet{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));background:rgba(9,20,14,.92);border:2px solid var(--honey);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:stretch;box-sizing:border-box}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;color:var(--honey);font-size:26px;text-align:center}
.sheet .rk{display:flex;gap:10px;align-items:baseline;font-size:20px;font-weight:700}
.sheet .rk b{font-family:var(--display);font-weight:400;width:40px;color:var(--cream);opacity:.7}
.sheet .rk span{flex:1;color:var(--pc)}
.sheet .rk em{font-style:normal;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.sheet .btns{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.sheet .btns .btn{font-size:20px;padding:8px 22px 10px}
.full{display:grid;gap:2px}
.full .f .mk{font-size:13px;height:15px;line-height:15px}
.full .f .mk i{width:13px}
.full .f .cs{font-size:15px;height:17px;line-height:17px}
.full .f{background:rgba(247,236,212,.08);border-radius:4px;text-align:center}
.full .fh{font-size:10px;opacity:.55;text-align:center;font-weight:700}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--honey);font-size:28px;background:var(--pine)}
@media (prefers-reduced-motion: reduce){.toast{transition:opacity .2s}}
</style>

  const s = drag.samples.slice(-120), arr = trailGeo.attributes.position.array;
  s.forEach((q, i) => { arr[i*3] = q.x; arr[i*3 + 1] = 0.006; arr[i*3 + 2] = q.z; });

let trailFade = 0;

/* ------------------------------------------------------------------ AI */

async function aiThrow(id) {

/* ------------------------------------------------------------------ swing */
let swing = null;
function swingTo(theta, dur = 1.2) {
  const from = pivot.rotation.y;
  let d = ((theta - from + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI;
  if (Math.abs(d) < 1e-3) { pivot.rotation.y = theta; return Promise.resolve(); }
  return new Promise(res => { swing = { from, d, t: 0, dur, res }; });
}

/* ------------------------------------------------------------------ bear choreography */
function bearSide(seat) {

  const th = seatGeom(seat).theta, saved = pivot.rotation.y; pivot.rotation.y = th;
  let best = 1, bestScore = -1e9;
  for (const s of [-1, 1]) {
    const w = laneToWorld(s * 1.3, 0.5);
    const m = Math.min(L.Ww/2 - Math.abs(w.x), L.Hw/2 - Math.abs(w.z));
    if (m > bestScore) { bestScore = m; best = s; }
  }

}
function bearHome(seat) {
  const side = bearSide(seat);
  bearGo(() => laneToWorld(side * 1.25, -0.25, 0), { speed: 3.6, idle: 'Sitting_Idle_02', face: () => laneForwardHeading() + side * 0.5 });
  return side;
}

/* ------------------------------------------------------------------ game flow */
let game = null;
function toSetup() {
  session++; game = null; waiters.length = 0; aim = null; drag = null; paused = false; cam.want = 0;
  hud.innerHTML = ''; cards = [];
  setupEl.hidden = false; buildSetup();
  ring.visible = false; trailGeo.setDrawRange(0, 0); hintEl.style.opacity = 0;
  rackFull(); placeBall(0, BALL_START_Z); ball.mesh.visible = false;
  pivot.rotation.y = seatGeom(0).theta;
  bearGo(() => laneToWorld(-1.25, -2.0, 0), { speed: 2.5, idle: 'Sitting_Idle_02', face: () => laneForwardHeading() + Math.PI/2 });
}
function startGame() {
  session++; const id = session; waiters.length = 0; aim = null; drag = null; paused = false; cam.want = 0;
  setupEl.hidden = true; setupEl.innerHTML = '';
  const n = seatCount();
  const players = [];
  for (let i = 0; i < n; i++) if (prefs.kinds[i] !== 'empty') players.push({ seat: i, kind: prefs.kinds[i], name: SEATS[i].name, rolls: [], hinted: false });
  if (!players.length) { toSetup(); return; }
  game = { N: prefs.frames, players, frame: 0, current: null, over: false, seat: null };
  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}
  buildCards();

}
async function run(id) {
  for (let f = 0; f < game.N; f++) {
    game.frame = f;
    for (const p of game.players) { await playFrame(p, id); guard(id); }
  }
  game.over = true; game.current = null; updateCards();
  const ranked = [...game.players].sort((a, b) => finalTotal(b) - finalTotal(a));
  const w = ranked[0];
  await turnTo_(w, id, true);
  const tie = ranked.length > 1 && finalTotal(ranked[0]) === finalTotal(ranked[1]);
  toast(ranked.length === 1 ? `${finalTotal(w)} points` : tie ? 'Tie game!' : `${w.name} wins!`, { seat: w.seat, dur: 2.2 });
  sfx.roar();
  await bearReact('Trans_Stand_to_StandHind', { then: 'StandHind_Idle_01' }); guard(id);
  await wait(0.8); guard(id);
  showResults();
}
async function turnTo_(p, id, quiet = false) {
  game.current = p; updateCards();
  const g = seatGeom(p.seat);
  if (game.seat !== p.seat) {
    game.seat = p.seat;
    bearHome(p.seat);
    await swingTo(g.theta); guard(id);
  } else bearHome(p.seat);
}
async function playFrame(p, id) {
  await turnTo_(p, id); guard(id);
  const last = game.frame === game.N - 1;
  rackFull();
  if (!(game.players.length === 1 && game.frame === 0)) toast(`${p.name}`, { small: true, seat: p.seat, dur: 1.0 });
  const balls = [];
  let ballNo = 0, fresh = true;
  while (true) {
    const before = standingPins().length;
    const knocked = await bowlOne(p, id); guard(id);
    balls.push(knocked); p.rolls.push(knocked); updateCards();

    await react(res, knocked, p, id); guard(id);
    if (!last) {
      if (ballNo === 0 && knocked === 10) break;
      if (ballNo === 1) break;
      ballNo = 1; fresh = false; await sweep(id); continue;
    }
    const [a, b] = balls;
    if (ballNo === 0) { ballNo = 1; if (a === 10) { rackFull(); fresh = true; } else { fresh = false; await sweep(id); } continue; }

}
async function bowlOne(p, id) {

  ball.mesh.scale.setScalar(0.01);

async function react(res, knocked, p, id) {

    await bearReact('Attack_StandAngry_01_High', { ts: 1.2 }); guard(id);
  } else if (res === 'spare') {
    toast('SPARE!', { seat: p.seat, dur: 1.5 }); sfx.cheer();
    await bearReact('Trans_Stand_to_StandHind', { ts: 1.6 }); guard(id);
    await wait(0.2);
  } else if (res === 'gutter') {
    toast('Gutter ball', { small: true, seat: p.seat, dur: 1.4 }); sfx.womp();
    await bearReact('Hit_Sitting_F01', { ts: 1.1 }); guard(id);
  } else if (res === 'miss') {
    toast('Missed!', { small: true, seat: p.seat, dur: 1.2 }); sfx.womp(); await wait(0.9);
  } else {
    toast(`${knocked} pin${knocked === 1 ? '' : 's'}`, { small: true, seat: p.seat, dur: 1.1 }); await wait(0.9);

async function sweep(id, all = false) {

  for (const p of down) p.shrink = 1;
  await until(() => gameTime - t0 > 0.35); guard(id);
  for (const p of down) { deactivatePin(p); p.mesh.visible = false; }
  if (!all) for (const p of pins) if (p.active) {
    const b = p.body; setPinUpright(p, THREE.MathUtils.clamp(b.position.x, -LANE_HW + 0.07, LANE_HW - 0.07), Math.max(DECK_END + 0.08, Math.min(b.position.z, HEAD_Z + 0.05)));

/* ------------------------------------------------------------------ chase camera */
const CHASE_FOV = 52;
const cam = { oPos: new THREE.Vector3(), oQuat: new THREE.Quaternion(), k: 0, want: 0,
  pos: new THREE.Vector3(), look: new THREE.Vector3(), cPos: new THREE.Vector3(), cQuat: new THREE.Quaternion(), helper: new THREE.PerspectiveCamera(), seat: 0 };
function chaseTargets(out1, out2) {

  const b = ball.inWorld ? ball.body.position : ball.mesh.position;
  const f = Math.max(Math.min(b.z, BALL_START_Z), HEAD_Z + 0.9);
  const bx = THREE.MathUtils.clamp(b.x, -LANE_HW, LANE_HW);
  out1.set(bx * 0.45, 0.78, f + 1.6);
  out2.set(bx * 0.25, 0.04, f - 1.6);
}
function startChase(seat) {
  cam.seat = seat;
  chaseTargets(cam.pos, cam.look);
  cam.want = 1;
}
function updateCamera(dt) {
  if (cam.want || cam.k > 0) {
    if (cam.want) {
      const p = new THREE.Vector3(), l = new THREE.Vector3();

      cam.pos.lerp(p, a); cam.look.lerp(l, a);

  const wp = lane.localToWorld(cam.pos.clone()), wl = lane.localToWorld(cam.look.clone());
  const h = cam.helper; h.position.copy(wp); h.up.set(0, 1, 0); h.lookAt(wl);

/* ------------------------------------------------------------------ main loop */
let lastT = performance.now();
const proj = new THREE.Vector3();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if (!paused) {
    gameTime += dt;
    world.step(1/150, dt, 8);
    tickWaiters();
  }
  if (swing) {
    swing.t += dt; const k = Math.min(1, swing.t / swing.dur), e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;

    if (!p.active && !p.shrink) continue;
    if (p.active) { p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); }
    if (p.shrink) { p.shrink = Math.max(0.001, p.shrink - dt * 3); p.mesh.scale.setScalar(p.shrink); if (p.shrink <= 0.001) p.shrink = 0; }

    const onLane = ball.body.position.y > 0 && ball.body.position.y < BALL_R + 0.03 && ball.body.position.z > DECK_END;
    sfx.roll(onLane ? Math.hypot(ball.body.velocity.x, ball.body.velocity.z) : 0);
  }
  if (ring.visible) { ring.position.set(ball.mesh.position.x, 0.004, ball.mesh.position.z); const s = 1 + 0.12 * Math.sin(t / 180); ring.scale.setScalar(s); }
  if (trailFade > 0) { trailFade -= dt * 1.5; trail.material.opacity = Math.max(0, trailFade) * 0.8; if (trailFade <= 0) { trailGeo.setDrawRange(0, 0); trail.material.opacity = 0.8; } }
  bearUpdate(paused ? 0 : dt);
  if (hintEl.dataset.on && game && game.current) {
    lane.updateMatrixWorld(true);
    proj.copy(ball.mesh.position); lane.localToWorld(proj); proj.project(camera);
    const g = seatGeom(game.current.seat);
    const x = (proj.x + 1) / 2 * L.W + g.ux * 58, y = (1 - proj.y) / 2 * L.H + g.uy * 58;
    hintEl.style.left = x + 'px'; hintEl.style.top = y + 'px'; hintEl.style.setProperty('--r', g.rot + 'rad');
  }
  updateCamera(dt);
  renderer.render(scene, camera);
}

/* ------------------------------------------------------------------ boot */
async function boot() {
  try { await Promise.race([document.fonts.load('40px "Bowlby One SC"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  buildLane(); buildPins(); buildBall();
  lane.add(ring); lane.add(trail);
  layout();
  try { await loadBear(); } catch (e) { console.error('bear load failed', e); }
  bear.pos.copy(laneToWorld(-1.25, -2.0, 0));
  document.getElementById('loading').remove();
  toSetup();
  requestAnimationFrame(loop);
}
window.__bb = { bearReact, play, get game() { return game; }, pins, ball, bear, standingPins, scoreFrames, launchBall, get aim() { return aim; }, prefs, startGame, toSetup, layout, seatGeom, L, pivot, laneToWorld, camera, lane };
boot();
